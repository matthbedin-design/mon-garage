<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de bord — Entretien véhicules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1D1E; --surface:#242628; --surface-2:#2B2E30; --border:#35383A;
    --text:#ECECE8; --text-muted:#9B9E9F; --yellow:#F0B429; --red:#D9534F; --green:#5FAE7D;
    --accent: var(--yellow);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app{ max-width:720px; margin:0 auto; padding:20px 16px 80px; }
  header.topbar{ display:flex; align-items:center; gap:12px; padding:4px 2px 18px; flex-wrap:wrap; }
  .brand-mark{ width:38px;height:38px;flex:none; display:flex;align-items:center;justify-content:center; border:2px solid var(--yellow); border-radius:50%; color:var(--yellow); }
  .brand-text{ flex:1; min-width:180px; }
  .brand-text h1{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.06em; font-size:20px; margin:0; text-transform:uppercase; }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--text-muted); }
  .top-actions{ display:flex; gap:6px; }

  nav.tabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto; }
  .tab-btn{
    font-family:'Oswald',sans-serif; background:none; border:none; color:var(--text-muted);
    font-size:14px; letter-spacing:0.04em; text-transform:uppercase; padding:10px 14px 12px;
    cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; transition:color .15s ease;
  }
  .tab-btn.active{ color:var(--text); }
  .tab-add{ font-family:'Oswald',sans-serif; background:none; border:none; color:var(--text-muted); font-size:18px; padding:8px 12px 12px; cursor:pointer; flex:none; }
  .tab-add:hover{ color:var(--yellow); }

  .vehicle-header{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 16px; margin-bottom:22px; position:relative; border-top:3px solid var(--accent); }
  .vehicle-header .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .vehicle-name{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; margin:0; }
  .vehicle-plate-input{ background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:13px; padding:2px 0; margin-top:4px; width:150px; }
  .vehicle-plate-input:focus{ outline:none; border-color:var(--accent); color:var(--text); }
  
  .header-btns{ display:flex; gap:6px; }
  .icon-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); padding:6px 10px; border-radius:8px; display:inline-flex;align-items:center;justify-content:center; gap:6px; cursor:pointer; flex:none; font-size:12px; font-weight:500; }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent); }

  .mileage-row{ display:flex; align-items:baseline; gap:8px; margin-top:14px; }
  .mileage-input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; border-radius:8px; padding:4px 10px; width:160px; }
  .mileage-input:focus{ outline:none; border-color:var(--accent); }
  .mileage-unit{ font-family:'JetBrains Mono',monospace; color:var(--text-muted); font-size:13px; }

  .doc-section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .doc-section-label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; }
  .doc-chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .doc-chip{ position:relative; width:64px; }
  .doc-thumb{ width:64px;height:64px;border-radius:8px; background:var(--surface-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; overflow:hidden; cursor:pointer; color:var(--text-muted); }
  .doc-thumb img{ width:100%; height:100%; object-fit:cover; }
  .doc-name{ font-size:10px; color:var(--text-muted); text-align:center; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc-remove{ position:absolute; top:-6px; right:-6px; width:18px;height:18px;border-radius:50%; background:var(--red); color:#fff; border:none; font-size:10px; line-height:18px; text-align:center; cursor:pointer; padding:0; }
  .doc-add-btn{ width:64px;height:64px;border-radius:8px; border:1px dashed var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:22px; display:flex;align-items:center;justify-content:center; flex:none; }
  .doc-add-btn:hover{ color:var(--yellow); border-color:var(--yellow); }

  h2.section-title{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin:0 0 10px 2px; display:flex; justify-content:space-between; align-items:center; }
  section{ margin-bottom:26px; }

  .gauge-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .gauge-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .gauge-label{ font-size:14px; font-weight:600; }
  .gauge-status{ font-family:'JetBrains Mono',monospace; font-size:12px; }
  .gauge-track{ height:8px; border-radius:4px; background:var(--surface-2); position:relative; overflow:hidden; border:1px solid var(--border); }
  .gauge-track .fill{ height:100%; border-radius:4px 0 0 4px; transition:width .3s ease; }
  .gauge-empty{ font-size:12.5px; color:var(--text-muted); font-style:italic; }

  .history-row{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:7px; cursor:pointer; }
  .history-row:hover{ border-color:var(--accent); }
  .history-icon{ width:34px;height:34px;flex:none; border-radius:8px; background:var(--surface-2); display:flex;align-items:center;justify-content:center; color:var(--accent); position:relative; }
  .history-icon .doc-dot{ position:absolute; bottom:-2px; right:-2px; width:9px;height:9px;border-radius:50%; background:var(--yellow); border:2px solid var(--surface); }
  .history-main{ flex:1; min-width:0; }
  .history-type{ font-size:14px; font-weight:600; }
  .history-notes{ font-size:12.5px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-meta{ text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); flex:none; }
  .history-meta .km{ color:var(--text); font-size:13px; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--text-muted); font-size:13.5px; border:1px dashed var(--border); border-radius:12px; }

  .fab{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); max-width:688px; width:calc(100% - 32px); display:flex; justify-content:flex-end; pointer-events:none; z-index:10; }
  .add-btn{ pointer-events:auto; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; background:var(--yellow); color:#1B1D1E; border:none; font-size:14px; font-weight:600; padding:13px 20px; border-radius:30px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .add-btn:hover{ filter:brightness(1.08); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px 20px 24px; }
  @media (min-width:600px){ .modal-overlay{ align-items:center; } .modal{ border-radius:16px; } }
  .modal h3{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:17px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
  .field select, .field input, .field textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; padding:10px 11px; border-radius:9px; }
  .field input[type=number], .field input[type=date]{ font-family:'JetBrains Mono',monospace; }
  .field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:60px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:12px; }
  .btn{ flex:1; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:13.5px; font-weight:600; padding:12px; border-radius:9px; border:1px solid var(--border); cursor:pointer; background:transparent; color:var(--text); text-align:center; text-decoration:none; }
  .btn-primary{ background:var(--yellow); color:#1B1D1E; border:none; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); }
  .btn-danger{ background:transparent; color:var(--red); border-color:var(--red); flex:none; padding:12px 16px; }

  .type-row{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
  .type-row:last-child{ border-bottom:none; }
  .type-row input[type=checkbox]{ width:16px;height:16px; accent-color: var(--yellow); flex:none; }
  .type-row .name{ flex:1; font-size:13.5px; }
  .type-row.disabled .name{ color:var(--text-muted); }
  .type-row input[type=number]{ width:58px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:6px 5px; border-radius:6px; text-align:center; }
  .type-row .unit{ font-size:11px; color:var(--text-muted); width:28px; }
  .trash-btn{ background:none; border:none; color:var(--text-muted); cursor:pointer; flex:none; padding:4px; display:flex; }
  .trash-btn:hover{ color:var(--red); }

  .add-type-row{ display:flex; gap:8px; margin-top:12px; }
  .add-type-row input{ flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:13.5px; padding:9px 11px; border-radius:9px; }
  .add-type-row button{ flex:none; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; }
  .add-type-row button:hover{ border-color:var(--yellow); color:var(--yellow); }

  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:4px; }
  .swatch{ width:32px;height:32px;border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch.selected{ border-color:var(--text); }

  .journal-row{ padding:10px 0; border-bottom:1px solid var(--border); }
  .journal-row:last-child{ border-bottom:none; }
  .journal-meta{ display:flex; gap:8px; align-items:center; margin-bottom:3px; }
  .journal-tag{ padding:2px 8px; border-radius:10px; font-size:10px; color:#fff; font-family:'Oswald',sans-serif; letter-spacing:0.03em; text-transform:uppercase; }
  .journal-time{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-muted); }
  .journal-msg{ font-size:13.5px; }

  .hr{ border:none; border-top:1px solid var(--border); margin:18px 0; }
  .loading{ text-align:center; padding:60px 10px; color:var(--text-muted); font-size:13.5px; }

  .export-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; }
  .export-box h4{ margin:0 0 6px; font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase; color:var(--yellow); }
  .export-box p{ margin:0 0 10px; font-size:12px; color:var(--text-muted); line-height:1.4; }

  @media print {
    body { background: #fff !important; color: #000 !important; }
    .topbar, .tabs, .fab, .icon-btn, .doc-add-btn, .doc-remove, #addBtn, .modal-overlay, .header-btns { display: none !important; }
    .app { max-width: 100% !important; padding: 0 !important; }
    .vehicle-header, .gauge-card, .history-row { border: 1px solid #ccc !important; background: #fff !important; color: #000 !important; page-break-inside: avoid; box-shadow: none !important; }
    .vehicle-name, .history-type, .km { color: #000 !important; }
    .mileage-input, .vehicle-plate-input { border: none !important; background: transparent !important; color: #000 !important; padding: 0 !important; }
    .section-title { color: #333 !important; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand-mark">🔧</div>
    <div class="brand-text">
      <h1>Carnet de Bord</h1>
      <p>Suivi d'entretien véhicule</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="exportMenuBtn" title="Sauvegarder & Exporter">💾 Export / Save</button>
      <button class="icon-btn" id="journalBtn" title="Journal d'activités">📋</button>
    </div>
  </header>

  <nav class="tabs" id="tabsNav"></nav>

  <main id="content">
    <div class="loading">Chargement des données...</div>
  </main>
</div>

<div class="fab">
  <button class="add-btn" id="addBtn">+ Nouvelle intervention</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<script>
(function(){
var PALETTE = ['#F0B429', '#E12D39', '#2EC4B6', '#3A86FF', '#8338EC', '#FF006E', '#00F5D4', '#FF9F1C'];

var DEFAULT_TYPES = [
  { id: 'vidange', label: 'Vidange moteur', km: 15000, months: 12 },
  { id: 'filtre-huile', label: 'Filtre à huile', km: 15000, months: 12 },
  { id: 'filtre-air', label: 'Filtre à air', km: 30000, months: 24 },
  { id: 'filtre-habitacle', label: 'Filtre habitacle', km: 15000, months: 12 },
  { id: 'distribution', label: 'Courroie de distribution', km: 100000, months: 60 },
  { id: 'freins-avant', label: 'Plaquettes / Disques AV', km: 40000, months: null },
  { id: 'ct', label: 'Contrôle Technique', km: null, months: 24 }
];

var state = {
  vehicles: {},
  entries: {},
  order: [],
  types: DEFAULT_TYPES.slice(),
  journal: []
};

var activeVehicleId = null;
var editingEntryId = null;

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'custom-'+Date.now();
}

function genId(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function fmtKm(km){
  if(km == null || isNaN(km)) return '—';
  return km.toLocaleString('fr-FR') + ' km';
}

function fmtDate(dStr){
  if(!dStr) return '—';
  var parts = dStr.split('-');
  if(parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
  return dStr;
}

function fmtDateTime(ts){
  if(!ts) return '—';
  var d = new Date(ts);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

function iconSvg(){
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>';
}

function gearSvg(){
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';
}

function trashSvg(){
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
}

function makeVehicle(name, color, enabledTypes){
  return {
    name: name,
    plate: '',
    color: color,
    mileage: 0,
    documents: [],
    enabledTypes: enabledTypes || DEFAULT_TYPES.map(function(t){ return t.id; }),
    intervals: {}
  };
}

function logEvent(vehicleId, message){
  var vehicleName = null;
  if(vehicleId && state.vehicles[vehicleId]){
    vehicleName = state.vehicles[vehicleId].name;
  }
  state.journal.push({
    id: genId('j'),
    ts: new Date().toISOString(),
    vehicleId: vehicleId || null,
    vehicleName: vehicleName,
    message: message
  });
}

// Persistance Locale Garantie
function persist(){
  try {
    localStorage.setItem('cb_data', JSON.stringify(state));
  } catch(e) {
    console.error('Erreur de sauvegarde locale :', e);
  }
}

function loadState(){
  try {
    var raw = localStorage.getItem('cb_data');
    if(raw){
      state = JSON.parse(raw);
    } else {
      initDefaultState();
    }
  } catch(e) {
    console.error('Erreur de chargement :', e);
    initDefaultState();
  }

  if(!state.types || !state.types.length) state.types = DEFAULT_TYPES.slice();
  if(!state.journal) state.journal = [];
  if(!state.order) state.order = [];
  if(!state.vehicles) state.vehicles = {};
  if(!state.entries) state.entries = {};

  if(state.order.length > 0 && (!activeVehicleId || !state.vehicles[activeVehicleId])){
    activeVehicleId = state.order[0];
  }

  render();
}

function initDefaultState(){
  var v1 = genId('v');
  var allTypes = DEFAULT_TYPES.map(function(t){ return t.id; });

  state = {
    vehicles: {},
    entries: {},
    order: [v1],
    types: DEFAULT_TYPES.slice(),
    journal: []
  };

  state.vehicles[v1] = makeVehicle('Mon Véhicule', PALETTE[0], allTypes);
  state.vehicles[v1].mileage = 100000;
  state.vehicles[v1].plate = 'AA-123-BB';

  state.entries[v1] = [
    { id: genId('e'), typeId: 'vidange', date: new Date().toISOString().substring(0, 10), km: 100000, notes: 'Première vidange enregistrée', documents: [] }
  ];

  logEvent(v1, 'Carnet d\'entretien initialisé');
  persist();
}

function getTypeConfig(vehicle, typeId){
  var globalType = state.types.filter(function(t){ return t.id === typeId; })[0];
  if(!globalType) return null;
  var custom = (vehicle.intervals && vehicle.intervals[typeId]) || {};
  return {
    id: globalType.id,
    label: globalType.label,
    km: custom.km !== undefined ? custom.km : globalType.km,
    months: custom.months !== undefined ? custom.months : globalType.months
  };
}

function getLatestEntry(vehicleId, typeId){
  var list = state.entries[vehicleId] || [];
  var filtered = list.filter(function(e){ return e.typeId === typeId; });
  if(!filtered.length) return null;
  filtered.sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.km || 0) - (a.km || 0);
  });
  return filtered[0];
}

function computeStatus(vehicleId, typeId){
  var v = state.vehicles[vehicleId];
  if(!v) return null;
  var cfg = getTypeConfig(v, typeId);
  if(!cfg) return null;

  var last = getLatestEntry(vehicleId, typeId);
  var currentKm = v.mileage || 0;

  var result = {
    cfg: cfg,
    last: last,
    pct: 0,
    remainingKm: null,
    remainingDays: null,
    isOverdue: false,
    isWarning: false
  };

  if(!last) return result;

  var pctKm = 0;
  if(cfg.km && cfg.km > 0){
    var doneKm = currentKm - (last.km || 0);
    result.remainingKm = cfg.km - doneKm;
    pctKm = Math.min(100, Math.max(0, (doneKm / cfg.km) * 100));
    if(result.remainingKm <= 0) result.isOverdue = true;
    else if(result.remainingKm <= 1000) result.isWarning = true;
  }

  var pctDays = 0;
  if(cfg.months && cfg.months > 0 && last.date){
    var lastDate = new Date(last.date);
    var nextDate = new Date(lastDate);
    nextDate.setMonth(nextDate.getMonth() + cfg.months);
    
    var now = new Date();
    var diffMs = nextDate - now;
    result.remainingDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    
    var totalDays = cfg.months * 30.4375;
    var doneDays = totalDays - result.remainingDays;
    pctDays = Math.min(100, Math.max(0, (doneDays / totalDays) * 100));

    if(result.remainingDays <= 0) result.isOverdue = true;
    else if(result.remainingDays <= 30) result.isWarning = true;
  }

  result.pct = Math.max(pctKm, pctDays);
  return result;
}

function render(){
  renderTabs();
  renderContent();
}

function renderTabs(){
  var nav = document.getElementById('tabsNav');
  if(!nav) return;
  
  var html = state.order.map(function(id){
    var v = state.vehicles[id];
    if(!v) return '';
    var activeClass = (id === activeVehicleId) ? ' active' : '';
    var style = (id === activeVehicleId) ? 'border-bottom-color:' + (v.color || 'var(--yellow)') + '; color:' + (v.color || 'var(--yellow)') + ';' : '';
    return '<button class="tab-btn' + activeClass + '" style="' + style + '" data-id="' + id + '">' + escapeHtml(v.name) + '</button>';
  }).join('');

  html += '<button class="tab-add" id="addVehicleTabBtn" title="Ajouter un véhicule">+</button>';
  nav.innerHTML = html;

  Array.prototype.forEach.call(nav.querySelectorAll('.tab-btn'), function(btn){
    btn.onclick = function(){
      activeVehicleId = btn.getAttribute('data-id');
      render();
    };
  });

  var addTab = document.getElementById('addVehicleTabBtn');
  if(addTab) addTab.onclick = openAddVehicleModal;
}

function renderContent(){
  var content = document.getElementById('content');
  if(!content) return;

  var v = state.vehicles[activeVehicleId];
  if(!v){
    content.innerHTML = '<div class="empty-state">Aucun véhicule enregistré.<br><br><button class="btn btn-primary" style="width:auto; display:inline-block;" onclick="openAddVehicleModal()">+ Ajouter un véhicule</button></div>';
    return;
  }

  document.documentElement.style.setProperty('--accent', v.color || 'var(--yellow)');
  var entries = state.entries[activeVehicleId] || [];

  var html = '<div class="vehicle-header" style="--accent:' + (v.color || 'var(--yellow)') + '">';
  html += '<div class="row1">';
  html += '<div>';
  html += '<h1 class="vehicle-name">' + escapeHtml(v.name) + '</h1>';
  html += '<input type="text" class="vehicle-plate-input" id="v-plate" value="' + escapeHtml(v.plate || '') + '" placeholder="Immatriculation (ex: AA-123-BB)">';
  html += '</div>';
  
  html += '<div class="header-btns">';
  html += '<button class="icon-btn" onclick="window.print()" title="Imprimer ou Sauvegarder en PDF">🖨️ Imprimer / PDF</button>';
  html += '<button class="icon-btn" id="settingsBtn" title="Réglages du véhicule">' + gearSvg() + ' Réglages</button>';
  html += '</div>';

  html += '</div>';

  html += '<div class="mileage-row">';
  html += '<input type="number" class="mileage-input" id="v-km" value="' + (v.mileage || 0) + '">';
  html += '<span class="mileage-unit">km parcourus</span>';
  html += '</div>';

  html += '<div class="doc-section">';
  html += '<div class="doc-section-label">Documents (carte grise, assurance...)</div>';
  html += '<div class="doc-chip-row">';
  
  (v.documents || []).forEach(function(doc, idx){
    html += '<div class="doc-chip">';
    if(doc.type && doc.type.indexOf('image/') === 0){
      html += '<div class="doc-thumb" onclick="window.open(\'' + doc.data + '\',\'_blank\')"><img src="' + doc.data + '" alt="' + escapeHtml(doc.name) + '"></div>';
    } else {
      html += '<div class="doc-thumb" onclick="window.open(\'' + doc.data + '\',\'_blank\')">📄</div>';
    }
    html += '<div class="doc-name" title="' + escapeHtml(doc.name) + '">' + escapeHtml(doc.name) + '</div>';
    html += '<button class="doc-remove" data-idx="' + idx + '" title="Supprimer">✕</button>';
    html += '</div>';
  });

  html += '<button class="doc-add-btn" id="addDocBtn" title="Ajouter un document">+</button>';
  html += '<input type="file" id="docFileInput" style="display:none;" accept="image/*,application/pdf">';
  html += '</div></div>';
  html += '</div>';

  // Section : Échéances
  html += '<section>';
  html += '<h2 class="section-title">Échéances d\'entretien</h2>';
  
  var enabled = v.enabledTypes || [];
  if(!enabled.length){
    html += '<div class="gauge-empty">Aucun type d\'entretien activé pour ce véhicule.</div>';
  } else {
    enabled.forEach(function(typeId){
      var st = computeStatus(activeVehicleId, typeId);
      if(!st) return;

      var barColor = 'var(--green)';
      if(st.isOverdue) barColor = 'var(--red)';
      else if(st.isWarning) barColor = 'var(--yellow)';

      var statusText = 'Aucun historique';
      if(st.last){
        var parts = [];
        if(st.remainingKm !== null){
          if(st.remainingKm <= 0) parts.push('Dépassé de ' + Math.abs(st.remainingKm) + ' km');
          else parts.push('dans ' + st.remainingKm.toLocaleString('fr-FR') + ' km');
        }
        if(st.remainingDays !== null){
          if(st.remainingDays <= 0) parts.push('Dépassé de ' + Math.abs(st.remainingDays) + ' j');
          else parts.push('dans ' + st.remainingDays + ' j');
        }
        statusText = parts.join(' ou ');
      }

      html += '<div class="gauge-card">';
      html += '<div class="gauge-top">';
      html += '<span class="gauge-label">' + escapeHtml(st.cfg.label) + '</span>';
      html += '<span class="gauge-status" style="color:' + barColor + ';">' + escapeHtml(statusText) + '</span>';
      html += '</div>';
      html += '<div class="gauge-track">';
      html += '<div class="fill" style="width:' + st.pct + '%; background:' + barColor + ';"></div>';
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</section>';

  // Section : Historique
  html += '<section>';
  html += '<h2 class="section-title">Historique complet (' + entries.length + ')</h2>';
  
  if(!entries.length){
    html += '<div class="empty-state">Aucune intervention enregistrée pour ce véhicule.</div>';
  } else {
    var sortedEntries = entries.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.km || 0) - (a.km || 0);
    });

    sortedEntries.forEach(function(entry){
      var typeObj = state.types.filter(function(t){ return t.id === entry.typeId; })[0];
      var label = typeObj ? typeObj.label : entry.typeId;
      var hasDocs = entry.documents && entry.documents.length > 0;

      html += '<div class="history-row" data-entry-id="' + entry.id + '">';
      html += '<div class="history-icon" style="color:' + (v.color || 'var(--yellow)') + ';">' + iconSvg();
      if(hasDocs) html += '<span class="doc-dot" title="Documents joints"></span>';
      html += '</div>';
      html += '<div class="history-main">';
      html += '<div class="history-type">' + escapeHtml(label) + '</div>';
      if(entry.notes) html += '<div class="history-notes">' + escapeHtml(entry.notes) + '</div>';
      html += '</div>';
      html += '<div class="history-meta">';
      html += '<div class="km">' + fmtKm(entry.km) + '</div>';
      html += '<div>' + fmtDate(entry.date) + '</div>';
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</section>';

  content.innerHTML = html;

  // Bindings
  var plateInput = document.getElementById('v-plate');
  if(plateInput){
    plateInput.onchange = function(){
      v.plate = plateInput.value.trim();
      logEvent(activeVehicleId, 'Immatriculation mise à jour');
      persist();
    };
  }

  var kmInput = document.getElementById('v-km');
  if(kmInput){
    kmInput.onchange = function(){
      var val = parseInt(kmInput.value, 10);
      if(!isNaN(val) && val !== v.mileage){
        v.mileage = val;
        logEvent(activeVehicleId, 'Kilométrage mis à jour : ' + fmtKm(val));
        persist();
        renderContent();
      }
    };
  }

  var settingsBtn = document.getElementById('settingsBtn');
  if(settingsBtn) settingsBtn.onclick = openSettingsModal;

  var addDocBtn = document.getElementById('addDocBtn');
  var docFileInput = document.getElementById('docFileInput');
  if(addDocBtn && docFileInput){
    addDocBtn.onclick = function(){ docFileInput.click(); };
    docFileInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(evt){
        if(!v.documents) v.documents = [];
        v.documents.push({ name: file.name, type: file.type, data: evt.target.result });
        logEvent(activeVehicleId, 'Document ajouté : ' + file.name);
        persist();
        renderContent();
      };
      reader.readAsDataURL(file);
    };
  }

  Array.prototype.forEach.call(content.querySelectorAll('.doc-remove'), function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      if(!isNaN(idx) && v.documents && v.documents[idx]){
        var removed = v.documents.splice(idx, 1)[0];
        logEvent(activeVehicleId, 'Document supprimé : ' + removed.name);
        persist();
        renderContent();
      }
    };
  });

  Array.prototype.forEach.call(content.querySelectorAll('.history-row'), function(row){
    row.onclick = function(){
      var entryId = row.getAttribute('data-entry-id');
      openEntryModal(entryId);
    };
  });
}

// Modales
function openEntryModal(entryId){
  editingEntryId = entryId;
  var v = state.vehicles[activeVehicleId];
  if(!v) return;

  var entries = state.entries[activeVehicleId] || [];
  var entry = entryId ? entries.filter(function(e){ return e.id === entryId; })[0] : null;

  var enabledTypes = v.enabledTypes || [];
  var typeOptions = state.types
    .filter(function(t){ return enabledTypes.indexOf(t.id) > -1 || (entry && entry.typeId === t.id); })
    .map(function(t){
      var selected = entry && entry.typeId === t.id ? ' selected' : '';
      return '<option value="' + t.id + '"' + selected + '>' + escapeHtml(t.label) + '</option>';
    }).join('');

  var modal = document.getElementById('modal');
  var title = entry ? 'Modifier l\'intervention' : 'Nouvelle intervention';
  var dateVal = entry ? entry.date : new Date().toISOString().substring(0, 10);
  var kmVal = entry ? entry.km : v.mileage;
  var notesVal = entry ? (entry.notes || '') : '';

  modal.innerHTML =
    '<h3>' + title + ' <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    '<div class="field"><label>Type d\'intervention</label><select id="f-type">' + typeOptions + '</select></div>' +
    '<div class="row2">' +
      '<div class="field"><label>Date</label><input type="date" id="f-date" value="' + dateVal + '"></div>' +
      '<div class="field"><label>Kilométrage</label><input type="number" id="f-km" value="' + kmVal + '"></div>' +
    '</div>' +
    '<div class="field"><label>Notes / Observations</label><textarea id="f-notes" placeholder="Référence pièces, garage, remarques...">' + escapeHtml(notesVal) + '</textarea></div>' +
    '<div class="modal-actions">' +
      (entry ? '<button class="btn btn-danger" id="deleteBtn">Supprimer</button>' : '') +
      '<button class="btn btn-ghost" id="cancelBtn">Annuler</button>' +
      '<button class="btn btn-primary" id="saveBtn">Enregistrer</button>' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtn').onclick = saveEntry;
  if(entry) document.getElementById('deleteBtn').onclick = function(){ deleteEntry(entry.id); };
}

function saveEntry(){
  var typeId = document.getElementById('f-type').value;
  var date = document.getElementById('f-date').value;
  var km = parseInt(document.getElementById('f-km').value || '0', 10);
  var notes = document.getElementById('f-notes').value.trim();

  if(!date){ alert('Merci de renseigner une date.'); return; }

  var typeObj = state.types.filter(function(t){ return t.id === typeId; })[0];
  var label = typeObj ? typeObj.label : typeId;
  var now = new Date().toISOString();

  var list = state.entries[activeVehicleId] || [];
  if(editingEntryId){
    for(var i = 0; i < list.length; i++){
      if(list[i].id === editingEntryId){
        list[i].typeId = typeId;
        list[i].date = date;
        list[i].km = km;
        list[i].notes = notes;
        list[i].updatedAt = now;
        break;
      }
    }
    logEvent(activeVehicleId, 'Intervention modifiée : ' + label + ' (' + fmtKm(km) + ', ' + fmtDate(date) + ')');
  } else {
    list.push({
      id: genId('e'),
      typeId: typeId,
      date: date,
      km: km,
      notes: notes,
      documents: [],
      createdAt: now,
      updatedAt: now
    });
    logEvent(activeVehicleId, 'Intervention ajoutée : ' + label + ' (' + fmtKm(km) + ', ' + fmtDate(date) + ')');
  }

  var v = state.vehicles[activeVehicleId];
  if(v && km > v.mileage) v.mileage = km;

  persist();
  closeModal();
  renderContent();
}

function deleteEntry(id){
  if(!confirm('Supprimer cette intervention ?')) return;
  var list = state.entries[activeVehicleId] || [];
  var entry = list.filter(function(e){ return e.id === id; })[0];

  if(entry){
    var typeObj = state.types.filter(function(t){ return t.id === entry.typeId; })[0];
    var label = typeObj ? typeObj.label : entry.typeId;
    logEvent(activeVehicleId, 'Intervention supprimée : ' + label);
  }

  state.entries[activeVehicleId] = list.filter(function(e){ return e.id !== id; });
  persist();
  closeModal();
  renderContent();
}

function closeModal(){
  var overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.classList.remove('open');
  editingEntryId = null;
}

function openSettingsModal(){
  var v = state.vehicles[activeVehicleId];
  var modal = document.getElementById('modal');

  var rows = state.types.map(function(t){
    var iv = (v.intervals && v.intervals[t.id]) || {};
    var enabled = (v.enabledTypes || []).indexOf(t.id) > -1;
    var kmVal = iv.km !== undefined ? iv.km : t.km;
    var monthsVal = iv.months !== undefined ? iv.months : t.months;

    return '<div class="type-row' + (enabled ? '' : ' disabled') + '">' +
      '<input type="checkbox" data-toggle="' + t.id + '"' + (enabled ? ' checked' : '') + '>' +
      '<span class="name">' + escapeHtml(t.label) + '</span>' +
      '<input type="number" data-type="' + t.id + '" data-field="km" value="' + (kmVal == null ? '' : kmVal) + '" placeholder="—"><span class="unit">km</span>' +
      '<input type="number" data-type="' + t.id + '" data-field="months" value="' + (monthsVal == null ? '' : monthsVal) + '" placeholder="—"><span class="unit">mois</span>' +
      '<button class="trash-btn" data-deltype="' + t.id + '" title="Supprimer ce type pour tous les véhicules">' + trashSvg() + '</button>' +
      '</div>';
  }).join('');

  var canDelete = state.order.length > 1;

  modal.innerHTML =
    '<h3>Réglages du véhicule <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    '<div class="field"><label>Nom du véhicule</label><input type="text" id="s-name" value="' + escapeHtml(v.name) + '"></div>' +
    '<div class="field"><label>Couleur</label><div class="swatches" id="s-swatches"></div></div>' +
    '<hr class="hr">' +
    '<div class="field"><label>Types d\'intervention suivis pour ce véhicule</label>' + rows +
      '<div class="add-type-row">' +
        '<input type="text" id="newTypeName" placeholder="Nouveau type (ex : Recharge Clim)">' +
        '<button id="addTypeBtn">+ Ajouter</button>' +
      '</div>' +
    '</div>' +
    '<div class="modal-actions" style="margin-top:16px;">' +
      (canDelete ? '<button class="btn btn-danger" id="deleteVehicleBtn">Supprimer ce véhicule</button>' : '') +
      '<button class="btn btn-ghost" id="cancelBtn">Fermer</button>' +
      '<button class="btn btn-primary" id="saveSettingsBtn">Enregistrer</button>' +
    '</div>';

  var swatchWrap = document.getElementById('s-swatches');
  PALETTE.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'swatch' + (c === v.color ? ' selected' : '');
    sw.style.background = c;
    sw.setAttribute('data-color', c);
    sw.onclick = function(){
      Array.prototype.forEach.call(swatchWrap.children, function(el){ el.classList.remove('selected'); });
      sw.classList.add('selected');
    };
    swatchWrap.appendChild(sw);
  });

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;

  if(canDelete){
    document.getElementById('deleteVehicleBtn').onclick = function(){ deleteVehicle(activeVehicleId); };
  }

  Array.prototype.forEach.call(modal.querySelectorAll('[data-deltype]'), function(btn){
    btn.onclick = function(){ deleteType(btn.getAttribute('data-deltype')); };
  });

  document.getElementById('addTypeBtn').onclick = function(){
    var input = document.getElementById('newTypeName');
    var name = input.value.trim();
    if(!name){ alert('Merci de nommer le nouveau type.'); return; }
    var id = slugify(name);
    state.types.push({ id: id, label: name, km: null, months: null });
    if(!v.enabledTypes) v.enabledTypes = [];
    v.enabledTypes.push(id);
    if(!v.intervals) v.intervals = {};
    v.intervals[id] = { km: null, months: null };

    logEvent(activeVehicleId, 'Type d\'intervention créé : ' + name);
    persist();
    openSettingsModal();
  };

  document.getElementById('saveSettingsBtn').onclick = function(){
    var oldName = v.name, oldColor = v.color;
    var name = document.getElementById('s-name').value.trim();
    if(name) v.name = name;

    var selected = swatchWrap.querySelector('.swatch.selected');
    if(selected) v.color = selected.getAttribute('data-color');

    var newEnabled = [];
    Array.prototype.forEach.call(modal.querySelectorAll('[data-toggle]'), function(cb){
      if(cb.checked) newEnabled.push(cb.getAttribute('data-toggle'));
    });
    v.enabledTypes = newEnabled;

    if(!v.intervals) v.intervals = {};
    Array.prototype.forEach.call(modal.querySelectorAll('.type-row input[type=number]'), function(inp){
      var t = inp.getAttribute('data-type');
      var field = inp.getAttribute('data-field');
      var val = inp.value === '' ? null : parseInt(inp.value, 10);
      if(!v.intervals[t]) v.intervals[t] = {};
      v.intervals[t][field] = val;
    });

    if(name && name !== oldName) logEvent(activeVehicleId, 'Véhicule renommé : "' + oldName + '" -> "' + name + '"');
    if(v.color !== oldColor) logEvent(activeVehicleId, 'Couleur du véhicule modifiée');
    logEvent(activeVehicleId, 'Réglages des échéances mis à jour');

    persist();
    closeModal();
    render();
  };
}

function deleteType(typeId){
  var t = state.types.filter(function(x){ return x.id === typeId; })[0];
  if(!t) return;
  if(!confirm('Supprimer le type "' + t.label + '" pour tous les véhicules ? Les interventions déjà enregistrées restent visibles dans l\'historique.')) return;

  state.types = state.types.filter(function(x){ return x.id !== typeId; });
  state.order.forEach(function(id){
    var v = state.vehicles[id];
    if(v){
      if(v.enabledTypes) v.enabledTypes = v.enabledTypes.filter(function(x){ return x !== typeId; });
      if(v.intervals && v.intervals[typeId]) delete v.intervals[typeId];
    }
  });

  logEvent(null, 'Type d\'intervention supprimé : ' + t.label);
  persist();
  openSettingsModal();
  renderContent();
}

function openAddVehicleModal(){
  var modal = document.getElementById('modal');
  var usedColor = PALETTE[state.order.length % PALETTE.length];

  modal.innerHTML =
    '<h3>Ajouter un véhicule <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    '<div class="field"><label>Nom</label><input type="text" id="nv-name" placeholder="Ex : Clio, Camping-car..."></div>' +
    '<div class="field"><label>Kilométrage actuel</label><input type="number" id="nv-km" value="0"></div>' +
    '<div class="field"><label>Couleur</label><div class="swatches" id="nv-swatches"></div></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="cancelBtn">Annuler</button>' +
      '<button class="btn btn-primary" id="createVehicleBtn">Créer</button>' +
    '</div>';

  var swatchWrap = document.getElementById('nv-swatches');
  PALETTE.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'swatch' + (c === usedColor ? ' selected' : '');
    sw.style.background = c;
    sw.setAttribute('data-color', c);
    sw.onclick = function(){
      Array.prototype.forEach.call(swatchWrap.children, function(el){ el.classList.remove('selected'); });
      sw.classList.add('selected');
    };
    swatchWrap.appendChild(sw);
  });

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;

  document.getElementById('createVehicleBtn').onclick = function(){
    var name = document.getElementById('nv-name').value.trim();
    if(!name){ alert('Merci de donner un nom au véhicule.'); return; }

    var km = parseInt(document.getElementById('nv-km').value || '0', 10);
    var selected = swatchWrap.querySelector('.swatch.selected');
    var color = selected ? selected.getAttribute('data-color') : usedColor;

    var id = genId('v');
    var allIds = state.types.map(function(t){ return t.id; });
    var vehicle = makeVehicle(name, color, allIds);
    vehicle.mileage = isNaN(km) ? 0 : km;

    state.vehicles[id] = vehicle;
    state.entries[id] = [];
    state.order.push(id);
    activeVehicleId = id;

    logEvent(id, 'Véhicule créé');
    persist();
    closeModal();
    render();
  };
}

function deleteVehicle(id){
  var v = state.vehicles[id];
  if(!v) return;
  if(!confirm('Supprimer "' + v.name + '" et tout son historique d\'entretien ? Cette action est définitive.')) return;

  logEvent(id, 'Véhicule "' + v.name + '" supprimé');
  state.order = state.order.filter(function(x){ return x !== id; });
  delete state.vehicles[id];
  delete state.entries[id];
  activeVehicleId = state.order[0] || null;

  persist();
  closeModal();
  render();
}

function openJournalModal(){
  var modal = document.getElementById('modal');
  var list = (state.journal || []).slice().sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });

  var rows = list.map(function(j){
    var vehicle = state.vehicles[j.vehicleId];
    var color = vehicle ? vehicle.color : '#6B6E70';
    var tag = j.vehicleName || 'Général';
    return '<div class="journal-row">' +
      '<div class="journal-meta"><span class="journal-tag" style="background:' + color + '">' + escapeHtml(tag) + '</span><span class="journal-time">' + fmtDateTime(j.ts) + '</span></div>' +
      '<div class="journal-msg">' + escapeHtml(j.message) + '</div>' +
      '</div>';
  }).join('');

  modal.innerHTML =
    '<h3>Journal des modifications <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    (list.length ? rows : '<div class="empty-state">Aucune modification enregistrée pour le moment.</div>') +
    '<div class="modal-actions" style="margin-top:16px;"><button class="btn btn-ghost" id="cancelBtn" style="flex:1;">Fermer</button></div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
}

// Modale Export / Import / Sauvegarde
function openExportModal(){
  var modal = document.getElementById('modal');
  var v = state.vehicles[activeVehicleId];

  modal.innerHTML =
    '<h3>Sauvegarde & Exportation <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +

    '<div class="export-box">' +
      '<h4>💾 Sauvegarde complète (Fichier JSON)</h4>' +
      '<p>Téléchargez tout votre carnet de bord (véhicules, historiques, documents). Vous pourrez le restaurer sur n\'importe quel appareil.</p>' +
      '<div class="row2">' +
        '<button class="btn btn-primary" id="downloadBackupBtn">Télécharger la sauvegarde</button>' +
        '<button class="btn btn-ghost" id="restoreBackupBtn">Restaurer un fichier</button>' +
        '<input type="file" id="importJsonInput" style="display:none;" accept=".json">' +
      '</div>' +
    '</div>' +

    (v ? 
    '<div class="export-box">' +
      '<h4>📊 Exporter ' + escapeHtml(v.name) + ' en CSV (Excel)</h4>' +
      '<p>Téléchargez un tableau CSV contenant l\'historique complet des interventions pour ce véhicule.</p>' +
      '<button class="btn btn-ghost" id="downloadCsvBtn" style="width:100%;">Télécharger l\'historique (.CSV)</button>' +
    '</div>' : '') +

    '<div class="modal-actions" style="margin-top:16px;">' +
      '<button class="btn btn-ghost" id="cancelBtn">Fermer</button>' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;

  // Telecharger JSON
  document.getElementById('downloadBackupBtn').onclick = function(){
    var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
    var dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "carnet_de_bord_backup_" + new Date().toISOString().substring(0,10) + ".json");
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
  };

  // Restaurer JSON
  var importInput = document.getElementById('importJsonInput');
  document.getElementById('restoreBackupBtn').onclick = function(){ importInput.click(); };
  importInput.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var parsed = JSON.parse(evt.target.result);
        if(parsed && parsed.vehicles && parsed.entries){
          if(confirm('Restaurer cette sauvegarde ? Cela remplacera les données actuelles.')){
            state = parsed;
            persist();
            closeModal();
            loadState();
            alert('Sauvegarde restaurée avec succès !');
          }
        } else {
          alert('Format de fichier invalide.');
        }
      } catch(err) {
        alert('Erreur lors de la lecture du fichier JSON.');
      }
    };
    reader.readAsText(file);
  };

  // Export CSV
  var csvBtn = document.getElementById('downloadCsvBtn');
  if(csvBtn && v){
    csvBtn.onclick = function(){
      var entries = state.entries[activeVehicleId] || [];
      var csvRows = [["Date", "Kilometrage", "Type Intervention", "Notes/Observations"]];

      entries.forEach(function(e){
        var typeObj = state.types.filter(function(t){ return t.id === e.typeId; })[0];
        var label = typeObj ? typeObj.label : e.typeId;
        var cleanNotes = (e.notes || '').replace(/"/g, '""');
        csvRows.push(['"' + e.date + '"', '"' + e.km + '"', '"' + label + '"', '"' + cleanNotes + '"']);
      });

      var csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.map(function(r){ return r.join(";"); }).join("\n");
      var dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", encodeURI(csvContent));
      dlAnchor.setAttribute("download", "historique_" + slugify(v.name) + "_" + new Date().toISOString().substring(0,10) + ".csv");
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    };
  }
}

// Initialisation & événements globaux
document.getElementById('exportMenuBtn').onclick = openExportModal;
document.getElementById('journalBtn').onclick = openJournalModal;
document.getElementById('addBtn').onclick = function(){ openEntryModal(null); };

var modalOverlay = document.getElementById('modalOverlay');
if(modalOverlay){
  modalOverlay.addEventListener('click', function(e){
    if(e.target.id === 'modalOverlay') closeModal();
  });
}

loadState();

})();
</script>
</body>
</html>
