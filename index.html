<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de bord — Entretien véhicules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1B1D1E; --surface:#242628; --surface-2:#2B2E30; --border:#35383A;
    --text:#ECECE8; --text-muted:#9B9E9F; --yellow:#F0B429; --red:#D9534F; --green:#5FAE7D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app{ max-width:720px; margin:0 auto; padding:20px 16px 80px; }
  header.topbar{ display:flex; align-items:center; gap:12px; padding:4px 2px 18px; }
  .brand-mark{ width:38px;height:38px;flex:none; display:flex;align-items:center;justify-content:center; border:2px solid var(--yellow); border-radius:50%; color:var(--yellow); }
  .brand-text h1{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.06em; font-size:20px; margin:0; text-transform:uppercase; }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--text-muted); }
  nav.tabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto; }
  .tab-btn{
    font-family:'Oswald',sans-serif; background:none; border:none; color:var(--text-muted);
    font-size:14px; letter-spacing:0.04em; text-transform:uppercase; padding:10px 14px 12px;
    cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; transition:color .15s ease;
  }
  .tab-btn.active{ color:var(--text); }
  .tab-btn:hover{ color:var(--text); }
  .tab-add{ font-family:'Oswald',sans-serif; background:none; border:none; color:var(--text-muted); font-size:18px; padding:8px 12px 12px; cursor:pointer; flex:none; }
  .tab-add:hover{ color:var(--yellow); }

  .vehicle-header{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 16px; margin-bottom:22px; position:relative; border-top:3px solid var(--accent, var(--yellow)); }
  .vehicle-header .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .vehicle-name{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; margin:0; }
  .vehicle-plate-input{ background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:13px; padding:2px 0; margin-top:4px; width:150px; }
  .vehicle-plate-input:focus{ outline:none; border-color:var(--accent); color:var(--text); }
  .icon-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); width:34px;height:34px; border-radius:8px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex:none; }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent); }

  .mileage-row{ display:flex; align-items:baseline; gap:8px; margin-top:14px; }
  .mileage-input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; border-radius:8px; padding:4px 10px; width:150px; }
  .mileage-input:focus{ outline:none; border-color:var(--accent); }
  .mileage-unit{ font-family:'JetBrains Mono',monospace; color:var(--text-muted); font-size:13px; }

  .doc-section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .doc-section-label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; }
  .doc-chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .doc-chip{ position:relative; width:64px; }
  .doc-thumb{ width:64px;height:64px;border-radius:8px; background:var(--surface-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; overflow:hidden; cursor:pointer; color:var(--text-muted); }
  .doc-thumb img{ width:100%; height:100%; object-fit:cover; }
  .doc-name{ font-size:10px; color:var(--text-muted); text-align:center; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc-remove{ position:absolute; top:-6px; right:-6px; width:18px;height:18px;border-radius:50%; background:var(--red); color:#fff; border:none; font-size:10px; line-height:18px; text-align:center; cursor:pointer; padding:0; }
  .doc-add-btn{ width:64px;height:64px;border-radius:8px; border:1px dashed var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:22px; display:flex;align-items:center;justify-content:center; flex:none; }
  .doc-add-btn:hover{ color:var(--yellow); border-color:var(--yellow); }

  h2.section-title{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin:0 0 10px 2px; display:flex; justify-content:space-between; align-items:center; }
  section{ margin-bottom:26px; }

  .gauge-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .gauge-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .gauge-label{ font-size:14px; font-weight:600; }
  .gauge-status{ font-family:'JetBrains Mono',monospace; font-size:12px; }
  .gauge-track{ height:8px; border-radius:4px; background:var(--surface-2); position:relative; overflow:hidden; border:1px solid var(--border); }
  .gauge-track .fill{ height:100%; border-radius:4px 0 0 4px; transition:width .3s ease; }
  .gauge-empty{ font-size:12.5px; color:var(--text-muted); font-style:italic; }

  .history-row{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:7px; cursor:pointer; }
  .history-row:hover{ border-color:var(--accent); }
  .history-icon{ width:34px;height:34px;flex:none; border-radius:8px; background:var(--surface-2); display:flex;align-items:center;justify-content:center; color:var(--accent); position:relative; }
  .history-icon .doc-dot{ position:absolute; bottom:-2px; right:-2px; width:9px;height:9px;border-radius:50%; background:var(--yellow); border:2px solid var(--surface); }
  .history-main{ flex:1; min-width:0; }
  .history-type{ font-size:14px; font-weight:600; }
  .history-notes{ font-size:12.5px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-meta{ text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); flex:none; }
  .history-meta .km{ color:var(--text); font-size:13px; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--text-muted); font-size:13.5px; border:1px dashed var(--border); border-radius:12px; }

  .fab{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); max-width:688px; width:calc(100% - 32px); display:flex; justify-content:flex-end; pointer-events:none; }
  .add-btn{ pointer-events:auto; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; background:var(--yellow); color:#1B1D1E; border:none; font-size:14px; font-weight:600; padding:13px 20px; border-radius:30px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .add-btn:hover{ filter:brightness(1.08); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px 20px 24px; }
  @media (min-width:600px){ .modal-overlay{ align-items:center; } .modal{ border-radius:16px; } }
  .modal h3{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:17px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
  .field select, .field input, .field textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; padding:10px 11px; border-radius:9px; }
  .field input[type=number], .field input[type=date]{ font-family:'JetBrains Mono',monospace; }
  .field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:60px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:13.5px; font-weight:600; padding:12px; border-radius:9px; border:1px solid var(--border); cursor:pointer; background:transparent; color:var(--text); }
  .btn-primary{ background:var(--yellow); color:#1B1D1E; border:none; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); }
  .btn-danger{ background:transparent; color:var(--red); border-color:var(--red); flex:none; padding:12px 16px; }

  .type-row{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
  .type-row:last-child{ border-bottom:none; }
  .type-row input[type=checkbox]{ width:16px;height:16px; accent-color: var(--yellow); flex:none; }
  .type-row .name{ flex:1; font-size:13.5px; }
  .type-row.disabled .name{ color:var(--text-muted); }
  .type-row input[type=number]{ width:58px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:6px 5px; border-radius:6px; text-align:center; }
  .type-row .unit{ font-size:11px; color:var(--text-muted); width:28px; }
  .trash-btn{ background:none; border:none; color:var(--text-muted); cursor:pointer; flex:none; padding:4px; display:flex; }
  .trash-btn:hover{ color:var(--red); }

  .add-type-row{ display:flex; gap:8px; margin-top:12px; }
  .add-type-row input{ flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:13.5px; padding:9px 11px; border-radius:9px; }
  .add-type-row button{ flex:none; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; }
  .add-type-row button:hover{ border-color:var(--yellow); color:var(--yellow); }

  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:4px; }
  .swatch{ width:32px;height:32px;border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch.selected{ border-color:var(--text); }

  .journal-row{ padding:10px 0; border-bottom:1px solid var(--border); }
  .journal-row:last-child{ border-bottom:none; }
  .journal-meta{ display:flex; gap:8px; align-items:center; margin-bottom:3px; }
  .journal-tag{ padding:2px 8px; border-radius:10px; font-size:10px; color:#fff; font-family:'Oswald',sans-serif; letter-spacing:0.03em; text-transform:uppercase; }
  .journal-time{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-muted); }
  .journal-msg{ font-size:13.5px; }

  .hr{ border:none; border-top:1px solid var(--border); margin:18px 0; }
  .loading{ text-align:center; padding:60px 10px; color:var(--text-muted); font-size:13.5px; }

  .auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--yellow);border-radius:16px;padding:26px}
  .auth-card h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .auth-card p{color:var(--text-muted);font-size:13px;line-height:1.5;margin:0 0 20px}
  .auth-btn{width:100%;padding:13px;border-radius:9px;border:1px solid var(--border);background:var(--yellow);color:#1B1D1E;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;cursor:pointer}
  .auth-status{font-size:12px;color:var(--text-muted);margin-top:12px;text-align:center;min-height:18px}
  .account-btn{font-size:11px!important;padding:7px 9px!important;width:auto!important}
  .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:6px}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>Carnet de bord</h2>
    <p>Connectez-vous pour retrouver vos véhicules, entretiens et documents sur tous vos appareils.</p>
    <div style="margin-bottom:12px;">
      <input type="email" id="emailInput" placeholder="Votre e-mail" style="width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);">
      <input type="password" id="passInput" placeholder="Mot de passe" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);">
    </div>
    <button class="auth-btn" id="emailLoginBtn">Se connecter</button>
    <div class="auth-status" id="authStatus"></div>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"></path></svg>
    </div>
    <div class="brand-text">
      <h1>Carnet de bord</h1>
      <p>Suivi d&rsquo;entretien de vos véhicules</p>
    </div>
    <button class="icon-btn" id="accountBtn" title="Compte" style="margin-left:auto;"><span class="sync-dot"></span>Compte</button>
     <button class="icon-btn" id="journalBtn" title="Journal des modifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="content"><div class="loading">Chargement du carnet…</div></main>
</div>

<div class="fab"><button class="add-btn" id="addBtn">+ Ajouter une intervention</button></div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>

<script>
(function(){

var DEFAULT_TYPES = [
  { id:'vidange',    label:'Vidange (huile + filtre)',   km:15000, months:12 },
  { id:'ct',         label:'Controle technique',          km:null,  months:24 },
  { id:'filtre_air', label:'Filtre a air',                km:20000, months:24 },
  { id:'filtre_hab', label:'Filtre habitacle',            km:15000, months:12 },
  { id:'freins',     label:'Plaquettes / disques de frein', km:30000, months:null },
  { id:'pneus',      label:'Pneus',                       km:null,  months:null },
  { id:'batterie',   label:'Batterie',                    km:null,  months:48 },
  { id:'courroie',   label:'Courroie de distribution',    km:100000,months:60 },
  { id:'autre',      label:'Autre intervention',          km:null,  months:null }
];
var PALETTE = ['#3B7EA8','#C85A2E','#5C8A5A','#8567A8','#3F8F8A','#B0555F','#9A7B3B','#5E6BAE'];
var MAX_DOC_BYTES = 4700000;

var state = null;
var activeVehicleId = null;
var editingEntryId = null;

function cloneTypes(){ return DEFAULT_TYPES.map(function(t){ return { id:t.id, label:t.label, km:t.km, months:t.months }; }); }

function typeLabel(id){
  for(var i=0;i<state.types.length;i++){ if(state.types[i].id===id) return state.types[i].label; }
  return id;
}

function genId(prefix){ return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

function makeVehicle(name, color, enabledTypes){
  var intervals = {};
  state.types.forEach(function(t){ intervals[t.id] = { km: t.km, months: t.months }; });
  return { name: name, color: color, plate:'', mileage:0, intervals: intervals, enabledTypes: enabledTypes.slice(), documents: [] };
}

function defaultState(){
  var types = cloneTypes();
  var allIds = types.map(function(t){ return t.id; });
  var s = { order: [], vehicles: {}, entries: {}, types: types, journal: [] };
  state = s;
  s.order = ['kangoo','c3','caravane'];
  s.vehicles.kangoo = makeVehicle('Kangoo', PALETTE[0], allIds);
  s.vehicles.c3 = makeVehicle('C3 Aircross', PALETTE[1], allIds);
  s.vehicles.caravane = makeVehicle('Caravane', PALETTE[2], allIds);
  s.entries = { kangoo: [], c3: [], caravane: [] };
  return s;
}

function migrate(raw){
  if(!raw || typeof raw !== 'object' || !raw.order || !raw.vehicles) return defaultState();
  if(!raw.types || !raw.types.length) raw.types = cloneTypes();
  if(!raw.journal) raw.journal = [];
  var allIds = raw.types.map(function(t){ return t.id; });
  raw.entries = raw.entries || {};
  raw.order.forEach(function(id, idx){
    var v = raw.vehicles[id];
    if(!v) return;
    if(!v.color) v.color = PALETTE[idx % PALETTE.length];
    if(!v.intervals) v.intervals = {};
    if(!v.enabledTypes) v.enabledTypes = allIds.slice();
    if(!v.documents) v.documents = [];
    if(typeof v.mileage !== 'number') v.mileage = 0;
    if(!raw.entries[id]) raw.entries[id] = [];
    raw.entries[id].forEach(function(e){
      if(!e.documents) e.documents = [];
      if(!e.createdAt) e.createdAt = (e.date ? e.date+'T00:00:00.000Z' : new Date().toISOString());
      if(!e.updatedAt) e.updatedAt = e.createdAt;
    });
  });
  return raw;
}

// ---- Synchronisation cloud Supabase ----
// 1) Creez un projet Supabase.
// 2) Activez Google dans Authentication > Providers.
// 3) Creez la table user_data avec: user_id uuid primary key, state jsonb, updated_at timestamptz.
// 4) Ajoutez une policy RLS permettant a chaque utilisateur de lire/ecrire uniquement sa ligne.
// 5) Creez un bucket Storage "vehicle-documents" et ses policies utilisateur.
var SUPABASE_URL = 'https://fobqmyntdlhcepszkwuw.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvYnFteW50ZGxoY2Vwc3prd3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTI1ODgsImV4cCI6MjEwMjQ2ODU4OH0.wESETjGomzxKa53aQEeKprqDcm1oSFoXIvEJw8gc3EY';
var sb = null;
var currentUser = null;
var cloudReady = false;

function initCloud(){
  if(!window.supabase || SUPABASE_URL.indexOf('COLLER_ICI')===0){
    document.getElementById('authStatus').textContent='Il faut encore connecter Supabase (je peux te guider).';
    return false;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  cloudReady = true;
  return true;
}

async function signInEmail(){
  if(!initCloud()) return;
  var email = document.getElementById('emailInput').value.trim();
  var password = document.getElementById('passInput').value;
  if(!email || !password){ document.getElementById('authStatus').textContent='Renseignez votre e-mail et mot de passe.'; return; }
  document.getElementById('authStatus').textContent='Connexion en cours…';
  var {data, error} = await sb.auth.signInWithPassword({ email: email, password: password });
  if(error) document.getElementById('authStatus').textContent='Erreur : ' + error.message;
}

async function signOutCloud(){
  if(sb) await sb.auth.signOut();
  currentUser=null;
  document.getElementById('authOverlay').style.display='flex';
}

async function loadState(){
  if(!cloudReady) return;
  var {data:{session}}=await sb.auth.getSession();
  if(!session){ document.getElementById('authOverlay').style.display='flex'; return; }
  currentUser=session.user;
  var {data,error}=await sb.from('user_data').select('state').eq('user_id',currentUser.id).maybeSingle();
  if(error){ console.error(error); state=defaultState(); }
  else if(data && data.state) state=migrate(data.state);
  else state=defaultState();
  activeVehicleId=state.order[0]||null;
  await persist();
  document.getElementById('authOverlay').style.display='none';
  render();
}

async function persist(){
  if(!sb || !currentUser || !state) return;
  var {error}=await sb.from('user_data').upsert({user_id:currentUser.id,state:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error) console.error('Erreur de sauvegarde cloud',error);
}

function logEvent(vehicleId, message){
  var vname = '';
  if(vehicleId && state.vehicles[vehicleId]) vname = state.vehicles[vehicleId].name;
  state.journal.push({ id: genId('j'), ts: new Date().toISOString(), vehicleId: vehicleId, vehicleName: vname, message: message });
  if(state.journal.length > 500) state.journal.splice(0, state.journal.length-500);
}

function fmtDate(iso){
  if(!iso) return '\u2014';
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function fmtDateTime(iso){
  if(!iso) return '\u2014';
  var d = new Date(iso);
  return d.toLocaleDateString('fr-FR') + ' \u00b7 ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
function fmtKm(n){ return Number(n||0).toLocaleString('fr-FR') + ' km'; }
function monthsBetween(a,b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()-a.getDate())/30; }

function lastEntryOfType(vehicleId, typeId){
  var list = (state.entries[vehicleId]||[]).filter(function(e){ return e.typeId===typeId; });
  if(!list.length) return null;
  list = list.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  return list[0];
}

function getEnabledTypes(v){ return state.types.filter(function(t){ return v.enabledTypes.indexOf(t.id) > -1; }); }

function computeGauge(vehicleId, typeId){
  var v = state.vehicles[vehicleId];
  var interval = v.intervals[typeId] || {};
  if(!interval.km && !interval.months) return null;
  var last = lastEntryOfType(vehicleId, typeId);
  if(!last) return { hasData:false };
  var kmProgress = null, monthProgress = null;
  if(interval.km) kmProgress = (v.mileage - last.km) / interval.km;
  if(interval.months) monthProgress = monthsBetween(new Date(last.date), new Date()) / interval.months;
  var progress = Math.max(kmProgress===null?-Infinity:kmProgress, monthProgress===null?-Infinity:monthProgress);
  var pct = Math.max(0, Math.min(progress, 1.3)) / 1.3 * 100;
  var color = 'var(--green)';
  if(progress >= 1) color = 'var(--red)';
  else if(progress >= 0.75) color = 'var(--yellow)';
  return { hasData:true, pct:pct, color:color, statusText: remainingText(interval, v, last) };
}

function remainingText(interval, v, last){
  var parts = [];
  if(interval.km){
    var rem = Math.round(interval.km - (v.mileage - last.km));
    parts.push((rem>=0?'Dans ':'Depasse de ') + Math.abs(rem).toLocaleString('fr-FR') + ' km');
  }
  if(interval.months && !interval.km){
    var elapsed = monthsBetween(new Date(last.date), new Date());
    var remM = Math.round(interval.months - elapsed);
    parts.push((remM>=0?'Dans ':'Depasse de ') + Math.abs(remM) + ' mois');
  }
  return parts.join(' \u00b7 ');
}

function fileIconSvg(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>'; }

function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function slugify(s){
  var base = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24);
  return 'ct_' + (base || 'type') + '_' + Math.random().toString(36).slice(2,5);
}

// ---- Gestion des fichiers (photos / documents) ----
function readFileAsDataUrl(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsDataURL(file);
  });
}
function resizeImageDataUrl(dataUrl, maxDim, quality){
  return new Promise(function(resolve,reject){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w,h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,cw,ch);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ reject(new Error('Image illisible')); };
    img.src = dataUrl;
  });
}
async function processFile(file){
  var raw = await readFileAsDataUrl(file);
  var isImage = file.type && file.type.indexOf('image/')===0;
  var dataUrl = raw, thumb = null;
  if(isImage){
    try{
      dataUrl = await resizeImageDataUrl(raw, 1100, 0.7);
      thumb = await resizeImageDataUrl(raw, 140, 0.6);
    }catch(resizeErr){
      // Certains formats (HEIC, etc.) ne se decodent pas via canvas : on retente en original.
      dataUrl = raw;
      thumb = null;
    }
  }
  var approxBytes = Math.round(dataUrl.length * 3/4);
  if(approxBytes > MAX_DOC_BYTES){
    var mo = (approxBytes/1000000).toFixed(1);
    throw new Error('Photo trop lourde meme apres compression (' + mo + ' Mo, limite environ 4 Mo). Essayez une photo moins detaillee ou une capture d\u2019ecran.');
  }
  return { name: file.name, mime: file.type || 'application/octet-stream', dataUrl: dataUrl, thumb: thumb, size: approxBytes };
}
function renderDocChips(docs){
  if(!docs || !docs.length) return '';
  return docs.map(function(d){
    var thumbHtml = d.thumb ? '<img src="'+d.thumb+'" alt="">' : fileIconSvg();
    return '<div class="doc-chip">' +
      '<div class="doc-thumb" data-doc-open="'+d.id+'">'+thumbHtml+'</div>' +
      '<div class="doc-name">'+escapeHtml(d.name)+'</div>' +
      '<button class="doc-remove" data-doc-remove="'+d.id+'">\u2715</button>' +
      '</div>';
  }).join('');
}
async function openDocument(docId){
  try{
    var raw = localStorage.getItem('doc:'+docId); if(!raw) throw new Error('Document disponible uniquement sur cet appareil dans cette version.'); var res={value:raw};
    var w = window.open('', '_blank');
    if(w){
      w.document.write('<title>Document</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+res.value+'" style="max-width:100%;max-height:100vh;" onerror="this.outerHTML=\'<a href=&quot;'+res.value+'&quot; download style=&quot;color:#fff;font-family:sans-serif;&quot;>Telecharger le fichier</a>\'"></body>');
    }
  }catch(e){
    alert('Impossible d\u2019ouvrir ce document.');
  }
}

async function addVehicleDocuments(fileList){
  var v = state.vehicles[activeVehicleId];
  for(var i=0;i<fileList.length;i++){
    try{
      var processed = await processFile(fileList[i]);
      var id = genId('doc');
      localStorage.setItem('doc:'+id, processed.dataUrl);
      v.documents.push({ id:id, name:processed.name, mime:processed.mime, thumb:processed.thumb, size:processed.size, addedAt:new Date().toISOString() });
      logEvent(activeVehicleId, 'Document ajoute au vehicule : ' + processed.name);
    }catch(err){ alert(err.message || 'Erreur lors de l\u2019ajout du fichier.'); }
  }
  await persist();
  renderContent();
}
async function deleteVehicleDocument(docId){
  var v = state.vehicles[activeVehicleId];
  var doc = v.documents.filter(function(d){ return d.id===docId; })[0];
  if(!doc) return;
  if(!confirm('Supprimer "'+doc.name+'" ?')) return;
  v.documents = v.documents.filter(function(d){ return d.id!==docId; });
  try{ localStorage.removeItem('doc:'+docId); }catch(e){}
  logEvent(activeVehicleId, 'Document supprime du vehicule : ' + doc.name);
  await persist();
  renderContent();
}
async function addEntryDocuments(entry, fileList){
  for(var i=0;i<fileList.length;i++){

async function deleteEntryDocument(entry, docId){

function render(){ renderTabs(); renderContent(); }

function renderTabs(){
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  state.order.forEach(function(id){
    var v = state.vehicles[id];
    var btn = document.createElement('button');

function renderContent(){
  var content = document.getElementById('content');
  var v = state.vehicles[activeVehicleId];
  if(!v){ content.innerHTML = '<div class="empty-state">Aucun vehicule. Ajoutez-en un avec le bouton +.</div>'; return; }
  var entries = (state.entries[activeVehicleId]||[]).slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });

  var html = '';
  html += '<div class="vehicle-header" style="--accent:'+v.color+'">';
  html += '  <div class="row1">';
  html += '    <div>';
  html += '      <p class="vehicle-name">'+escapeHtml(v.name)+'</p>';
  html += '      <input class="vehicle-plate-input" id="plateInput" placeholder="Immatriculation" value="'+escapeHtml(v.plate||'')+'">';
  html += '    </div>';
  html += '    <button class="icon-btn" id="settingsBtn" title="Reglages">'+ gearSvg() +'</button>';
  html += '  </div>';
  html += '  <div class="mileage-row">';
  html += '    <input type="number" class="mileage-input" id="mileageInput" value="'+v.mileage+'">';
  html += '    <span class="mileage-unit">km au compteur</span>';
  html += '  </div>';
  html += '  <div class="doc-section"><div class="doc-section-label">Photos &amp; documents du vehicule</div>';
  html += '    <div class="doc-chip-row" id="vehicleDocRow">' + renderDocChips(v.documents) + '<button class="doc-add-btn" id="vehicleDocAddBtn" title="Ajouter">+</button></div>';
  html += '    <input type="file" id="vehicleDocInput" accept="image/*,.pdf" multiple style="display:none;">';
  html += '  </div>';
  html += '</div>';

  var gaugeTypes = getEnabledTypes(v).filter(function(t){ var iv = v.intervals[t.id]||{}; return iv.km || iv.months; });
  html += '<section><h2 class="section-title">Prochaines echeances</h2>';
  var anyGauge = false;
  gaugeTypes.forEach(function(t){
    var g = computeGauge(activeVehicleId, t.id);
    if(!g) return;
    anyGauge = true;
    html += '<div class="gauge-card">';
    html += '  <div class="gauge-top"><span class="gauge-label">'+t.label+'</span>';
    if(g.hasData){
      html += '<span class="gauge-status" style="color:'+g.color+'">'+g.statusText+'</span></div>';
      html += '<div class="gauge-track"><div class="fill" style="width:'+g.pct+'%;background:'+g.color+'"></div></div>';
    } else {
      html += '<span class="gauge-status gauge-empty">Aucune donnee</span></div>';
      html += '<div class="gauge-track"><div class="fill" style="width:0%"></div></div>';
    }
    html += '</div>';
  });
  if(!anyGauge) html += '<div class="empty-state">Aucune echeance suivie. Activez un type dans les reglages ou ajoutez une intervention.</div>';
  html += '</section>';

  html += '<section><h2 class="section-title">Historique</h2>';
  if(!entries.length){
    html += '<div class="empty-state">Aucune intervention enregistree pour ce vehicule.</div>';
  } else {
    entries.forEach(function(e){
      var label = e.typeLabelSnapshot || typeLabel(e.typeId);
      var hasDocs = e.documents && e.documents.length;
      html += '<div class="history-row" data-id="'+e.id+'">';
      html += '  <div class="history-icon" style="color:'+v.color+'">'+iconSvg()+(hasDocs?'<span class="doc-dot"></span>':'')+'</div>';
      html += '  <div class="history-main">';
      html += '    <div class="history-type">'+escapeHtml(label)+'</div>';
      html += (e.notes ? '<div class="history-notes">'+escapeHtml(e.notes)+'</div>' : '');
      html += '  </div>';
      html += '  <div class="history-meta"><div class="km">'+fmtKm(e.km)+'</div><div>'+fmtDate(e.date)+'</div></div>';
      html += '</div>';
    });
  }
  html += '</section>';

  content.innerHTML = html;

  document.getElementById('plateInput').addEventListener('change', async function(ev){ v.plate = ev.target.value; await persist(); });
  document.getElementById('mileageInput').addEventListener('change', async function(ev){
    var n = parseInt(ev.target.value||'0',10);
    v.mileage = isNaN(n) ? v.mileage : n;
    ev.target.value = v.mileage;
    await persist();
    renderContent();

  document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);

  var vdocRow = document.getElementById('vehicleDocRow');

  Array.prototype.forEach.call(vdocRow.querySelectorAll('[data-doc-remove]'), function(el){

  document.getElementById('vehicleDocAddBtn').addEventListener('click', function(){ document.getElementById('vehicleDocInput').click(); });
  document.getElementById('vehicleDocInput').addEventListener('change', function(ev){
    if(ev.target.files && ev.target.files.length){

      if(btn){ btn.textContent = '\u22ef'; btn.style.pointerEvents = 'none'; }
      addVehicleDocuments(ev.target.files);
      ev.target.value='';
    }
  });

  Array.prototype.forEach.call(content.querySelectorAll('.history-row'), function(row){
    row.addEventListener('click', function(){

      var entry = null;
      for(var i=0;i<entries.length;i++){ if(entries[i].id===id){ entry = entries[i]; break; } }
      openEntryModal(entry);
    });
  });
}

// ---- Modal: add / edit entry ----
function openEntryModal(entry){
  var v = state.vehicles[activeVehicleId];
  var available = getEnabledTypes(v);
  if(!available.length){
    alert('Aucun type d\u2019intervention actif pour ce vehicule. Activez-en un dans les reglages (icone engrenage).');
    return;
  }
  editingEntryId = entry ? entry.id : null;
  var today = new Date().toISOString().slice(0,10);
  var modal = document.getElementById('modal');

  var optionList = available.slice();
  var hasCurrent = entry ? optionList.some(function(t){ return t.id===entry.typeId; }) : true;
  if(entry && !hasCurrent){
    optionList = [{ id: entry.typeId, label: entry.typeLabelSnapshot || typeLabel(entry.typeId) }].concat(optionList);
  }
  var optionsHtml = optionList.map(function(t){
    return '<option value="'+t.id+'"'+(entry&&entry.typeId===t.id?' selected':'')+'>'+escapeHtml(t.label)+'</option>';

  var meta = entry ? '<p style="color:var(--text-muted);font-size:11.5px;margin:-10px 0 14px;">Cree le '+fmtDateTime(entry.createdAt)+(entry.updatedAt && entry.updatedAt!==entry.createdAt ? ' \u00b7 modifie le '+fmtDateTime(entry.updatedAt) : '')+'</p>' : '';

  var docsField = entry
    ? '<div class="field"><label>Documents joints</label><div class="doc-chip-row" id="entryDocRow">' + renderDocChips(entry.documents) + '<button class="doc-add-btn" id="entryDocAddBtn">+</button></div><input type="file" id="entryDocInput" accept="image/*,.pdf" multiple style="display:none;"></div>'
    : '<div class="field"><label>Documents joints</label><div class="empty-state" style="padding:14px;">Enregistrez d\u2019abord l\u2019intervention pour pouvoir y joindre des photos ou documents.</div></div>';

  modal.innerHTML =
    '<h3>'+title+' <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    meta +
    '<div class="field"><label>Type d&rsquo;intervention</label><select id="f-type">'+optionsHtml+'</select></div>' +
    '<div class="row2">' +
    '  <div class="field"><label>Date</label><input type="date" id="f-date" value="'+(entry?entry.date:today)+'"></div>' +
    '  <div class="field"><label>Kilometrage</label><input type="number" id="f-km" value="'+(entry?entry.km:v.mileage)+'"></div>' +
    '</div>' +
    '<div class="field"><label>Cout (EUR, facultatif)</label><input type="number" id="f-cost" value="'+(entry && entry.cost!=null ? entry.cost : '')+'"></div>' +
    '<div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Garage, pieces changees, remarques...">'+(entry?escapeHtml(entry.notes||''):'')+'</textarea></div>' +
    docsField +
    '<div class="modal-actions">' +
    (entry ? '<button class="btn btn-danger" id="deleteBtn">Supprimer</button>' : '') +
    '<button class="btn btn-ghost" id="cancelBtn">Annuler</button>' +
    '<button class="btn btn-primary" id="saveBtn">Enregistrer</button>' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;

  if(entry){

    });
    Array.prototype.forEach.call(edocRow.querySelectorAll('[data-doc-remove]'), function(el){

    document.getElementById('entryDocAddBtn').addEventListener('click', function(){ document.getElementById('entryDocInput').click(); });
    document.getElementById('entryDocInput').addEventListener('change', function(ev){

async function saveEntry(){
  var typeId = document.getElementById('f-type').value;
  var date = document.getElementById('f-date').value;
  var km = parseInt(document.getElementById('f-km').value||'0',10);
  var costRaw = document.getElementById('f-cost').value;
  var cost = costRaw==='' ? null : parseFloat(costRaw);
  var notes = document.getElementById('f-notes').value.trim();
  if(!date){ alert('Merci de renseigner une date.'); return; }
  var snapshot = typeLabel(typeId);
  var now = new Date().toISOString();

  var list = state.entries[activeVehicleId];
  if(editingEntryId){
    for(var i=0;i<list.length;i++){
      if(list[i].id===editingEntryId){
        list[i].typeId = typeId;
        list[i].typeLabelSnapshot = snapshot;
        list[i].date = date;
        list[i].km = km;
        list[i].cost = cost;
        list[i].notes = notes;
        list[i].updatedAt = now;
        break;
      }
    }
    logEvent(activeVehicleId, 'Intervention modifiee : ' + snapshot + ' (' + fmtKm(km) + ', ' + fmtDate(date) + ')');
  } else {
    list.push({ id: genId('e'), typeId: typeId, typeLabelSnapshot: snapshot, date: date, km: km, cost: cost, notes: notes, documents: [], createdAt: now, updatedAt: now });
    logEvent(activeVehicleId, 'Intervention ajoutee : ' + snapshot + ' (' + fmtKm(km) + ', ' + fmtDate(date) + ')');
  }
  var v = state.vehicles[activeVehicleId];
  if(km > v.mileage) v.mileage = km;

  await persist();
  closeModal();
  renderContent();
}

async function deleteEntry(id){
  if(!confirm('Supprimer cette intervention ?')) return;
  var list = state.entries[activeVehicleId];
  var entry = list.filter(function(e){ return e.id===id; })[0];
  if(entry){
    var docs = entry.documents || [];
    for(var i=0;i<docs.length;i++){ try{ localStorage.removeItem('doc:'+docs[i].id); }catch(e){} }
    logEvent(activeVehicleId, 'Intervention supprimee : ' + (entry.typeLabelSnapshot || typeLabel(entry.typeId)));
  }
  state.entries[activeVehicleId] = list.filter(function(e){ return e.id!==id; });
  await persist();
  closeModal();
  renderContent();
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  editingEntryId = null;
}

// ---- Modal: reglages vehicule ----
function openSettingsModal(){
  var v = state.vehicles[activeVehicleId];
  var modal = document.getElementById('modal');

  var rows = state.types.map(function(t){
    var iv = v.intervals[t.id] || {};
    var enabled = v.enabledTypes.indexOf(t.id) > -1;
    return '<div class="type-row'+(enabled?'':' disabled')+'">' +
      '<input type="checkbox" data-toggle="'+t.id+'"'+(enabled?' checked':'')+'>' +
      '<span class="name">'+escapeHtml(t.label)+'</span>' +
      '<input type="number" data-type="'+t.id+'" data-field="km" value="'+(iv.km==null?'':iv.km)+'" placeholder="\u2014"><span class="unit">km</span>' +
      '<input type="number" data-type="'+t.id+'" data-field="months" value="'+(iv.months==null?'':iv.months)+'" placeholder="\u2014"><span class="unit">mois</span>' +
      '<button class="trash-btn" data-deltype="'+t.id+'" title="Supprimer ce type pour tous les vehicules">'+trashSvg()+'</button>' +
      '</div>';
  }).join('');

  var canDelete = state.order.length > 1;

  modal.innerHTML =
    '<h3>Reglages du vehicule <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    '<div class="field"><label>Nom du vehicule</label><input type="text" id="s-name" value="'+escapeHtml(v.name)+'"></div>' +
    '<div class="field"><label>Couleur</label><div class="swatches" id="s-swatches"></div></div>' +
    '<hr class="hr">' +
    '<div class="field"><label>Types d&rsquo;intervention suivis pour ce vehicule</label>' + rows +
    '<div class="add-type-row"><input type="text" id="newTypeName" placeholder="Nouveau type (ex : evacuation clim)"><button id="addTypeBtn">+ Ajouter</button></div>' +
    '</div>' +
    '<div class="modal-actions" style="margin-top:16px;">' +
    (canDelete ? '<button class="btn btn-danger" id="deleteVehicleBtn">Supprimer ce vehicule</button>' : '') +
    '<button class="btn btn-ghost" id="cancelBtn">Fermer</button>' +
    '<button class="btn btn-primary" id="saveSettingsBtn">Enregistrer</button>' +
    '</div>';

  var swatchWrap = document.getElementById('s-swatches');
  PALETTE.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'swatch' + (c===v.color ? ' selected' : '');
    sw.style.background = c;
    sw.setAttribute('data-color', c);
    sw.onclick = function(){
      Array.prototype.forEach.call(swatchWrap.children, function(el){ el.classList.remove('selected'); });
      sw.classList.add('selected');
    };
    swatchWrap.appendChild(sw);
  });

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  if(canDelete) document.getElementById('deleteVehicleBtn').onclick = function(){ deleteVehicle(activeVehicleId); };

  Array.prototype.forEach.call(modal.querySelectorAll('[data-deltype]'), function(btn){
    btn.onclick = function(){ deleteType(btn.getAttribute('data-deltype')); };
  });

  document.getElementById('addTypeBtn').onclick = async function(){
    var input = document.getElementById('newTypeName');
    var name = input.value.trim();
    if(!name){ alert('Merci de nommer le nouveau type.'); return; }
    var id = slugify(name);
    state.types.push({ id: id, label: name, km: null, months: null });
    v.enabledTypes.push(id);
    v.intervals[id] = { km: null, months: null };
    logEvent(activeVehicleId, 'Type d\u2019intervention cree : ' + name);
    await persist();
    openSettingsModal();
  };

  document.getElementById('saveSettingsBtn').onclick = async function(){
    var oldName = v.name, oldColor = v.color;
    var name = document.getElementById('s-name').value.trim();
    if(name) v.name = name;
    var selected = swatchWrap.querySelector('.swatch.selected');
    if(selected) v.color = selected.getAttribute('data-color');

    var newEnabled = [];
    Array.prototype.forEach.call(modal.querySelectorAll('[data-toggle]'), function(cb){
      if(cb.checked) newEnabled.push(cb.getAttribute('data-toggle'));
    });
    v.enabledTypes = newEnabled;

    Array.prototype.forEach.call(modal.querySelectorAll('.type-row input[type=number]'), function(inp){
      var t = inp.getAttribute('data-type');
      var field = inp.getAttribute('data-field');
      var val = inp.value==='' ? null : parseInt(inp.value,10);
      if(!v.intervals[t]) v.intervals[t] = {};
      v.intervals[t][field] = val;
    });

    if(name && name!==oldName) logEvent(activeVehicleId, 'Vehicule renomme : "'+oldName+'" -> "'+name+'"');
    if(v.color!==oldColor) logEvent(activeVehicleId, 'Couleur du vehicule modifiee');
    logEvent(activeVehicleId, 'Reglages des echeances mis a jour');

    await persist();
    closeModal();
    render();
  };
}

async function deleteType(typeId){
  var t = state.types.filter(function(x){ return x.id===typeId; })[0];
  if(!t) return;
  if(!confirm('Supprimer le type "'+t.label+'" pour tous les vehicules ? Les interventions deja enregistrees restent visibles dans l\u2019historique.')) return;
  state.types = state.types.filter(function(x){ return x.id!==typeId; });
  state.order.forEach(function(id){
    var v = state.vehicles[id];
    v.enabledTypes = v.enabledTypes.filter(function(x){ return x!==typeId; });
    if(v.intervals[typeId]) delete v.intervals[typeId];
  });
  logEvent(null, 'Type d\u2019intervention supprime (tous vehicules) : ' + t.label);
  await persist();
  openSettingsModal();
  renderContent();
}

// ---- Modal: add vehicle ----
function openAddVehicleModal(){
  var modal = document.getElementById('modal');
  var usedColor = PALETTE[state.order.length % PALETTE.length];
  modal.innerHTML =
    '<h3>Ajouter un vehicule <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    '<div class="field"><label>Nom</label><input type="text" id="nv-name" placeholder="Ex : Clio, Camping-car..."></div>' +
    '<div class="field"><label>Kilometrage actuel</label><input type="number" id="nv-km" value="0"></div>' +
    '<div class="field"><label>Couleur</label><div class="swatches" id="nv-swatches"></div></div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-ghost" id="cancelBtn">Annuler</button>' +
    '<button class="btn btn-primary" id="createVehicleBtn">Creer</button>' +
    '</div>';

  var swatchWrap = document.getElementById('nv-swatches');
  PALETTE.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'swatch' + (c===usedColor ? ' selected' : '');
    sw.style.background = c;
    sw.setAttribute('data-color', c);
    sw.onclick = function(){
      Array.prototype.forEach.call(swatchWrap.children, function(el){ el.classList.remove('selected'); });
      sw.classList.add('selected');
    };
    swatchWrap.appendChild(sw);
  });

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('createVehicleBtn').onclick = async function(){
    var name = document.getElementById('nv-name').value.trim();
    if(!name){ alert('Merci de donner un nom au vehicule.'); return; }
    var km = parseInt(document.getElementById('nv-km').value||'0',10);
    var selected = swatchWrap.querySelector('.swatch.selected');
    var color = selected ? selected.getAttribute('data-color') : usedColor;

    var id = genId('v');
    var allIds = state.types.map(function(t){ return t.id; });
    var vehicle = makeVehicle(name, color, allIds);
    vehicle.mileage = isNaN(km) ? 0 : km;
    state.vehicles[id] = vehicle;
    state.entries[id] = [];
    state.order.push(id);
    activeVehicleId = id;
    logEvent(id, 'Vehicule cree');

    await persist();
    closeModal();
    render();
  };
}

async function deleteVehicle(id){
  var v = state.vehicles[id];
  if(!confirm('Supprimer "'+v.name+'" et tout son historique d\u2019entretien ? Cette action est definitive.')) return;

  var docs = v.documents || [];
  for(var i=0;i<docs.length;i++){ try{ localStorage.removeItem('doc:'+docs[i].id); }catch(e){} }
  var entryList = state.entries[id] || [];
  for(var j=0;j<entryList.length;j++){
    var ed = entryList[j].documents || [];
    for(var k=0;k<ed.length;k++){ try{ localStorage.removeItem('doc:'+ed[k].id); }catch(e){} }
  }

  logEvent(id, 'Vehicule "'+v.name+'" supprime (avec son historique)');
  state.order = state.order.filter(function(x){ return x!==id; });
  delete state.vehicles[id];
  delete state.entries[id];
  activeVehicleId = state.order[0] || null;
  await persist();
  closeModal();
  render();
}

// ---- Modal: journal ----
function openJournalModal(){
  var modal = document.getElementById('modal');
  var list = state.journal.slice().sort(function(a,b){ return new Date(b.ts)-new Date(a.ts); });
  var rows = list.map(function(j){
    var vehicle = state.vehicles[j.vehicleId];
    var color = vehicle ? vehicle.color : '#6B6E70';
    var tag = j.vehicleName || 'General';
    return '<div class="journal-row">' +
      '<div class="journal-meta"><span class="journal-tag" style="background:'+color+'">'+escapeHtml(tag)+'</span><span class="journal-time">'+fmtDateTime(j.ts)+'</span></div>' +
      '<div class="journal-msg">'+escapeHtml(j.message)+'</div>' +
      '</div>';
  }).join('');
  modal.innerHTML =
    '<h3>Journal des modifications <button class="icon-btn" id="closeModalBtn">\u2715</button></h3>' +
    (list.length ? rows : '<div class="empty-state">Aucune modification enregistree pour le moment.</div>') +
    '<div class="modal-actions" style="margin-top:16px;"><button class="btn btn-ghost" id="cancelBtn" style="flex:1;">Fermer</button></div>';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
}

document.getElementById('emailLoginBtn').addEventListener('click', signInEmail);
document.getElementById('accountBtn').addEventListener('click', function(){ if(currentUser && confirm('Se déconnecter de Google ?')) signOutCloud(); });
document.getElementById('addBtn').addEventListener('click', function(){ openEntryModal(null); });
document.getElementById('journalBtn').addEventListener('click', openJournalModal);
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target.id === 'modalOverlay') closeModal();
});

initCloud();
if(cloudReady){ sb.auth.onAuthStateChange(function(event,session){ if(session){ currentUser=session.user; loadState(); } else { document.getElementById('authOverlay').style.display='flex'; } }); loadState(); }
})();
</script>
