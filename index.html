function logEvent(vehicleId, message){
  var vehicleName = null;
  if(vehicleId && state.vehicles[vehicleId]){
    vehicleName = state.vehicles[vehicleId].name;
  }
  state.journal.push({
    id: genId('j'),
    ts: new Date().toISOString(),
    vehicleId: vehicleId || null,
    vehicleName: vehicleName,
    message: message
  });
  // Garde-fou : évite une croissance non bornée du journal sur plusieurs années
  // d'usage (le JSON reste léger même après des centaines d'actions).
  var JOURNAL_MAX = 300;
  if(state.journal.length > JOURNAL_MAX){
    state.journal = state.journal.slice(state.journal.length - JOURNAL_MAX);
  }
}

// ---- Persistance & Auth Cloud ----
function setSyncStatus(mode, detail){
  var el = document.getElementById('syncStatus');
  var label = document.getElementById('syncStatusLabel');
  if(!el || !label) return;

  if(mode === 'off'){
    el.style.display = 'none';
    return;
  }

  el.style.display = 'flex';
  el.className = 'sync-status ' + mode;
  if(mode === 'saving') label.textContent = 'Sauvegarde…';
  else if(mode === 'synced') label.textContent = 'Synchronisé';
  else if(mode === 'error') label.textContent = detail || 'Erreur de connexion';
}

async function persist(){
  if(!cloudReady || !currentUser){
    console.error('persist() appelé sans session cloud active — sauvegarde ignorée.');
    setSyncStatus('error', 'Non connecté — sauvegarde impossible');
    return false;
  }

  setSyncStatus('saving');
  isWriting = true;
  try {
    var nowIso = new Date().toISOString();
    var payload = { user_id: currentUser.id, state: state, updated_at: nowIso };
    var res;

    if(lastKnownUpdatedAt === null){
      // Pas encore de version serveur connue (première sauvegarde de la session) :
      // upsert normal. Un conflit avec une écriture concurrente à cet instant précis
      // reste possible ici, mais c'est une fenêtre bien plus étroite que l'ancien
      // comportement (upsert systématique à chaque sauvegarde).
      res = await sb.from('user_data').upsert(payload, { onConflict: 'user_id' }).select('updated_at').single();
    } else {
      // Écriture conditionnelle : on n'écrase que si la ligne serveur a toujours le
      // updated_at qu'on avait chargé/vu en dernier. Sinon, quelqu'un d'autre a
      // sauvegardé entre-temps (autre appareil) et on ne doit pas écraser son travail.
      res = await sb.from('user_data').update({ state: state, updated_at: nowIso })
        .eq('user_id', currentUser.id).eq('updated_at', lastKnownUpdatedAt)
        .select('updated_at').single();
    }

    if(res.error){
      // PGRST116 = aucune ligne ne correspondait au filtre .eq('updated_at', ...) :
      // c'est un conflit de version, pas une erreur réseau.
      if(res.error.code === 'PGRST116'){
        await handleSyncConflict();
        return false;
      }
      console.error('Erreur sauvegarde cloud:', res.error);
      setSyncStatus('error', 'Sauvegarde échouée — vérifiez la connexion');
      return false;
    }

    lastKnownUpdatedAt = res.data.updated_at;
    setSyncStatus('synced');
    return true;
  } catch(e) {
    console.error('Exception sauvegarde cloud:', e);
    setSyncStatus('error', 'Sauvegarde échouée — vérifiez la connexion');
    return false;
  } finally {
    // Petit délai avant de rebaisser le flag : laisse le temps à l'écho realtime
    // de notre propre écriture d'arriver et d'être ignoré, plutôt que de comparer
    // des chaînes de timestamp dont le format peut différer entre le client et Postgres.
    setTimeout(function(){ isWriting = false; }, 2000);
  }
}

// Un autre appareil a sauvegardé entre-temps : on ne perd rien silencieusement.
// On recharge la version la plus récente du serveur et on prévient clairement,
// pour que l'utilisateur puisse refaire sa dernière action si elle n'a pas été prise
// en compte.
async function handleSyncConflict(){
  console.error('Conflit de synchronisation détecté : une version plus récente existe côté serveur.');
  try {
    var res = await sb.from('user_data').select('state, updated_at').eq('user_id', currentUser.id).single();
    if(res.data){
      state = res.data.state;
      lastKnownUpdatedAt = res.data.updated_at;
      renderContent();
    }
  } catch(e){
    console.error('Erreur rechargement après conflit:', e);
  }
  setSyncStatus('error', 'Modifié ailleurs — dernière version rechargée');
  await showAlert('Ce carnet a été modifié depuis un autre appareil au même moment. La dernière version a été rechargée automatiquement — si votre dernière action n\'apparaît pas, merci de la refaire.');
}

async function loadState(){
  if(!cloudReady || !currentUser){
    console.error('loadState() appelé sans session cloud active.');
    setSyncStatus('error', 'Non connecté — impossible de charger les données');
    return;
  }

  try {
    var res = await sb.from('user_data').select('state, updated_at').eq('user_id', currentUser.id).single();
    if(res.data && res.data.state){
      state = res.data.state;
      lastKnownUpdatedAt = res.data.updated_at;
    } else {
      initDefaultState();
      lastKnownUpdatedAt = null;
      await persist();
    }
    subscribeRealtime();
    setSyncStatus('synced');
  } catch(e) {
    console.error('Erreur chargement cloud:', e);
    setSyncStatus('error', 'Chargement impossible — vérifiez la connexion');
    initDefaultState();
  }

  // Sanity check
  if(!state.types || !state.types.length) state.types = DEFAULT_TYPES.slice();
  if(!state.journal) state.journal = [];
  if(!state.order) state.order = [];
  if(!state.vehicles) state.vehicles = {};
  if(!state.entries) state.entries = {};
  if(!state.checklistItems || !state.checklistItems.length) state.checklistItems = DEFAULT_CHECKLIST_ITEMS.slice();
  if(!state.sessions) state.sessions = {};

  if(!activeVehicleId){
    activeVehicleId = DASHBOARD_ID;
  }

  render();
}

function initDefaultState(){
  // L'app démarre vide : aucune donnée de démo n'est pré-remplie.
  // L'utilisateur ajoute ses propres véhicules via le bouton "+ Nouveau véhicule".
  state = {
    vehicles: {},
    entries: {},
    order: [],
    types: DEFAULT_TYPES.slice(),
    journal: []
  };
}

// ---- Synchro en temps réel ----
// Écoute les changements sur la ligne de cet utilisateur dans user_data : quand une
// saisie est faite depuis un autre appareil, on recharge l'état et on redessine
// automatiquement, sans avoir besoin de recharger la page.
function subscribeRealtime(){
  if(!cloudReady || !currentUser || !sb) return;

  // Évite les abonnements en doublon si onAuthStateChange se déclenche plusieurs fois
  if(realtimeChannel){
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  realtimeChannel = sb
    .channel('user_data_changes_' + currentUser.id)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'user_data',
      filter: 'user_id=eq.' + currentUser.id
    }, function(payload){
      var row = payload.new;
      if(!row || !row.state) return;
      // Ignore l'écho de notre propre écriture en cours (voir isWriting dans persist())
      if(isWriting) return;

      state = row.state;
      lastKnownUpdatedAt = row.updated_at;
      renderContent();
    })
    .subscribe();
}

function unsubscribeRealtime(){
  if(realtimeChannel && sb){
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
}

async function signOutCloud(){
  unsubscribeRealtime();
  if(sb) await sb.auth.signOut();
  currentUser = null;
  lastKnownUpdatedAt = null;
  var authEl = document.getElementById('authOverlay');
  if(authEl) authEl.style.display = 'flex';
}

// ---- Calculs des échéances ----
function getTypeConfig(vehicle, typeId){
  var globalType = state.types.filter(function(t){ return t.id === typeId; })[0];
  if(!globalType) return null;
  var custom = (vehicle.intervals && vehicle.intervals[typeId]) || {};
  return {
    id: globalType.id,
    label: globalType.label,
    km: custom.km !== undefined ? custom.km : globalType.km,
    months: custom.months !== undefined ? custom.months : globalType.months,
    // Seuils de rappel personnalisables par type (ex : prévenir 2 mois avant une
    // vidange, 1 mois avant un CT) — valeurs par défaut inchangées si non réglées.
    reminderKm: (globalType.reminderKm != null) ? globalType.reminderKm : 1000,
    reminderDays: (globalType.reminderDays != null) ? globalType.reminderDays : 30
  };
}

function getLatestEntry(vehicleId, typeId){
  var list = state.entries[vehicleId] || [];
  var filtered = list.filter(function(e){ return e.typeId === typeId; });
  if(!filtered.length) return null;
  filtered.sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.km || 0) - (a.km || 0);
  });
  return filtered[0];
}

function getMaxEntryKm(vehicleId){
  var list = state.entries[vehicleId] || [];
  if(!list.length) return null;
  var max = null;
  list.forEach(function(e){
    if(e.km != null && (max === null || e.km > max)) max = e.km;
  });
  return max;
}

// Vérifie qu'un kilométrage saisi pour une date donnée reste cohérent avec les
// autres interventions déjà enregistrées (l'odomètre ne peut qu'avancer avec le temps).
// Retourne la première intervention en conflit, ou null si tout est cohérent.
function findKmConflict(vehicleId, date, km, excludeEntryId){
  var list = state.entries[vehicleId] || [];
  for(var i = 0; i < list.length; i++){
    var e = list[i];
    if(e.id === excludeEntryId) continue;
    if(e.km == null || !e.date) continue;
    // Une intervention antérieure ne devrait pas afficher un km supérieur
    if(e.date < date && e.km > km) return e;
    // Une intervention postérieure ne devrait pas afficher un km inférieur
    if(e.date > date && e.km < km) return e;
  }
  return null;
}

function computeStatus(vehicleId, typeId){
  var v = state.vehicles[vehicleId];
  if(!v) return null;
  var cfg = getTypeConfig(v, typeId);
  if(!cfg) return null;

  var last = getLatestEntry(vehicleId, typeId);
  var currentKm = v.mileage || 0;

  var result = {
    cfg: cfg,
    last: last,
    pct: 0,
    remainingKm: null,
    remainingDays: null,
    isOverdue: false,
    isWarning: false
  };

  if(!last) return result;

  var pctKm = 0;
  if(cfg.km && cfg.km > 0 && !isTrailer(v)){
    var doneKm = currentKm - (last.km || 0);
    result.remainingKm = cfg.km - doneKm;
    pctKm = Math.min(100, Math.max(0, (doneKm / cfg.km) * 100));
    if(result.remainingKm <= 0) result.isOverdue = true;
    else if(result.remainingKm <= cfg.reminderKm) result.isWarning = true;
  }

  var pctDays = 0;
  if(cfg.months && cfg.months > 0 && last.date){
    var lastDate = new Date(last.date);
    var nextDate = new Date(lastDate);
    nextDate.setMonth(nextDate.getMonth() + cfg.months);
    
    var now = new Date();
    var diffMs = nextDate - now;
    result.remainingDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    
    var totalDays = cfg.months * 30.4375;
    var doneDays = totalDays - result.remainingDays;
    pctDays = Math.min(100, Math.max(0, (doneDays / totalDays) * 100));

    if(result.remainingDays <= 0) result.isOverdue = true;
    else if(result.remainingDays <= cfg.reminderDays) result.isWarning = true;
  }

  result.pct = Math.max(pctKm, pctDays);

  // Cas particulier du Contrôle Technique : un résultat défavorable non régularisé
  // prime sur l'échéance normale (24 mois) — la vraie urgence est la contre-visite.
  if(typeId === 'ct' && last.ct){
    result.ct = last.ct;
    var cv = last.ct.counterVisit;
    var isKoResult = (last.ct.result === 'ko_major' || last.ct.result === 'ko_critical');
    if(isKoResult && cv && !cv.done){
      result.needsCounterVisit = true;
      if(cv.deadline){
        var deadlineDate = new Date(cv.deadline);
        var diffCv = Math.ceil((deadlineDate - new Date()) / (1000 * 60 * 60 * 24));
        result.remainingDays = diffCv;
        result.remainingKm = null;
        // Une défaillance critique reste au niveau d'alerte maximal (rouge) même
        // avant l'échéance de contre-visite, puisque la validité du CT est déjà
        // limitée au jour même — contrairement à une défaillance majeure (orange
        // jusqu'à l'approche de l'échéance).
        result.isOverdue = diffCv <= 0 || last.ct.result === 'ko_critical';
        result.isWarning = !result.isOverdue && diffCv <= cfg.reminderDays;
        result.cvDeadlinePassed = diffCv <= 0;
        result.pct = result.isOverdue ? 100 : Math.min(100, Math.max(0, 100 - (diffCv / 60) * 100));
      } else {
        // Pas de date limite renseignée : on force quand même une alerte visible
        result.isOverdue = true;
      }
    }
  }

  return result;
}

function renderTabs(){
  var nav = document.getElementById('tabsNav');
  if(!nav) return;

  var dashActiveClass = (activeVehicleId === DASHBOARD_ID) ? ' active' : '';
  var dashStyle = (activeVehicleId === DASHBOARD_ID) ? 'border-bottom-color:var(--yellow); color:var(--yellow);' : '';
  var html = '<button class="tab-btn' + dashActiveClass + '" style="' + dashStyle + '" data-id="' + DASHBOARD_ID + '" role="tab" aria-selected="' + (activeVehicleId === DASHBOARD_ID) + '" tabindex="' + (activeVehicleId === DASHBOARD_ID ? '0' : '-1') + '">📊 Aperçu</button>';

  html += state.order.map(function(id){
    var v = state.vehicles[id];
    if(!v) return '';
    var isActive = (id === activeVehicleId);
    var activeClass = isActive ? ' active' : '';
    var style = isActive ? 'border-bottom-color:' + v.color + '; color:' + v.color + ';' : '';
    return '<button class="tab-btn' + activeClass + '" style="' + style + '" data-id="' + id + '" role="tab" aria-selected="' + isActive + '" tabindex="' + (isActive ? '0' : '-1') + '">' + escapeHtml(v.name) + '</button>';
  }).join('');

  html += '<button class="tab-add" id="addVehicleTabBtn" title="Ajouter un véhicule" aria-label="Ajouter un véhicule">+</button>';
  nav.innerHTML = html;
  nav.setAttribute('role', 'tablist');

  var tabButtons = Array.prototype.slice.call(nav.querySelectorAll('.tab-btn'));
  tabButtons.forEach(function(btn, idx){
    btn.onclick = function(){
      activeVehicleId = btn.getAttribute('data-id');
      render();
    };
    // Navigation clavier : flèches gauche/droite pour passer d'un onglet à l'autre
    btn.addEventListener('keydown', function(e){
      if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      var nextIdx = e.key === 'ArrowRight' ? (idx + 1) % tabButtons.length : (idx - 1 + tabButtons.length) % tabButtons.length;
      tabButtons[nextIdx].focus();
      tabButtons[nextIdx].click();
    });
  });

  var addTab = document.getElementById('addVehicleTabBtn');
  if(addTab) addTab.onclick = openAddVehicleModal;
}

function renderDashboardContent(content){
  var vehicleIds = state.order.filter(function(id){ return state.vehicles[id]; });

  document.documentElement.style.setProperty('--accent', 'var(--yellow)');

  if(!vehicleIds.length){
    content.innerHTML = '<div class="empty-state">Aucun véhicule enregistré.<br><br><button class="btn btn-primary" style="width:auto; display:inline-block;" id="emptyStateAddBtn">+ Ajouter un véhicule</button></div>';
    var emptyBtn1 = document.getElementById('emptyStateAddBtn');
    if(emptyBtn1) emptyBtn1.onclick = openAddVehicleModal;
    return;
  }

  var summaries = vehicleIds.map(function(id){
    var v = state.vehicles[id];
    var enabled = v.enabledTypes || [];
    var items = [];
    enabled.forEach(function(typeId){
      var st = computeStatus(id, typeId);
      if(st && st.last) items.push(st);
    });
    var overdue = items.filter(function(s){ return s.isOverdue; });
    var warning = items.filter(function(s){ return s.isWarning && !s.isOverdue; });
    var worst = overdue.length ? 'overdue' : (warning.length ? 'warning' : 'ok');

    var alertItems = overdue.concat(warning).sort(function(a, b){
      var ra = (a.remainingKm !== null ? a.remainingKm : Infinity);
      var rb = (b.remainingKm !== null ? b.remainingKm : Infinity);
      var da = (a.remainingDays !== null ? a.remainingDays : Infinity);
      var db = (b.remainingDays !== null ? b.remainingDays : Infinity);
      return Math.min(ra, da) - Math.min(rb, db);
    });

    return { id: id, v: v, worst: worst, overdueCount: overdue.length, warningCount: warning.length, alertItems: alertItems };
  });

  var totalOverdue = summaries.reduce(function(sum, s){ return sum + s.overdueCount; }, 0);
  var totalWarning = summaries.reduce(function(sum, s){ return sum + s.warningCount; }, 0);

  var html = '<section>';
  html += '<h2 class="section-title">Vue d\'ensemble</h2>';
  if(totalOverdue > 0 || totalWarning > 0){
    var bannerParts = [];
    if(totalOverdue > 0) bannerParts.push(totalOverdue + ' échéance' + (totalOverdue > 1 ? 's' : '') + ' dépassée' + (totalOverdue > 1 ? 's' : ''));
    if(totalWarning > 0) bannerParts.push(totalWarning + ' à surveiller');
    html += '<div class="dash-banner ' + (totalOverdue > 0 ? 'overdue' : 'warning') + '">⚠️ ' + bannerParts.join(' · ') + '</div>';
  } else {
    html += '<div class="dash-banner ok">✅ Tous les véhicules sont à jour</div>';
  }
  html += '</section>';

  html += '<section><div class="dash-grid">';
  summaries.forEach(function(s){
    var badgeColor = s.worst === 'overdue' ? 'var(--red)' : (s.worst === 'warning' ? 'var(--yellow)' : 'var(--green)');
    var badgeText = s.worst === 'overdue'
      ? (s.overdueCount + ' dépassée' + (s.overdueCount > 1 ? 's' : ''))
      : (s.worst === 'warning' ? (s.warningCount + ' à surveiller') : 'À jour');

    html += '<div class="dash-card" data-vehicle-id="' + s.id + '" style="--accent:' + (s.v.color || 'var(--yellow)') + '">';
    html += '<div class="dash-card-top">';
    html += '<div class="dash-card-name">' + escapeHtml(s.v.name) + '</div>';
    html += '<span class="dash-badge" style="background:' + badgeColor + ';">' + escapeHtml(badgeText) + '</span>';
    html += '</div>';
    var metaParts = [];
    if(!isTrailer(s.v)) metaParts.push(fmtKm(s.v.mileage));
    if(s.v.plate) metaParts.push(escapeHtml(s.v.plate));
    html += '<div class="dash-card-meta">' + metaParts.join(' · ') + '</div>';

    if(s.alertItems.length){
      html += '<ul class="dash-alert-list">';
      s.alertItems.slice(0, 3).forEach(function(item){
        var parts = [];
        if(item.needsCounterVisit){
          parts.push('contre-visite ' + (item.isOverdue ? 'dépassée' : 'dans ' + item.remainingDays + ' j'));
        } else {
          if(item.remainingKm !== null){
            parts.push(item.remainingKm <= 0
              ? ('dépassé de ' + Math.abs(item.remainingKm).toLocaleString('fr-FR') + ' km')
              : ('dans ' + item.remainingKm.toLocaleString('fr-FR') + ' km'));
          }
          if(item.remainingDays !== null){
            parts.push(item.remainingDays <= 0
              ? ('dépassé de ' + Math.abs(item.remainingDays) + ' j')
              : ('dans ' + item.remainingDays + ' j'));
          }
        }
        var dot = item.isOverdue ? 'var(--red)' : 'var(--yellow)';
        html += '<li><span class="dash-dot" style="background:' + dot + ';"></span>' + escapeHtml(item.cfg.label) + ' — ' + parts.join(' / ') + '</li>';
      });
      html += '</ul>';
    } else {
      html += '<div class="dash-ok-text">Aucune échéance proche</div>';
    }

    html += '</div>';
  });
  html += '</div></section>';

  content.innerHTML = html;

  Array.prototype.forEach.call(content.querySelectorAll('.dash-card'), function(card){
    card.onclick = function(){
      activeVehicleId = card.getAttribute('data-vehicle-id');
      render();
    };
  });
}

function renderContent(){

    renderDashboardContent(content);

    html += '<span class="mileage-unit">km parcourus</span>';
    html += '</div>';
  }

  // Fiche véhicule (affichée seulement si au moins un champ est renseigné)
  var fiche = [];
  if(v.brand || v.model) fiche.push([v.brand, v.model].filter(Boolean).join(' '));
  if(v.year) fiche.push(v.year);
  if(v.fuel) fiche.push(v.fuel);
  if(v.vin) fiche.push('VIN ' + v.vin);
  if(v.firstRegDate) fiche.push('Mise en circ. ' + fmtDate(v.firstRegDate));
  if(v.insurance) fiche.push('🛡️ ' + v.insurance);
  if(fiche.length){
    html += '<div class="vehicle-fiche">' + fiche.map(escapeHtml).join(' · ') + '</div>';
  }

  // Documents attachés au véhicule
  html += '<div class="doc-section">';
  html += '<div class="doc-section-label">Documents (carte grise, assurance...)</div>';
  html += '<div class="doc-chip-row">';
  
  (v.documents || []).forEach(function(doc, idx){
    html += '<div class="doc-chip">';
    var thumbContent = (doc.type && doc.type.indexOf('image/') === 0 && doc.data)
      ? '<img src="' + doc.data + '" alt="' + escapeHtml(doc.name) + '">'
      : (doc.type && doc.type.indexOf('image/') === 0 ? '🖼' : '📄');
    html += '<div class="doc-thumb" data-doc-idx="' + idx + '">' + thumbContent + '</div>';
    html += '<div class="doc-name" title="' + escapeHtml(doc.name) + '">' + escapeHtml(doc.name) + '</div>';
    html += '<button class="doc-remove" data-idx="' + idx + '" title="Supprimer" aria-label="Supprimer le document">✕</button>';
    html += '</div>';
  });

  html += '<button class="doc-add-btn" id="addDocBtn" title="Ajouter un document">+</button>';
  html += '<input type="file" id="docFileInput" style="display:none;" accept="image/*,application/pdf">';
  html += '</div></div>';
  html += '</div>'; // Fin vehicle-header

  // Section 1 : Échéances à venir (repliable — pratique sur mobile pour
  // atteindre l'historique sans tout dérouler)
  var isCollapsed = !!gaugesSectionCollapsed[activeVehicleId];
  var plannedCount = (state.sessions[activeVehicleId] || []).filter(function(s){ return s.status === 'planned'; }).length;
  html += '<section>';
  html += '<h2 class="section-title">';
  html += '<span class="collapsible-title-inline" id="gaugesToggle"><span>Échéances d\'entretien</span><span class="collapse-chevron">' + (isCollapsed ? '▸' : '▾') + '</span></span>';
  html += '<span class="export-actions">';
  if(plannedCount) html += '<button class="export-btn" id="openSessionsBtn" title="Voir les fiches en cours">📋 ' + plannedCount + ' en cours</button>';
  html += '<button class="export-btn" id="maintenanceSheetBtn" title="Générer une fiche d\'entretien">🧾 Fiche d\'entretien</button>';
  html += '</span></h2>';
  html += '<div id="gaugesBody" style="display:' + (isCollapsed ? 'none' : 'block') + ';">';

  var enabled = v.enabledTypes || [];
  // Ne garde que les types ayant une échéance réellement configurée (km ou mois),
  // sauf si l'utilisateur a explicitement demandé à toujours afficher ce type
  // (case "Toujours afficher" dans les réglages du véhicule).
  var gaugeTypeIds = enabled.filter(function(typeId){
    var cfg = getTypeConfig(v, typeId);
    if(!cfg) return false;
    var alwaysShow = !!(v.intervals && v.intervals[typeId] && v.intervals[typeId].alwaysShowGauge);
    return alwaysShow || cfg.km != null || cfg.months != null;
  });
  // Tri alphabétique — plus facile à parcourir sur une longue liste de types.
  gaugeTypeIds.sort(function(a, b){
    var ta = state.types.filter(function(t){ return t.id === a; })[0];
    var tb = state.types.filter(function(t){ return t.id === b; })[0];
    return (ta ? ta.label : a).localeCompare(tb ? tb.label : b, 'fr');
  });

  if(!gaugeTypeIds.length){
    html += '<div class="gauge-empty">Aucune échéance configurée pour ce véhicule. Renseigne un seuil (km/mois) ou coche "Toujours afficher" dans les réglages du véhicule.</div>';
  } else {
    gaugeTypeIds.forEach(function(typeId){
      var st = computeStatus(activeVehicleId, typeId);
      if(!st) return;

      var hasThreshold = !!(st.cfg.km || st.cfg.months);
      var barColor = 'var(--green)';
      if(st.isOverdue) barColor = 'var(--red)';
      else if(st.isWarning) barColor = 'var(--yellow)';
      if(st.needsCounterVisit && st.last && st.last.ct && st.last.ct.result === 'ko_major' && !st.cvDeadlinePassed) barColor = 'var(--orange)';

      var statusText = 'Aucun historique';
      if(st.last){
        if(st.needsCounterVisit){
          var cvDeadlinePassed = !!st.cvDeadlinePassed;
          var cvDeadlineStr = (st.last.ct && st.last.ct.counterVisit && st.last.ct.counterVisit.deadline) ? fmtDate(st.last.ct.counterVisit.deadline) : null;
          var cvPrefix = (st.last.ct && st.last.ct.result === 'ko_critical') ? 'Défaillance critique — contre-visite ' : 'Contre-visite ';
          statusText = cvDeadlineStr
            ? (cvPrefix + (cvDeadlinePassed ? 'dépassée depuis le ' + cvDeadlineStr : 'à faire avant le ' + cvDeadlineStr))
            : (cvPrefix + (cvDeadlinePassed ? 'dépassée' : 'en attente'));
        } else if(!hasThreshold){
          // Type suivi sans seuil configuré ("toujours afficher") : simple repère
          // informatif, pas une échéance — couleur neutre, pas de barre de jauge.
          statusText = 'Dernière intervention : ' + fmtDate(st.last.date);
          barColor = 'var(--text)';
        } else {
          // Échéance exprimée en valeur absolue (km/date à ne pas dépasser),
          // plus parlante qu'un compte à rebours pour anticiper.
          var parts = [];
          if(st.cfg.km){
            var kmThreshold = (st.last.km || 0) + st.cfg.km;
            parts.push(kmThreshold.toLocaleString('fr-FR') + ' km');
          }
          if(st.cfg.months && st.last.date){
            var dateThreshold = new Date(st.last.date);
            dateThreshold.setMonth(dateThreshold.getMonth() + st.cfg.months);
            parts.push('le ' + dateThreshold.toLocaleDateString('fr-FR'));
          }
          statusText = (st.isOverdue ? 'Échéance dépassée : ' : 'Prochaine échéance : ') + parts.join(' ou ');
        }
      }

      html += '<div class="gauge-card">';
      html += '<div class="gauge-top">';
      html += '<span class="gauge-label">' + escapeHtml(st.cfg.label) + '</span>';
      html += '<span class="gauge-status" style="color:' + barColor + ';">' + escapeHtml(statusText) + '</span>';
      html += '</div>';
      var typeNotes = (v.intervals && v.intervals[st.cfg.id] && v.intervals[st.cfg.id].notes) || '';
      if(typeNotes) html += '<div class="gauge-ref">📎 ' + escapeHtml(typeNotes) + '</div>';
      if(hasThreshold || st.needsCounterVisit){
        html += '<div class="gauge-track">';
        html += '<div class="fill" style="width:' + st.pct + '%; background:' + barColor + ';"></div>';
        html += '</div>';
      }
      html += '</div>';
    });
  }
  html += '</div>'; // fin #gaugesBody
  html += '</section>';

  // Section 1bis : Coûts d'entretien (déduplication des factures partagées par batchId)
  var costStats = computeCostStats(entries);
  if(costStats.hasAny){
    var costsCollapsed = !!costsSectionCollapsed[activeVehicleId];
    html += '<section>';
    html += '<h2 class="section-title collapsible-title" id="costsToggle"><span>Coûts d\'entretien</span><span class="collapse-chevron">' + (costsCollapsed ? '▸' : '▾') + '</span></h2>';
    html += '<div id="costsBody" style="display:' + (costsCollapsed ? 'none' : 'block') + ';">';

    if(costStats.perKm != null){
      html += '<div class="cost-stat"><div class="cost-stat-value">' + fmtEuro(costStats.perKm) + '</div><div class="cost-stat-label">par km parcouru</div></div>';
    }
    if(costStats.currentYear != null){
      html += '<div class="cost-stat"><div class="cost-stat-value">' + fmtEuro(costStats.currentYear) + '</div><div class="cost-stat-label">Cette année (' + new Date().getFullYear() + ')</div></div>';
    }
    html += '</div>';
    if(costStats.byYear.length > 1){
      if(costChartYears[activeVehicleId] == null) costChartYears[activeVehicleId] = Math.min(10, costStats.byYear.length);
      var yearsCount = Math.max(2, Math.min(costChartYears[activeVehicleId], costStats.byYear.length));

      html += '<div class="cost-chart-controls">';

      html += '<span>' + yearsCount + ' dernière' + (yearsCount > 1 ? 's' : '') + ' année' + (yearsCount > 1 ? 's' : '') + '</span>';
      html += '<button type="button" class="cost-chart-btn" id="costChartPlus" ' + (yearsCount >= costStats.byYear.length ? 'disabled' : '') + '>+</button>';
      html += '</div>';
      html += '<div class="cost-chart-wrap">' + chart.svg + '</div>';
      if(chart.avg != null){
        html += '<div class="cost-chart-legend">Moyenne : ' + fmtEuro(chart.avg) + ' · Médiane : ' + fmtEuro(chart.med) + '</div>';
      }
    }
    html += '</div>'; // fin #costsBody
    html += '</section>';
  }

  // Section 2 : Historique
  if(historyFiltersVehicleId !== activeVehicleId){
    historyFilters = { category: 'all', garage: '', search: '', invoiceOnly: false, dateFrom: '', dateTo: '' };
    historyFiltersVehicleId = activeVehicleId;
  }
  var historyCollapsed = !!historySectionCollapsed[activeVehicleId];

  html += '<section id="historique-section">';
  html += '<h2 class="section-title">';
  html += '<span class="collapsible-title-inline" id="historyToggle"><span>Historique complet (' + entries.length + ')</span><span class="collapse-chevron">' + (historyCollapsed ? '▸' : '▾') + '</span></span>';
  html += '<span class="export-actions">';
  html += '<button class="export-btn" id="printBtn" title="Imprimer / Enregistrer en PDF">🖨 PDF</button>';
  html += '<button class="export-btn" id="exportCsvBtn" title="Exporter en CSV">⬇ CSV</button>';
  html += '<button class="export-btn" id="emailHistoryBtn" title="Envoyer par email">✉️ Email</button>';
  html += '<button class="export-btn" id="saleDossierBtn" title="Générer un dossier de vente">🚗 Dossier de vente</button>';
  html += '</span></h2>';

  html += '<div id="historyBody" style="display:' + (historyCollapsed ? 'none' : 'block') + ';">';

  if(entries.length){
    html += '<div class="hist-filters">';
    html += '<select id="histFilterCategory">';
    html += '<option value="all"' + (historyFilters.category === 'all' ? ' selected' : '') + '>Toutes catégories</option>';
    HISTORY_CATEGORIES.forEach(function(c){
      html += '<option value="' + c.id + '"' + (historyFilters.category === c.id ? ' selected' : '') + '>' + c.label + '</option>';
    });
    html += '</select>';
    html += '<input type="text" id="histFilterGarage" placeholder="Garage" value="' + escapeHtml(historyFilters.garage) + '">';
    html += '<input type="text" id="histFilterSearch" placeholder="🔍 Recherche (type, notes...)" value="' + escapeHtml(historyFilters.search) + '">';
    html += '<input type="date" id="histFilterDateFrom" title="Du" value="' + historyFilters.dateFrom + '">';
    html += '<input type="date" id="histFilterDateTo" title="Au" value="' + historyFilters.dateTo + '">';
    html += '<label class="hist-filter-check"><input type="checkbox" id="histFilterInvoice"' + (historyFilters.invoiceOnly ? ' checked' : '') + '> 📎 Avec facture</label>';
    if(hasActiveHistoryFilters()) html += '<button type="button" class="export-btn" id="histFilterReset">✕ Réinitialiser</button>';
    html += '</div>';
  }

  if(!entries.length){
    html += '<div class="empty-state">Aucune intervention enregistrée pour ce véhicule.</div>';
  } else {
    var sortedEntries = entries.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.km || 0) - (a.km || 0);
    });

    var filteredEntries = sortedEntries.filter(function(entry){
      var typeObjF = state.types.filter(function(t){ return t.id === entry.typeId; })[0];
      var labelF = typeObjF ? typeObjF.label : entry.typeId;
      var categoryF = typeObjF ? (typeObjF.category || 'autre') : 'autre';
      return matchesHistoryFilters(entry, labelF, categoryF);
    });

    if(hasActiveHistoryFilters()){
      html = html.replace('Historique complet (' + entries.length + ')', 'Historique (' + filteredEntries.length + ' sur ' + entries.length + ')');
    }

    if(!filteredEntries.length){
      html += '<div class="empty-state">Aucune intervention ne correspond à ces filtres.</div>';
    }
    sortedEntries = filteredEntries;

    sortedEntries.forEach(function(entry){
      var typeObj = state.types.filter(function(t){ return t.id === entry.typeId; })[0];
      var label = typeObj ? typeObj.label : entry.typeId;
      var hasDocs = entry.documents && entry.documents.length > 0;

      html += '<div class="history-row" data-entry-id="' + entry.id + '">';
      html += '<div class="history-icon" style="color:' + (v.color || 'var(--yellow)') + ';">' + iconSvg();
      if(hasDocs) html += '<span class="doc-dot" title="Documents joints"></span>';
      html += '</div>';
      html += '<div class="history-main">';
      html += '<div class="history-type">' + escapeHtml(label) + '</div>';
      if(entry.notes) html += '<div class="history-notes">' + escapeHtml(entry.notes) + '</div>';
      if(entry.garage || entry.supplier){
        var gsParts = [];
        if(entry.garage) gsParts.push('🔧 ' + entry.garage);
        if(entry.supplier) gsParts.push('📦 ' + entry.supplier);
        html += '<div class="history-notes">' + escapeHtml(gsParts.join(' · ')) + '</div>';
      }
      if(entry.ct){
        var ctResultMap = { ok: ['✅ Favorable', 'ok'], remarks: ['✅ Favorable avec remarques', 'remarks'], ko_major: ['🟠 Défavorable (majeure)', 'ko-major'], ko_critical: ['🔴 Défavorable (critique)', 'ko-critical'] };
        var ctBadge = ctResultMap[entry.ct.result] || ctResultMap.ok;
        html += '<span class="ct-badge ' + ctBadge[1] + '">' + ctBadge[0] + '</span>';
        var defects = entry.ct.defects || [];
        if(defects.length){
          var resolvedCount = defects.filter(function(d){ return d.resolved; }).length;
          html += '<div class="ct-defects-summary">' + defects.length + ' défaut' + (defects.length > 1 ? 's' : '') + ' relevé' + (defects.length > 1 ? 's' : '') + ' (' + resolvedCount + ' levé' + (resolvedCount > 1 ? 's' : '') + ')</div>';
        }
        if((entry.ct.result === 'ko_major' || entry.ct.result === 'ko_critical') && entry.ct.counterVisit){
          var cv = entry.ct.counterVisit;
          if(cv.done){
            html += '<div class="ct-defects-summary">Contre-visite effectuée le ' + fmtDate(cv.date) + ' — ' + (cv.result === 'ok' ? '✅ Favorable' : '❌ Toujours défavorable') + '</div>';
          } else if(cv.deadline){
            html += '<div class="ct-defects-summary">⏳ Contre-visite à faire avant le ' + fmtDate(cv.deadline) + '</div>';
          }
        }
      }
      if(entry.invoiceDoc){
        html += '<div class="ct-defects-summary">📎 ' + escapeHtml(entry.invoiceDoc.name) + (entry.batchId ? ' (facture partagée)' : '') + '</div>';
      }
      if(entry.sessionId){
        html += '<button type="button" class="link-btn session-badge-link" data-session-id="' + entry.sessionId + '">📋 Issue d\'une fiche d\'entretien</button>';
      }
      html += '</div>';
      html += '<div class="history-meta">';
      if(entry.cost != null) html += '<div class="km">' + entry.cost.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' €</div>';
      if(!isTrailer(v)) html += '<div class="km">' + fmtKm(entry.km) + '</div>';
      html += '<div>' + fmtDate(entry.date) + '</div>';
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</div>'; // fin #historyBody
  html += '</section>';

  content.innerHTML = html;

  // Binding des événements dynamiques de la vue
  var plateInput = document.getElementById('v-plate');
  if(plateInput){
    plateInput.onchange = async function(){
      v.plate = plateInput.value.trim();
      logEvent(activeVehicleId, 'Immatriculation mise à jour');
      await persist();
    };
  }

  var kmInput = document.getElementById('v-km');
  if(kmInput){
    kmInput.onchange = async function(){
      var val = parseInt(kmInput.value, 10);
      if(isNaN(val)){ kmInput.value = v.mileage || 0; return; }

      if(val < 0){
        await showAlert('Le kilométrage ne peut pas être négatif.');
        kmInput.value = v.mileage || 0;
        return;
      }

      if(val === v.mileage) return;

      // Cohérence : le kilométrage du véhicule ne devrait pas repasser sous une
      // intervention déjà enregistrée (l'odomètre n'avance normalement que vers l'avant).
      var maxEntryKm = getMaxEntryKm(activeVehicleId);
      if(maxEntryKm !== null && val < maxEntryKm){
        var ok = await showConfirm(
          'Ce kilométrage (' + fmtKm(val) + ') est inférieur à une intervention déjà enregistrée (' + fmtKm(maxEntryKm) + '). Continuer quand même ?',
          'Continuer'
        );
        if(!ok){ kmInput.value = v.mileage || 0; return; }
      }

      v.mileage = val;
      logEvent(activeVehicleId, 'Kilométrage mis à jour : ' + fmtKm(val));
      await persist();
      renderContent();
    };
  }

  var settingsBtn = document.getElementById('settingsBtn');
  if(settingsBtn) settingsBtn.onclick = openSettingsModal;

  var gaugesToggle = document.getElementById('gaugesToggle');
  if(gaugesToggle) gaugesToggle.onclick = function(){
    gaugesSectionCollapsed[activeVehicleId] = !gaugesSectionCollapsed[activeVehicleId];
    renderContent();
  };

  var costsToggle = document.getElementById('costsToggle');
  if(costsToggle) costsToggle.onclick = function(){
    costsSectionCollapsed[activeVehicleId] = !costsSectionCollapsed[activeVehicleId];
    renderContent();
  };

  var historyToggle = document.getElementById('historyToggle');
  if(historyToggle) historyToggle.onclick = function(){
    historySectionCollapsed[activeVehicleId] = !historySectionCollapsed[activeVehicleId];
    renderContent();
  };

  var costChartMinus = document.getElementById('costChartMinus');
  if(costChartMinus) costChartMinus.onclick = function(){
    costChartYears[activeVehicleId] = Math.max(2, (costChartYears[activeVehicleId] || 10) - 1);
    renderContent();
  };
  var costChartPlus = document.getElementById('costChartPlus');
  if(costChartPlus) costChartPlus.onclick = function(){
    costChartYears[activeVehicleId] = (costChartYears[activeVehicleId] || 10) + 1;
    renderContent();
  };

  Array.prototype.forEach.call(content.querySelectorAll('.cost-chart-bar-group'), function(g){
    g.addEventListener('click', function(){
      var year = g.getAttribute('data-year');
      historyFilters.category = 'all';
      historyFilters.garage = '';
      historyFilters.search = '';
      historyFilters.invoiceOnly = false;
      historyFilters.dateFrom = year + '-01-01';
      historyFilters.dateTo = year + '-12-31';
      historySectionCollapsed[activeVehicleId] = false;
      renderContent();
      var histSection = document.getElementById('historique-section');
      if(histSection) histSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  var printBtn = document.getElementById('printBtn');
  if(printBtn) printBtn.onclick = printVehicle;

  var exportCsvBtn = document.getElementById('exportCsvBtn');
  if(exportCsvBtn) exportCsvBtn.onclick = function(){ exportHistoryCSV(activeVehicleId); };

  var emailHistoryBtn = document.getElementById('emailHistoryBtn');
  if(emailHistoryBtn) emailHistoryBtn.onclick = function(){ openEmailExportModal(activeVehicleId); };

  var histFilterCategory = document.getElementById('histFilterCategory');
  if(histFilterCategory) histFilterCategory.onchange = function(){ historyFilters.category = histFilterCategory.value; rerenderPreservingFocus(); };

  var histFilterGarage = document.getElementById('histFilterGarage');
  if(histFilterGarage) histFilterGarage.oninput = debounce(function(){ historyFilters.garage = histFilterGarage.value; rerenderPreservingFocus(); }, 300);

  var histFilterSearch = document.getElementById('histFilterSearch');
  if(histFilterSearch) histFilterSearch.oninput = debounce(function(){ historyFilters.search = histFilterSearch.value; rerenderPreservingFocus(); }, 300);

  var histFilterDateFrom = document.getElementById('histFilterDateFrom');
  if(histFilterDateFrom) histFilterDateFrom.onchange = function(){ historyFilters.dateFrom = histFilterDateFrom.value; rerenderPreservingFocus(); };

  var histFilterDateTo = document.getElementById('histFilterDateTo');
  if(histFilterDateTo) histFilterDateTo.onchange = function(){ historyFilters.dateTo = histFilterDateTo.value; rerenderPreservingFocus(); };

  var histFilterInvoice = document.getElementById('histFilterInvoice');
  if(histFilterInvoice) histFilterInvoice.onchange = function(){ historyFilters.invoiceOnly = histFilterInvoice.checked; rerenderPreservingFocus(); };

  var histFilterReset = document.getElementById('histFilterReset');
  if(histFilterReset) histFilterReset.onclick = function(){
    historyFilters = { category: 'all', garage: '', search: '', invoiceOnly: false, dateFrom: '', dateTo: '' };
    renderContent();
  };

  var saleDossierBtn = document.getElementById('saleDossierBtn');
  if(saleDossierBtn) saleDossierBtn.onclick = function(){ openSaleDossierModal(activeVehicleId); };

  var maintenanceSheetBtn = document.getElementById('maintenanceSheetBtn');
  if(maintenanceSheetBtn) maintenanceSheetBtn.onclick = function(){ openMaintenanceSheetModal(activeVehicleId); };

  var openSessionsBtn = document.getElementById('openSessionsBtn');
  if(openSessionsBtn) openSessionsBtn.onclick = function(){ openSessionsListModal(activeVehicleId); };

  var addDocBtn = document.getElementById('addDocBtn');
  var docFileInput = document.getElementById('docFileInput');
  if(addDocBtn && docFileInput){
    addDocBtn.onclick = function(){ docFileInput.click(); };
    docFileInput.onchange = async function(e){
      var file = e.target.files[0];
      docFileInput.value = ''; // permet de re-sélectionner le même fichier plus tard
      if(!file) return;

      addDocBtn.disabled = true;
      addDocBtn.textContent = '…';
      try {
        if(!cloudReady || !currentUser){
          await showAlert('Impossible d\'ajouter un document : non connecté.');
          return;
        }

        var dataUrl = await prepareDocForStorage(file);
        if(!dataUrl) return; // message déjà affiché par prepareDocForStorage

        if(!v.documents) v.documents = [];
        var storedType = (file.type && file.type.indexOf('image/') === 0) ? 'image/jpeg' : file.type;

        // Le fichier part dans le bucket privé ; seule la référence (chemin) est
        // gardée dans state, ça évite d'alourdir le JSON synchronisé.
        var path = await uploadDocToStorage(dataUrl, storedType, file.name, activeVehicleId);
        v.documents.push({ name: file.name, type: storedType, path: path });

        logEvent(activeVehicleId, 'Document ajouté : ' + file.name);
        await persist();
        renderContent();
      } catch(err) {
        console.error(err);
        await showAlert('Impossible d\'ajouter ce document.');
      } finally {
        addDocBtn.disabled = false;
        addDocBtn.textContent = '+';
      }
    };
  }

  Array.prototype.forEach.call(content.querySelectorAll('.doc-thumb'), function(el){
    el.onclick = function(){
      var idx = parseInt(el.getAttribute('data-doc-idx'), 10);
      var doc = v.documents && v.documents[idx];
      if(!doc) return;
      if(doc.path) openStorageDoc(doc.path);
      else if(doc.data) window.open(doc.data, '_blank');
    };
  });

  Array.prototype.forEach.call(content.querySelectorAll('.doc-remove'), function(btn){
    btn.onclick = async function(e){
      e.stopPropagation();
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      if(!isNaN(idx) && v.documents && v.documents[idx]){
        var removed = v.documents.splice(idx, 1)[0];
        if(removed.path) await deleteDocFromStorage(removed.path);
        logEvent(activeVehicleId, 'Document supprimé : ' + removed.name);
        await persist();
        renderContent();
      }
    };
  });

  // Charge les vraies vignettes d'images en arrière-plan (URLs signées groupées),
  // sans bloquer l'affichage initial (qui montre 🖼 en attendant).
  loadDocThumbnails(v, content);

  Array.prototype.forEach.call(content.querySelectorAll('.history-row'), function(row){
    row.onclick = function(){
      var entryId = row.getAttribute('data-entry-id');
      openEntryModal(entryId);
    };
  });

  Array.prototype.forEach.call(content.querySelectorAll('.session-badge-link'), function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      openSessionDetailModal(activeVehicleId, btn.getAttribute('data-session-id'));
    };
  });
}

function renderCtDefectRows(defects){
  return (defects || []).map(function(d){
    return '<div class="ct-defect-row" data-defect-id="' + d.id + '">' +
      '<input type="checkbox" class="ct-defect-resolved" ' + (d.resolved ? 'checked' : '') + '>' +
      '<input type="text" class="ct-defect-label" value="' + escapeHtml(d.label) + '" placeholder="Ex : Jeu de direction">' +
      '<button type="button" class="trash-btn ct-defect-remove" title="Retirer" aria-label="Retirer ce défaut">' + trashSvg() + '</button>' +
      '</div>';
  }).join('');
}

function renderCtSection(entry){
  var ct = (entry && entry.ct) || { result: 'ok', defects: [], counterVisit: null };
  var result = ct.result || 'ok';
  var deadline = (ct.counterVisit && ct.counterVisit.deadline) || '';
  var cvDone = !!(ct.counterVisit && ct.counterVisit.done);
  var cvDate = (ct.counterVisit && ct.counterVisit.date) || '';
  var cvResult = (ct.counterVisit && ct.counterVisit.result) || 'ok';

  var html = '<div class="ct-section" id="ctSection">';
  html += '<div class="field"><label>Résultat du contrôle technique</label><select id="ct-result">';
  html += '<option value="ok"' + (result === 'ok' ? ' selected' : '') + '>✅ Favorable</option>';
  html += '<option value="remarks"' + (result === 'remarks' ? ' selected' : '') + '>✅ Favorable avec remarques (défauts mineurs, levée optionnelle)</option>';
  html += '<option value="ko_major"' + (result === 'ko_major' ? ' selected' : '') + '>🟠 Défavorable — défaillance(s) majeure(s) (contre-visite sous 2 mois)</option>';
  html += '<option value="ko_critical"' + (result === 'ko_critical' ? ' selected' : '') + '>🔴 Défavorable — défaillance(s) critique(s) (validité limitée au jour même, contre-visite sous 2 mois)</option>';
  html += '</select></div>';

  html += '<div class="field"><label>Défauts / anomalies relevés</label>';
  html += '<div id="ctDefectsList">' + renderCtDefectRows(ct.defects) + '</div>';
  html += '<button type="button" class="ct-add-defect-btn" id="ctAddDefectBtn">+ Ajouter un défaut</button>';
  html += '</div>';

  var needsCv = (result === 'ko_major' || result === 'ko_critical');
  html += '<div id="ctCounterVisitWrap" style="display:' + (needsCv ? 'block' : 'none') + ';">';
  html += '<div class="ct-counter-visit">';
  html += '<div class="field-hint" style="margin-bottom:8px;">Les défaillances mineures éventuelles ne sont pas recontrôlées à la contre-visite (levée optionnelle).</div>';
  html += '<div class="field"><label>Date limite de contre-visite</label><input type="date" id="ct-cv-deadline" value="' + deadline + '"></div>';
  html += '<div class="type-row" style="border:none; padding:4px 0;"><input type="checkbox" id="ct-cv-done" ' + (cvDone ? 'checked' : '') + '><span class="name">Contre-visite effectuée</span></div>';
  html += '<div id="ctCvDoneFields" style="display:' + (cvDone ? 'block' : 'none') + ';">';
  html += '<div class="row2">';
  html += '<div class="field"><label>Date de la contre-visite</label><input type="date" id="ct-cv-date" value="' + cvDate + '"></div>';
  html += '<div class="field"><label>Résultat</label><select id="ct-cv-result"><option value="ok"' + (cvResult === 'ok' ? ' selected' : '') + '>✅ Favorable</option><option value="ko"' + (cvResult === 'ko' ? ' selected' : '') + '>❌ Toujours défavorable</option></select></div>';
  html += '</div></div>';
  html += '</div></div>';

  html += '</div>';
  return html;
}

function bindCtSectionEvents(){
  var resultSelect = document.getElementById('ct-result');
  var cvWrap = document.getElementById('ctCounterVisitWrap');
  var cvDeadlineInput = document.getElementById('ct-cv-deadline');
  if(resultSelect){
    resultSelect.onchange = function(){
      var isKo = (resultSelect.value === 'ko_major' || resultSelect.value === 'ko_critical');
      if(cvWrap) cvWrap.style.display = isKo ? 'block' : 'none';
      // Pré-remplit la date limite à +2 mois (délai légal, identique pour les deux
      // catégories de défaillance) si elle est vide
      if(isKo && cvDeadlineInput && !cvDeadlineInput.value){
        var dateInput = document.getElementById('f-date');
        var base = dateInput && dateInput.value ? new Date(dateInput.value) : new Date();
        base.setMonth(base.getMonth() + 2);
        cvDeadlineInput.value = base.toISOString().substring(0, 10);
      }
    };
  }

  var cvDoneCheckbox = document.getElementById('ct-cv-done');
  var cvDoneFields = document.getElementById('ctCvDoneFields');
  if(cvDoneCheckbox){
    cvDoneCheckbox.onchange = function(){
      if(cvDoneFields) cvDoneFields.style.display = cvDoneCheckbox.checked ? 'block' : 'none';
    };
  }

  var addDefectBtn = document.getElementById('ctAddDefectBtn');
  var defectsList = document.getElementById('ctDefectsList');
  if(addDefectBtn && defectsList){
    addDefectBtn.onclick = function(){
      var row = document.createElement('div');
      row.className = 'ct-defect-row';
      row.setAttribute('data-defect-id', genId('ctd'));
      row.innerHTML = '<input type="checkbox" class="ct-defect-resolved">' +
        '<input type="text" class="ct-defect-label" placeholder="Ex : Jeu de direction">' +
        '<button type="button" class="trash-btn ct-defect-remove" title="Retirer" aria-label="Retirer ce défaut">' + trashSvg() + '</button>';
      defectsList.appendChild(row);
      bindCtDefectRemove(row);
      row.querySelector('.ct-defect-label').focus();
    };
  }

  Array.prototype.forEach.call(document.querySelectorAll('.ct-defect-row'), bindCtDefectRemove);
}

function bindCtDefectRemove(row){
  var btn = row.querySelector('.ct-defect-remove');
  if(btn) btn.onclick = function(){ row.remove(); };
}

function collectCtData(){
  var result = document.getElementById('ct-result').value;
  var defects = [];
  Array.prototype.forEach.call(document.querySelectorAll('.ct-defect-row'), function(row){
    var labelInput = row.querySelector('.ct-defect-label');
    var label = labelInput ? labelInput.value.trim() : '';
    if(!label) return; // ignore les lignes vides
    defects.push({
      id: row.getAttribute('data-defect-id') || genId('ctd'),
      label: label,
      resolved: row.querySelector('.ct-defect-resolved').checked
    });
  });

  var counterVisit = null;
  if(result === 'ko_major' || result === 'ko_critical'){
    var done = document.getElementById('ct-cv-done').checked;
    counterVisit = {
      required: true,
      deadline: document.getElementById('ct-cv-deadline').value || null,
      done: done,
      date: done ? (document.getElementById('ct-cv-date').value || null) : null,
      result: done ? document.getElementById('ct-cv-result').value : null
    };
  }

  return { result: result, defects: defects, counterVisit: counterVisit };
}

var pendingInvoiceFile = null;   // File sélectionné mais pas encore uploadé (upload différé à l'enregistrement)
var removeInvoiceRequested = false;

function openEntryModal(entryId){
  editingEntryId = entryId;
  pendingInvoiceFile = null;
  removeInvoiceRequested = false;
  var v = state.vehicles[activeVehicleId];
  if(!v) return;

  var entries = state.entries[activeVehicleId] || [];
  var entry = entryId ? entries.filter(function(e){ return e.id === entryId; })[0] : null;

  var enabledTypes = v.enabledTypes || [];
  var availableTypes = state.types
    .filter(function(t){ return enabledTypes.indexOf(t.id) > -1 || (entry && entry.typeId === t.id); })
    .sort(function(a, b){ return a.label.localeCompare(b.label, 'fr'); });

  var typeSelectionHtml;
  if(entry){
    // Édition d'une intervention existante : un seul type, comme avant.
    var typeOptions = availableTypes.map(function(t){
      var selected = entry.typeId === t.id ? ' selected' : '';
      return '<option value="' + t.id + '"' + selected + '>' + escapeHtml(t.label) + '</option>';
    }).join('');
    typeSelectionHtml = '<div class="field"><label>Type d\'intervention</label><select id="f-type">' + typeOptions + '</select></div>';
  } else {
    // Nouvelle intervention : sélection multiple, pour loguer en une fois
    // plusieurs opérations réalisées le même jour au même kilométrage.
    var chips = availableTypes.map(function(t){
      return '<label class="type-select-chip"><input type="checkbox" class="f-type-multi" value="' + t.id + '">' + escapeHtml(t.label) + '</label>';
    }).join('');
    typeSelectionHtml = '<div class="field"><label>Type(s) d\'intervention</label>' +
      '<div class="type-select-list" id="typeSelectList">' + chips + '</div>' +
      '<button type="button" class="ct-add-defect-btn" id="quickAddTypeBtn" style="margin-top:8px;">+ Nouveau type</button>' +
      '<div class="quick-add-type-form" id="quickAddTypeForm" style="display:none;">' +
        '<input type="text" id="quickTypeName" placeholder="Nom du type (ex : Recharge Clim)">' +
        '<select id="quickTypeCategory">' + HISTORY_CATEGORIES.map(function(c){ return '<option value="' + c.id + '">' + c.label + '</option>'; }).join('') + '</select>' +
        '<button type="button" class="btn btn-primary" id="quickTypeCreateBtn" style="width:auto;">Créer</button>' +
      '</div>' +
    '</div>';
  }

  var modal = document.getElementById('modal');
  var title = entry ? 'Modifier l\'intervention' : 'Nouvelle intervention';
  var dateVal = entry ? entry.date : new Date().toISOString().substring(0, 10);
  var kmVal = entry ? entry.km : v.mileage;
  var notesVal = entry ? (entry.notes || '') : '';

      cb.addEventListener('change', function(){

          wrap.style.display = ctChecked ? 'block' : 'none';
          if(ctChecked && !document.getElementById('ct-result')){
            wrap.innerHTML = renderCtSection(null);

    // perdre la saisie déjà en cours (date, km, autres types cochés...).

      quickAddTypeBtn.onclick = function(){

        quickAddTypeForm.style.display = showing ? 'none' : 'flex';
        if(!showing) document.getElementById('quickTypeName').focus();
      };
    }
    var quickTypeCreateBtn = document.getElementById('quickTypeCreateBtn');
    if(quickTypeCreateBtn){
      quickTypeCreateBtn.onclick = async function(){
        var nameInput = document.getElementById('quickTypeName');
        var name = nameInput.value.trim();
        if(!name){ await showAlert('Merci de nommer le nouveau type.'); return; }
        var id = slugify(name);
        if(state.types.filter(function(t){ return t.id === id; }).length){
          await showAlert('Un type avec un nom trop proche existe déjà.');
          return;
        }
        var category = document.getElementById('quickTypeCategory').value;
        state.types.push({ id: id, label: name, km: null, months: null, category: category });
        if(!v.enabledTypes) v.enabledTypes = [];
        v.enabledTypes.push(id);
        if(!v.intervals) v.intervals = {};
        v.intervals[id] = { km: null, months: null };
        logEvent(activeVehicleId, 'Type d\'intervention créé : ' + name);
        await persist();

        // Ajoute la puce directement dans la liste déjà affichée, sans tout reconstruire.
        var list = document.getElementById('typeSelectList');
        if(list){
          var label = document.createElement('label');
          label.className = 'type-select-chip';
          label.innerHTML = '<input type="checkbox" class="f-type-multi" value="' + id + '" checked>' + escapeHtml(name);
          list.appendChild(label);
        }
        nameInput.value = '';
        quickAddTypeForm.style.display = 'none';
      };
    }
  }
}

async function saveEntry(){
  var vSave = state.vehicles[activeVehicleId];
  var date = document.getElementById('f-date').value;
  var kmField = document.getElementById('f-km');
  var km = kmField ? parseInt(kmField.value || '0', 10) : null;
  var sharedNotes = document.getElementById('f-notes').value.trim();
  var costInput = document.getElementById('f-cost').value;
  var cost = costInput === '' ? null : parseFloat(costInput);
  var garage = document.getElementById('f-garage').value.trim();
  var supplier = document.getElementById('f-supplier').value.trim();

  if(!date){ await showAlert('Merci de renseigner une date.'); return; }
  if(kmField && (isNaN(km) || km < 0)){ await showAlert('Le kilométrage doit être un nombre positif.'); return; }
  if(cost !== null && (isNaN(cost) || cost < 0)){ await showAlert('Le coût doit être un nombre positif.'); return; }

  var typeIds;
  if(editingEntryId){
    typeIds = [document.getElementById('f-type').value];
  } else {
    typeIds = Array.prototype.filter.call(document.querySelectorAll('.f-type-multi'), function(cb){ return cb.checked; })
      .map(function(cb){ return cb.value; });
    if(!typeIds.length){ await showAlert('Merci de sélectionner au moins un type d\'intervention.'); return; }
  }

  var conflict = km != null ? findKmConflict(activeVehicleId, date, km, editingEntryId) : null;
  if(conflict){
    var conflictType = state.types.filter(function(t){ return t.id === conflict.typeId; })[0];
    var conflictLabel = conflictType ? conflictType.label : conflict.typeId;
    var msg = 'Ce kilométrage (' + fmtKm(km) + ' le ' + fmtDate(date) + ') est incohérent avec une intervention déjà enregistrée : "' + conflictLabel + '" à ' + fmtKm(conflict.km) + ' le ' + fmtDate(conflict.date) + '. Continuer quand même ?';
    var okConflict = await showConfirm(msg, 'Continuer');
    if(!okConflict) return;
  }

  var v = state.vehicles[activeVehicleId];
  var now = new Date().toISOString();
  var ctData = (typeIds.indexOf('ct') > -1) ? collectCtData() : null;
  var list = state.entries[activeVehicleId] || [];

  // Upload de la facture (différé jusqu'ici pour connaître l'id de l'intervention/du lot)
  var saveBtn = document.getElementById('saveBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Enregistrement…'; }

  var invoiceDoc = null;
  var invoiceKeyId = editingEntryId || genId('batch');
  try {
    if(pendingInvoiceFile){
      var dataUrl = await prepareDocForStorage(pendingInvoiceFile);
      if(dataUrl){
        var storedType = (pendingInvoiceFile.type && pendingInvoiceFile.type.indexOf('image/') === 0) ? 'image/jpeg' : pendingInvoiceFile.type;
        var path = await uploadEntryInvoice(dataUrl, storedType, pendingInvoiceFile.name, activeVehicleId, invoiceKeyId);
        invoiceDoc = { name: pendingInvoiceFile.name, type: storedType, path: path };
      }
    }
  } catch(e){
    console.error('Erreur upload facture:', e);
    await showAlert('Impossible de joindre la facture, l\'intervention sera quand même enregistrée.');
  }

  if(editingEntryId){
    var typeId = typeIds[0];
    var typeObj = state.types.filter(function(t){ return t.id === typeId; })[0];
    var label = typeObj ? typeObj.label : typeId;
    for(var i = 0; i < list.length; i++){
      if(list[i].id === editingEntryId){
        list[i].typeId = typeId;
        list[i].date = date;
        list[i].km = km;
        list[i].notes = sharedNotes;
        list[i].cost = cost;
        list[i].garage = garage || null;
        list[i].supplier = supplier || null;
        list[i].updatedAt = now;
        if(ctData) list[i].ct = ctData; else delete list[i].ct;

        if(invoiceDoc){
          list[i].invoiceDoc = invoiceDoc;
        } else if(removeInvoiceRequested && list[i].invoiceDoc){
          await deleteInvoiceIfUnshared(list[i].invoiceDoc.path, activeVehicleId, editingEntryId);
          delete list[i].invoiceDoc;
        }
        break;
      }
    }
    logEvent(activeVehicleId, 'Intervention modifiée : ' + label + ' (' + fmtKm(km) + ', ' + fmtDate(date) + ')');
  } else {
    var batchId = (typeIds.length > 1) ? invoiceKeyId : null;
    var createdLabels = [];
    typeIds.forEach(function(tId){
      var tObj = state.types.filter(function(t){ return t.id === tId; })[0];
      var tLabel = tObj ? tObj.label : tId;
      // Texte partagé prioritaire s'il a été renseigné ; sinon on retombe sur la
      // référence propre à ce type pour ce véhicule (huile, pneus, pièce...).
      var refNote = (v.intervals && v.intervals[tId] && v.intervals[tId].notes) || '';
      var notesForThis = sharedNotes || refNote;

      var newEntry = {
        id: genId('e'),
        typeId: tId,
        date: date,
        km: km,
        notes: notesForThis,
        cost: cost,
        garage: garage || null,
        supplier: supplier || null,
        batchId: batchId,
        documents: [],
        createdAt: now,
        updatedAt: now
      };
      if(tId === 'ct' && ctData) newEntry.ct = ctData;
      if(invoiceDoc) newEntry.invoiceDoc = invoiceDoc;
      list.push(newEntry);
      createdLabels.push(tLabel);
    });
    logEvent(activeVehicleId, 'Intervention' + (createdLabels.length > 1 ? 's' : '') + ' ajoutée' + (createdLabels.length > 1 ? 's' : '') + ' : ' + createdLabels.join(', ') + ' (' + fmtKm(km) + ', ' + fmtDate(date) + ')');
  }

  if(v && km != null && km > v.mileage) v.mileage = km;

  pendingInvoiceFile = null;
  removeInvoiceRequested = false;

  await persist();
  closeModal();
  renderContent();
}

// Supprime le fichier de facture en Storage seulement si plus aucune autre
// intervention de ce véhicule ne le référence (cas d'une facture partagée).
async function deleteInvoiceIfUnshared(path, vehicleId, excludeEntryId){
  if(!path) return;
  var list = state.entries[vehicleId] || [];
  var stillUsed = list.some(function(e){ return e.id !== excludeEntryId && e.invoiceDoc && e.invoiceDoc.path === path; });
  if(!stillUsed) await deleteDocFromStorage(path);
}

async function deleteEntry(id){
  var ok = await showConfirm('Supprimer cette intervention ?', 'Supprimer');
  if(!ok) return;
  var list = state.entries[activeVehicleId] || [];
  var entry = list.filter(function(e){ return e.id === id; })[0];

  if(entry){
    var typeObj = state.types.filter(function(t){ return t.id === entry.typeId; })[0];
    var label = typeObj ? typeObj.label : entry.typeId;
    logEvent(activeVehicleId, 'Intervention supprimée : ' + label);
    if(entry.invoiceDoc) await deleteInvoiceIfUnshared(entry.invoiceDoc.path, activeVehicleId, id);
  }

  state.entries[activeVehicleId] = list.filter(function(e){ return e.id !== id; });
  await persist();
  closeModal();
  renderContent();
}

function closeModal(){
  var overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.classList.remove('open');
  editingEntryId = null;
}

// ---- Modale : Réglages du véhicule ----
// Capture l'état actuel du formulaire (cases cochées, valeurs km/mois, nom,
// couleur) et l'applique à v — utilisé avant tout rafraîchissement de la
// modale (ajout/suppression de type) pour ne jamais perdre une saisie en cours.
function collectSettingsFormData(v, modal, swatchWrap){
  var name = document.getElementById('s-name').value.trim();
  if(name) v.name = name;

  var selected = swatchWrap.querySelector('.swatch.selected');
  if(selected) v.color = selected.getAttribute('data-color');

  var vehicleTypeEl = document.getElementById('s-vehicletype');
  if(vehicleTypeEl){
    var wasTrailer = isTrailer(v);
    v.vehicleType = vehicleTypeEl.value;
    // En passant en remorque, on efface le kilométrage (qui n'a plus de sens) ;
    // en repassant à moteur, on repart de 0 si rien n'était enregistré avant.
    if(v.vehicleType === 'trailer' && !wasTrailer) v.mileage = null;
    if(v.vehicleType === 'motorized' && wasTrailer && v.mileage == null) v.mileage = 0;
  }

  var brandEl = document.getElementById('s-brand');
  if(brandEl) v.brand = brandEl.value.trim();
  var modelEl = document.getElementById('s-model');
  if(modelEl) v.model = modelEl.value.trim();
  var yearEl = document.getElementById('s-year');
  if(yearEl) v.year = yearEl.value.trim();
  var fuelEl = document.getElementById('s-fuel');
  if(fuelEl) v.fuel = fuelEl.value;
  var vinEl = document.getElementById('s-vin');
  if(vinEl) v.vin = vinEl.value.trim().toUpperCase();
  var firstRegEl = document.getElementById('s-firstreg');
  if(firstRegEl) v.firstRegDate = firstRegEl.value;
  var insuranceEl = document.getElementById('s-insurance');
  if(insuranceEl) v.insurance = insuranceEl.value.trim();

  // Note : l'activation/désactivation des types se fait désormais uniquement
  // via "Gérer les types pour plusieurs véhicules" (modale globale) — cette
  // modale n'affiche que les types déjà actifs et ne modifie donc plus v.enabledTypes.

  if(!v.intervals) v.intervals = {};
  Array.prototype.forEach.call(modal.querySelectorAll('.type-row input[type=number]'), function(inp){
    var t = inp.getAttribute('data-type');
    var field = inp.getAttribute('data-field');
    var val = inp.value === '' ? null : parseInt(inp.value, 10);
    if(!v.intervals[t]) v.intervals[t] = {};
    v.intervals[t][field] = val;
  });
  Array.prototype.forEach.call(modal.querySelectorAll('.type-row .ref-input'), function(inp){
    var t = inp.getAttribute('data-type');
    if(!v.intervals[t]) v.intervals[t] = {};
    v.intervals[t].notes = inp.value.trim() || null;
  });
  Array.prototype.forEach.call(modal.querySelectorAll('.type-row .notify-checkbox'), function(cb){
    var t = cb.getAttribute('data-type');
    if(!v.intervals[t]) v.intervals[t] = {};
    v.intervals[t].notify = cb.checked; // false = pas d'email pour ce type sur ce véhicule
  });
  Array.prototype.forEach.call(modal.querySelectorAll('.type-row .always-show-checkbox'), function(cb){
    var t = cb.getAttribute('data-type');
    if(!v.intervals[t]) v.intervals[t] = {};
    v.intervals[t].alwaysShowGauge = cb.checked;
  });
}
