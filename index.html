<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de bord — Entretien véhicules</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#1B1D1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet de Bord">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1B1D1E; --surface:#242628; --surface-2:#2B2E30; --border:#35383A;
    --text:#ECECE8; --text-muted:#9B9E9F; --yellow:#F0B429; --red:#D9534F; --green:#5FAE7D; --orange:#E8791A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app{ max-width:720px; margin:0 auto; padding:20px 16px 80px; }
  header.topbar{ display:flex; align-items:center; gap:12px; padding:4px 2px 18px; }
  .brand-mark{ width:38px;height:38px;flex:none; display:flex;align-items:center;justify-content:center; border:2px solid var(--yellow); border-radius:50%; color:var(--yellow); }
  .brand-text h1{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.06em; font-size:20px; margin:0; text-transform:uppercase; }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--text-muted); }
  nav.tabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto; }
  .tab-btn{
    font-family:'Oswald',sans-serif; background:none; border:none; color:var(--text-muted);
    font-size:14px; letter-spacing:0.04em; text-transform:uppercase; padding:10px 14px 12px;
    cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; transition:color .15s ease;
  }
  .tab-btn.active{ color:var(--text); }
  .tab-btn:hover{ color:var(--text); }
  .tab-add{ font-family:'Oswald',sans-serif; background:none; border:none; color:var(--text-muted); font-size:18px; padding:8px 12px 12px; cursor:pointer; flex:none; }
  .tab-add:hover{ color:var(--yellow); }

  .vehicle-header{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 16px; margin-bottom:22px; position:relative; border-top:3px solid var(--accent, var(--yellow)); }
  .vehicle-header .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .vehicle-name{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; margin:0; }
  .vehicle-plate-input{ background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:13px; padding:2px 0; margin-top:4px; width:150px; }
  .vehicle-plate-input:focus{ outline:none; border-color:var(--accent); color:var(--text); }
  .icon-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); width:34px;height:34px; border-radius:8px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex:none; }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent); }

  .mileage-row{ display:flex; align-items:baseline; gap:8px; margin-top:14px; }
  .vehicle-fiche{ font-size:11.5px; color:var(--text-muted); margin-top:6px; line-height:1.5; }
  .link-btn{ background:none; border:none; color:var(--yellow); font-size:11.5px; cursor:pointer; padding:0; text-decoration:underline; }
  .invoice-current{ font-size:12px; color:var(--text); margin-bottom:6px; }
  .cost-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin-bottom:10px; }
  .cost-stat{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .cost-stat-value{ font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; color:var(--yellow); }
  .cost-stat-label{ font-size:10.5px; color:var(--text-muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.05em; }
  .cost-by-year{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px 14px; }
  .cost-year-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .cost-year-row:last-child{ border-bottom:none; }
  .cost-chart-controls{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px; font-size:12.5px; color:var(--text-muted); }
  .cost-chart-btn{ width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cost-chart-btn:hover:not(:disabled){ border-color:var(--yellow); color:var(--yellow); }
  .cost-chart-btn:disabled{ opacity:.35; cursor:default; }
  .cost-chart-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 4px; }
  .cost-chart-svg{ width:100%; height:auto; display:block; }
  .cost-chart-bar-group:hover rect{ opacity:.8; }
  .cost-chart-legend{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:8px; }
  .hist-filters{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .hist-filters select, .hist-filters input[type=text], .hist-filters input[type=date]{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:12px; padding:7px 9px; border-radius:8px; }
  .hist-filters input[type=text]{ min-width:130px; flex:1; }
  .hist-filter-check{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .hist-filter-check input{ accent-color:var(--yellow); width:14px; height:14px; }
  .mileage-input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; border-radius:8px; padding:4px 10px; width:150px; }
  .mileage-input:focus{ outline:none; border-color:var(--accent); }
  .mileage-unit{ font-family:'JetBrains Mono',monospace; color:var(--text-muted); font-size:13px; }

  .doc-section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .doc-section-label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; }
  .doc-chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .doc-chip{ position:relative; width:64px; }
  .doc-thumb{ width:64px;height:64px;border-radius:8px; background:var(--surface-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; overflow:hidden; cursor:pointer; color:var(--text-muted); }
  .doc-thumb img{ width:100%; height:100%; object-fit:cover; }
  .doc-name{ font-size:10px; color:var(--text-muted); text-align:center; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc-remove{ position:absolute; top:-6px; right:-6px; width:18px;height:18px;border-radius:50%; background:var(--red); color:#fff; border:none; font-size:10px; line-height:18px; text-align:center; cursor:pointer; padding:0; }
  .doc-add-btn{ width:64px;height:64px;border-radius:8px; border:1px dashed var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:22px; display:flex;align-items:center;justify-content:center; flex:none; }
  .doc-add-btn:hover{ color:var(--yellow); border-color:var(--yellow); }
  .doc-add-btn:disabled{ opacity:.5; cursor:default; }

  h2.section-title{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin:0 0 10px 2px; display:flex; justify-content:space-between; align-items:center; }
  section{ margin-bottom:26px; }

  .gauge-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .gauge-ref{ font-size:11px; color:var(--text-muted); margin-top:3px; }
  .collapsible-title{ cursor:pointer; user-select:none; }
  .collapsible-title-inline{ cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px; }
  .collapse-chevron{ color:var(--text-muted); font-size:12px; }
  .jump-link{ display:inline-block; margin-top:10px; font-size:12px; color:var(--yellow); text-decoration:none; }
  .jump-link:hover{ text-decoration:underline; }
  .scroll-top-btn{ position:fixed; bottom:80px; right:16px; width:42px; height:42px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--yellow); font-size:18px; cursor:pointer; z-index:40; box-shadow:0 2px 8px rgba(0,0,0,.3); align-items:center; justify-content:center; }
  .scroll-top-btn:hover{ border-color:var(--yellow); }
  .gauge-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .gauge-label{ font-size:14px; font-weight:600; }
  .gauge-status{ font-family:'JetBrains Mono',monospace; font-size:12px; }
  .gauge-track{ height:8px; border-radius:4px; background:var(--surface-2); position:relative; overflow:hidden; border:1px solid var(--border); }
  .gauge-track .fill{ height:100%; border-radius:4px 0 0 4px; transition:width .3s ease; }
  .gauge-empty{ font-size:12.5px; color:var(--text-muted); font-style:italic; }

  .history-row{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:7px; cursor:pointer; }
  .history-row:hover{ border-color:var(--accent); }
  .history-icon{ width:34px;height:34px;flex:none; border-radius:8px; background:var(--surface-2); display:flex;align-items:center;justify-content:center; color:var(--accent); position:relative; }
  .history-icon .doc-dot{ position:absolute; bottom:-2px; right:-2px; width:9px;height:9px;border-radius:50%; background:var(--yellow); border:2px solid var(--surface); }
  .history-main{ flex:1; min-width:0; }
  .history-type{ font-size:14px; font-weight:600; }
  .history-notes{ font-size:12.5px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-meta{ text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); flex:none; }
  .history-meta .km{ color:var(--text); font-size:13px; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--text-muted); font-size:13.5px; border:1px dashed var(--border); border-radius:12px; }

  .fab{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); max-width:688px; width:calc(100% - 32px); display:flex; justify-content:flex-end; pointer-events:none; }
  .add-btn{ pointer-events:auto; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; background:var(--yellow); color:#1B1D1E; border:none; font-size:14px; font-weight:600; padding:13px 20px; border-radius:30px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .add-btn:hover{ filter:brightness(1.08); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px 20px 24px; }
  @media (min-width:600px){ .modal-overlay{ align-items:center; } .modal{ border-radius:16px; } }
  .modal h3{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:17px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
  .field select, .field input, .field textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; padding:10px 11px; border-radius:9px; }
  .field input[type=number], .field input[type=date]{ font-family:'JetBrains Mono',monospace; }
  .field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:60px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:13.5px; font-weight:600; padding:12px; border-radius:9px; border:1px solid var(--border); cursor:pointer; background:transparent; color:var(--text); }
  .btn-primary{ background:var(--yellow); color:#1B1D1E; border:none; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); }
  .btn-danger{ background:transparent; color:var(--red); border-color:var(--red); flex:none; padding:12px 16px; }

  .type-row{ padding:9px 0; border-bottom:1px solid var(--border); }
  .type-row:last-child{ border-bottom:none; }
  .type-row .type-row-main{ display:flex; align-items:center; gap:8px; }
  .type-row input[type=checkbox]{ width:16px;height:16px; accent-color: var(--yellow); flex:none; }
  .type-row .name{ flex:1; font-size:13.5px; background:transparent; border:1px solid transparent; color:var(--text); font-family:inherit; padding:4px 6px; border-radius:6px; }
  .type-row .name:focus{ border-color:var(--border); background:var(--surface-2); outline:none; }
  .type-row.disabled .name{ color:var(--text-muted); }
  .type-row input[type=number]{ width:58px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:6px 5px; border-radius:6px; text-align:center; }
  .type-row .unit{ font-size:11px; color:var(--text-muted); width:28px; }
  .type-row .ref-input{ width:100%; margin-top:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:12px; padding:6px 9px; border-radius:6px; }
  .type-row .ref-input::placeholder{ color:var(--text-muted); opacity:.7; }
  .notify-toggle{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); margin-top:6px; cursor:pointer; }
  .notify-toggle input{ accent-color:var(--yellow); width:14px; height:14px; }
  .trash-btn{ background:none; border:none; color:var(--text-muted); cursor:pointer; flex:none; padding:4px; display:flex; }
  .trash-btn:hover{ color:var(--red); }

  .add-type-row{ display:flex; gap:8px; margin-top:12px; }
  .add-type-row input{ flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:13.5px; padding:9px 11px; border-radius:9px; }
  .add-type-row button{ flex:none; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; }
  .add-type-row button:hover{ border-color:var(--yellow); color:var(--yellow); }

  .tm-type-row{ padding:12px 0; border-bottom:1px solid var(--border); }
  .tm-type-row:last-child{ border-bottom:none; }
  .tm-type-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .tm-type-category{ flex:none; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:12px; padding:8px 6px; border-radius:8px; }
  .tm-type-head input[type=text]{ flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:14px; font-weight:600; padding:8px 10px; border-radius:8px; }
  .tm-vehicle-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .tm-vehicle-chip{ display:flex; align-items:center; gap:5px; font-size:12px; background:var(--surface-2); border:1px solid var(--border); padding:5px 10px; border-radius:20px; cursor:pointer; }
  .tm-vehicle-chip input{ accent-color:var(--yellow); width:14px; height:14px; }
  .tm-vehicle-chip:has(input:checked){ border-color:var(--yellow); color:var(--yellow); }
  .tm-reminder-row{ display:flex; align-items:center; gap:6px; margin-bottom:9px; flex-wrap:wrap; }
  .tm-reminder-label{ font-size:12px; color:var(--text-muted); margin-right:2px; }
  .tm-reminder-input{ width:56px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12px; padding:5px 4px; border-radius:6px; text-align:center; }

  .type-select-list{ display:flex; flex-wrap:wrap; gap:7px; }
  .type-select-chip{ display:flex; align-items:center; gap:6px; font-size:13px; background:var(--surface-2); border:1px solid var(--border); padding:7px 12px; border-radius:20px; cursor:pointer; }
  .type-select-chip input{ accent-color:var(--yellow); width:15px; height:15px; flex:none; }
  .type-select-chip:has(input:checked){ border-color:var(--yellow); color:var(--yellow); background:rgba(240,180,41,.1); }
  .quick-add-type-form{ display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; padding:10px; background:var(--surface-2); border-radius:9px; }
  .quick-add-type-form input[type=text]{ flex:1; min-width:140px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:13px; padding:8px 10px; border-radius:8px; }
  .quick-add-type-form select{ background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:12px; padding:8px 6px; border-radius:8px; }

  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:4px; }
  .swatch{ width:32px;height:32px;border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch.selected{ border-color:var(--text); }

  .journal-row{ padding:10px 0; border-bottom:1px solid var(--border); }
  .journal-row:last-child{ border-bottom:none; }
  .journal-meta{ display:flex; gap:8px; align-items:center; margin-bottom:3px; }
  .journal-tag{ padding:2px 8px; border-radius:10px; font-size:10px; color:#fff; font-family:'Oswald',sans-serif; letter-spacing:0.03em; text-transform:uppercase; }
  .journal-time{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-muted); }
  .journal-msg{ font-size:13.5px; }

  .hr{ border:none; border-top:1px solid var(--border); margin:18px 0; }
  .loading{ text-align:center; padding:60px 10px; color:var(--text-muted); font-size:13.5px; }

  .auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--yellow);border-radius:16px;padding:26px}
  .auth-card h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .auth-card p{color:var(--text-muted);font-size:13px;line-height:1.5;margin:0 0 20px}
  .auth-btn{width:100%;padding:13px;border-radius:9px;border:1px solid var(--border);background:var(--yellow);color:#1B1D1E;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;cursor:pointer}
  .auth-status{font-size:12px;color:var(--text-muted);margin-top:12px;text-align:center;min-height:18px}
  .account-btn{font-size:11px!important;padding:7px 9px!important;width:auto!important}
  .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:6px}

  .sync-status{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); padding:4px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface); white-space:nowrap; transition:border-color .2s, color .2s; }
  .sync-status .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .sync-status.saving .dot{ background:var(--yellow); animation:pulse 1s infinite; }
  .sync-status.saving{ color:var(--yellow); border-color:var(--yellow); }
  .sync-status.synced .dot{ background:var(--green); }
  .sync-status.synced{ color:var(--green); }
  .sync-status.error .dot{ background:var(--red); }
  .sync-status.error{ color:var(--red); border-color:var(--red); cursor:pointer; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:80; padding:20px; }
  .confirm-overlay.open{ display:flex; }
  .confirm-box{ background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--red); border-radius:14px; width:100%; max-width:400px; padding:20px; }
  .confirm-box p{ font-size:14px; line-height:1.5; margin:0 0 18px; }
  .field-hint{ font-size:12px; color:var(--yellow); margin-top:5px; }

  .dash-banner{ padding:12px 16px; border-radius:10px; font-size:14px; font-weight:600; margin-bottom:16px; }

// ---- Confirmation stylée (remplace window.confirm) ----
function showConfirm(message, okLabel){
  return new Promise(function(resolve){
    var overlay = document.getElementById('confirmOverlay');
    var msgEl = document.getElementById('confirmMsg');
    var okBtn = document.getElementById('confirmOkBtn');
    var cancelBtn = document.getElementById('confirmCancelBtn');
    if(!overlay || !msgEl || !okBtn || !cancelBtn){ resolve(window.confirm(message)); return; }

    msgEl.textContent = message;
    okBtn.textContent = okLabel || 'Confirmer';
    overlay.classList.add('open');

    function cleanup(result){
      overlay.classList.remove('open');
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      resolve(result);
    }
    okBtn.onclick = function(){ cleanup(true); };
    cancelBtn.onclick = function(){ cleanup(false); };
  });
}

// ---- Alerte stylée (remplace window.alert) — réutilise la modale de confirmation
// avec le bouton "Annuler" masqué et un seul bouton "OK". ----
function showAlert(message){
  return new Promise(function(resolve){
    var overlay = document.getElementById('confirmOverlay');
    var msgEl = document.getElementById('confirmMsg');
    var okBtn = document.getElementById('confirmOkBtn');
    var cancelBtn = document.getElementById('confirmCancelBtn');
    if(!overlay || !msgEl || !okBtn || !cancelBtn){ window.alert(message); resolve(); return; }

    msgEl.textContent = message;
    okBtn.textContent = 'OK';
    okBtn.className = 'btn btn-primary';
    okBtn.style.flex = '1';
    cancelBtn.style.display = 'none';
    overlay.classList.add('open');

    function cleanup(){
      overlay.classList.remove('open');
      okBtn.onclick = null;
      okBtn.className = 'btn btn-danger';
      cancelBtn.style.display = '';
      resolve();
    }
    okBtn.onclick = cleanup;
  });
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'custom-'+Date.now();
}

// ---- Gestion des fichiers joints (documents) ----

var MAX_IMAGE_BYTES = 1.5 * 1024 * 1024;  // cible après compression (qualité d'aperçu suffisante)
var MAX_DOC_BYTES = 10 * 1024 * 1024;     // 10 Mo pour les PDF (ex : carnet d'entretien scanné multi-pages)

// Redimensionne et compresse une image côté client (limite la taille du base64 stocké)
function compressImage(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function(evt){
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.onerror = function(){ reject(new Error('Image illisible')); };
      img.src = evt.target.result;
    };
    reader.onerror = function(){ reject(new Error('Lecture du fichier impossible')); };
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(evt){ resolve(evt.target.result); };
    reader.onerror = function(){ reject(new Error('Lecture du fichier impossible')); };
    reader.readAsDataURL(file);
  });
}

// Retourne une dataURL prête à stocker, en compressant les images trop lourdes.
// Rejette (via alert) les fichiers non-image trop volumineux.
async function prepareDocForStorage(file){
  var isImage = file.type && file.type.indexOf('image/') === 0;

  if(isImage){
    // Compression systématique pour les images : limite la dimension et la taille finale
    var dataUrl = await compressImage(file, 1600, 0.75);
    if(dataUrl.length > MAX_IMAGE_BYTES){
      dataUrl = await compressImage(file, 1000, 0.6);
    }
    if(dataUrl.length > MAX_IMAGE_BYTES){
      await showAlert('Cette image reste trop volumineuse même après compression. Merci d\'en choisir une autre.');
      return null;
    }
    return dataUrl;
  }

  // Non-image (ex : PDF) : pas de compression possible, on applique juste une limite de taille
  if(file.size > MAX_DOC_BYTES){
    await showAlert('Ce fichier dépasse la taille maximale autorisée (' + Math.round(MAX_DOC_BYTES/1024/1024*10)/10 + ' Mo). Merci de choisir un fichier plus léger.');
    return null;
  }
  return readFileAsDataUrl(file);
}

function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(',');
  var mimeMatch = parts[0].match(/:(.*?);/);
  var mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  var binary = atob(parts[1]);
  var arr = new Uint8Array(binary.length);
  for(var i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// Upload un document dans le bucket privé, sous un chemin propre à l'utilisateur

// ---- Cache des URLs signées pour les vignettes d'images ----
// Évite de régénérer une URL signée à chaque re-render (ex: écho du realtime).
var thumbUrlCache = {}; // path -> { url, expiresAt }
var THUMB_URL_TTL_MS = 5 * 60 * 1000; // 5 minutes, cohérent avec la durée demandée à Supabase

// Récupère (en un seul appel groupé) les URLs signées des vignettes d'images
// manquantes ou expirées, puis met à jour les <div class="doc-thumb"> concernés
// dans le DOM sans redessiner toute la vue.
async function loadDocThumbnails(vehicle, containerEl){
  if(!cloudReady || !currentUser || !vehicle || !vehicle.documents) return;

  var now = Date.now();
  var toFetch = [];
  vehicle.documents.forEach(function(doc){
    if(!doc.path) return;
    if(!(doc.type && doc.type.indexOf('image/') === 0)) return;
    var cached = thumbUrlCache[doc.path];
    if(!cached || cached.expiresAt < now) toFetch.push(doc.path);
  });
  if(!toFetch.length){
    applyCachedThumbnails(vehicle, containerEl);
    return;
  }

  try {
    var res = await sb.storage.from(DOCS_BUCKET).createSignedUrls(toFetch, 300);
    if(res.error || !res.data) throw res.error || new Error('URLs non générées');
    res.data.forEach(function(item){
      if(item.signedUrl && !item.error){
        thumbUrlCache[item.path] = { url: item.signedUrl, expiresAt: now + THUMB_URL_TTL_MS };
      }
    });
  } catch(e){
    console.error('Erreur génération vignettes:', e);
  }

  applyCachedThumbnails(vehicle, containerEl);
}

function applyCachedThumbnails(vehicle, containerEl){
  vehicle.documents.forEach(function(doc, idx){
    if(!doc.path) return;
    if(!(doc.type && doc.type.indexOf('image/') === 0)) return;
    var cached = thumbUrlCache[doc.path];
    if(!cached) return;
    var el = containerEl.querySelector('.doc-thumb[data-doc-idx="' + idx + '"]');
    if(el && !el.querySelector('img')){
      el.innerHTML = '<img src="' + cached.url + '" alt="' + escapeHtml(doc.name) + '">';
    }
  });
}

function genId(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function debounce(fn, delay){
  var timer = null;
  return function(){
    var args = arguments;
    clearTimeout(timer);
    timer = setTimeout(function(){ fn.apply(null, args); }, delay);
  };
}

// renderContent() reconstruit tout le DOM à chaque appel — sans ça, taper dans un
// champ de filtre ferait perdre le focus à chaque caractère. On mémorise l'élément
// actif et la position du curseur, puis on les restaure après le nouveau rendu.
function rerenderPreservingFocus(){
  var active = document.activeElement;
  var activeId = active && active.id;
  var selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  var selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  renderContent();

  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

function fmtKm(km){
  if(km == null || isNaN(km)) return '—';
  return km.toLocaleString('fr-FR') + ' km';
}

function fmtEuro(n){
  if(n == null || isNaN(n)) return '—';
  return n.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' €';
}

// Calcule les statistiques de coûts d'un véhicule à partir de ses interventions,
// en ne comptant qu'une seule fois les factures partagées entre plusieurs lignes (batchId).
function computeCostStats(entries){
  var seenBatch = {};
  var uniqueCosts = []; // { cost, date, km }

  entries.forEach(function(e){
    if(e.cost == null) return;
    if(e.batchId){
      if(seenBatch[e.batchId]) return; // déjà compté via une autre ligne du même lot
      seenBatch[e.batchId] = true;
    }
    uniqueCosts.push({ cost: e.cost, date: e.date, km: e.km });
  });

  var total = uniqueCosts.reduce(function(sum, c){ return sum + c.cost; }, 0);
  var hasAny = uniqueCosts.length > 0;

  var perKm = null;
  if(hasAny){
    var kms = uniqueCosts.map(function(c){ return c.km; }).filter(function(k){ return k != null; });
    if(kms.length >= 2){
      var span = Math.max.apply(null, kms) - Math.min.apply(null, kms);
      if(span > 0) perKm = total / span;
    }
  }

  var thisYear = new Date().getFullYear();
  var byYearMap = {};
  uniqueCosts.forEach(function(c){
    var y = c.date ? new Date(c.date).getFullYear() : thisYear;
    byYearMap[y] = (byYearMap[y] || 0) + c.cost;
  });
  var byYear = Object.keys(byYearMap).sort(function(a,b){ return b - a; }).map(function(y){
    return { year: y, total: byYearMap[y] };
  });
  var currentYear = byYearMap[thisYear] != null ? byYearMap[thisYear] : null;

  return { hasAny: hasAny, total: total, perKm: perKm, currentYear: currentYear, byYear: byYear };
}

function median(nums){
  if(!nums.length) return null;
  var sorted = nums.slice().sort(function(a, b){ return a - b; });
  var mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// Construit un graphique en barres SVG "maison" (pas de librairie externe) montrant
// le coût par année sur les N années les plus récentes choisies, avec une ligne de
// moyenne. accentColor : couleur du véhicule (cohérence visuelle avec le reste).
function renderCostChart(byYearAll, yearsCount, accentColor){
  // byYearAll est trié du plus récent au plus ancien (cf computeCostStats) : on
  // prend les N premiers puis on repasse en ordre chronologique pour l'affichage.
  var slice = byYearAll.slice(0, yearsCount).slice().reverse();
  if(!slice.length) return { svg: '', avg: null, med: null };

  var totals = slice.map(function(d){ return d.total; });
  var avg = totals.reduce(function(s, t){ return s + t; }, 0) / totals.length;
  var med = median(totals);
  var maxVal = Math.max.apply(null, totals.concat([1]));

  var w = 640, h = 210;
  var pad = { top: 22, right: 14, bottom: 30, left: 14 };
  var chartW = w - pad.left - pad.right;
  var chartH = h - pad.top - pad.bottom;
  var gap = 12;
  var barW = Math.max(14, (chartW - gap * (slice.length - 1)) / slice.length);
  var totalBarsW = slice.length * barW + (slice.length - 1) * gap;
  var startX = pad.left + Math.max(0, (chartW - totalBarsW) / 2);

  var avgY = pad.top + chartH - (avg / maxVal) * chartH;

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="cost-chart-svg" preserveAspectRatio="xMidYMid meet">';
  svg += '<line x1="' + pad.left + '" y1="' + avgY.toFixed(1) + '" x2="' + (w - pad.right) + '" y2="' + avgY.toFixed(1) + '" style="stroke:var(--text-muted); stroke-width:1; stroke-dasharray:4,4;" />';
  svg += '<text x="' + (w - pad.right) + '" y="' + (avgY - 6).toFixed(1) + '" text-anchor="end" style="font-size:10px; fill:var(--text-muted); font-family:\'JetBrains Mono\',monospace;">moy. ' + Math.round(avg) + ' €</text>';

  slice.forEach(function(d, i){
    var barH = maxVal > 0 ? (d.total / maxVal) * chartH : 0;
    var x = startX + i * (barW + gap);
    var y = pad.top + chartH - barH;
    svg += '<g class="cost-chart-bar-group" data-year="' + d.year + '" style="cursor:pointer;">';
    svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(1, barH).toFixed(1) + '" rx="4" style="fill:' + accentColor + ';" />';
    svg += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + Math.max(pad.top - 6, y - 6).toFixed(1) + '" text-anchor="middle" style="font-size:10.5px; fill:var(--text); font-family:\'JetBrains Mono\',monospace;">' + Math.round(d.total) + '€</text>';
    svg += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (h - pad.bottom + 16).toFixed(1) + '" text-anchor="middle" style="font-size:11px; fill:var(--text-muted); font-family:\'Oswald\',sans-serif;">' + d.year + '</text>';
    svg += '</g>';
  });

  svg += '</svg>';
  return { svg: svg, avg: avg, med: med };
}

function fmtDate(dStr){
  if(!dStr) return '—';
  var parts = dStr.split('-');
  if(parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
  return dStr;
}

function fmtDateTime(ts){
  if(!ts) return '—';
  var d = new Date(ts);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

// ---- Export de l'historique (archive / revente) ----
function csvEscape(val){
  var s = (val == null) ? '' : String(val);
  if(/[";\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportHistoryCSV(vehicleId){
  var v = state.vehicles[vehicleId];
  if(!v) return;
  var entries = (state.entries[vehicleId] || []).slice().sort(function(a, b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.km || 0) - (b.km || 0);
  });

  // Point-virgule : s'ouvre correctement dans Excel FR sans réglage supplémentaire.
  var now = new Date();
  var costStats = computeCostStats(entries);
  var exportStamp = 'Export généré le ' + now.toLocaleDateString('fr-FR') + ' à ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) + ' — ' + v.name + ' (' + fmtKm(v.mileage) + ')';
  var rows = [[exportStamp]];
  if(costStats.hasAny){
    rows.push(['Total dépensé', fmtEuro(costStats.total)]);
    if(costStats.perKm != null) rows.push(['Coût moyen au km', fmtEuro(costStats.perKm)]);
  }
  rows.push([], ['Date', 'Type d\'intervention', 'Kilométrage', 'Coût (€)', 'Garage', 'Fournisseur', 'Facture', 'Notes', 'Résultat CT', 'Défauts relevés', 'Contre-visite']);
  entries.forEach(function(e){
    var typeObj = state.types.filter(function(t){ return t.id === e.typeId; })[0];
    var label = typeObj ? typeObj.label : e.typeId;

    var ctResult = '', ctDefects = '', ctCounterVisit = '';
    if(e.ct){
      var ctResultLabels = { ok: 'Favorable', remarks: 'Favorable avec remarques', ko_major: 'Défavorable (défaillance majeure)', ko_critical: 'Défavorable (défaillance critique)' };
      ctResult = ctResultLabels[e.ct.result] || '';

      var defects = e.ct.defects || [];
      if(defects.length){
        ctDefects = defects.map(function(d){ return d.label + (d.resolved ? ' (levé)' : ' (non levé)'); }).join(' | ');
      }

      if((e.ct.result === 'ko_major' || e.ct.result === 'ko_critical') && e.ct.counterVisit){
        var cv = e.ct.counterVisit;
        if(cv.done) ctCounterVisit = 'Effectuée le ' + fmtDate(cv.date) + ' — ' + (cv.result === 'ok' ? 'Favorable' : 'Toujours défavorable');
        else ctCounterVisit = 'À faire avant le ' + fmtDate(cv.deadline);
      }
    }

    var costStr = e.cost != null ? e.cost.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2}) + (e.batchId ? ' (facture partagée)' : '') : '';
    var invoiceStr = e.invoiceDoc ? e.invoiceDoc.name : '';

    rows.push([fmtDate(e.date), label, e.km != null ? e.km : '', costStr, e.garage || '', e.supplier || '', invoiceStr, e.notes || '', ctResult, ctDefects, ctCounterVisit]);
  });

  var csv = rows.map(function(row){ return row.map(csvEscape).join(';'); }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM pour un accentuation correcte dans Excel
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var safeName = (v.name || 'vehicule').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  a.download = 'historique-' + safeName + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function generateSaleDossier(vehicleId, options){
  var v = state.vehicles[vehicleId];
  if(!v) return;
  var entries = (state.entries[vehicleId] || []).slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.km || 0) - (b.km || 0);
  });

  var filtered = entries.filter(function(e){
    var typeObj = state.types.filter(function(t){ return t.id === e.typeId; })[0];
    var category = typeObj ? (typeObj.category || 'autre') : 'autre';
    if(options.categories.length && options.categories.indexOf(category) === -1) return false;
    if(options.dateFrom && e.date < options.dateFrom) return false;
    if(options.dateTo && e.date > options.dateTo) return false;
    return true;
  });

  var titre = [v.brand, v.model].filter(Boolean).join(' ') || v.name;
  var now = new Date();
  var nowStr = now.toLocaleDateString('fr-FR') + ' à ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

  var html = '<div id="dossier-top"></div>';
  html += '<div class="dossier-cover">';
  html += '<h1>' + escapeHtml(titre) + '</h1>';
  html += '<div class="dossier-sub">Dossier de vente — document généré le ' + nowStr + '</div>';
  html += '<a href="#dossier-bottom" class="jump-link dossier-jump">↓ Aller en bas (imprimer)</a>';
  html += '</div>';

  // Statut CT mis en avant (le premier critère regardé par un acheteur) — la date du
  // dernier CT est plus parlante que l'échéance interne, car c'est l'obligation légale
  // de vente (CT de moins de 6 mois) qui compte pour l'acheteur.
  var ctStatus = computeStatus(vehicleId, 'ct');
  if(ctStatus && ctStatus.last){
    var ctDate = ctStatus.last.date;
    var ctResultValue = ctStatus.last.ct ? ctStatus.last.ct.result : null;
    var ctResultLabels2 = { ok: 'Favorable', remarks: 'Favorable avec remarques', ko_major: 'Défavorable — défaillance majeure', ko_critical: 'Défavorable — défaillance critique' };
    var monthsSinceCt = ctDate ? (Date.now() - new Date(ctDate).getTime()) / (1000 * 60 * 60 * 24 * 30.44) : null;
    var pendingCv = ctStatus.needsCounterVisit;

    var ctClass, ctText;
    if(pendingCv){
      var isCritical = ctResultValue === 'ko_critical';
      ctClass = isCritical ? 'overdue' : (ctStatus.cvDeadlinePassed ? 'overdue' : 'warning');
      if(isCritical){
        ctText = '🔴 Défaillance critique — contre-visite ' + (ctStatus.cvDeadlinePassed ? 'non régularisée' : 'en attente (sous ' + ctStatus.remainingDays + ' j)');
      } else {
        ctText = ctStatus.cvDeadlinePassed ? '🟠 Contre-visite (défaillance majeure) non régularisée' : '🟠 Contre-visite (défaillance majeure) en attente';
      }
    } else if(monthsSinceCt != null && monthsSinceCt > 6){
      ctClass = 'overdue';
      ctText = '⚠️ Dernier CT : ' + fmtDate(ctDate) + ' — plus de 6 mois, un nouveau CT sera nécessaire pour la vente';
    } else {
      ctClass = 'ok';
      ctText = '✅ Dernier CT : ' + fmtDate(ctDate) + (ctResultValue ? ' (' + ctResultLabels2[ctResultValue] + ')' : '') + ' — moins de 6 mois';
    }
    html += '<div class="dossier-ct-banner ' + ctClass + '">' + ctText + '</div>';
  }

  // Fiche véhicule
  html += '<div class="dossier-section-title">Caractéristiques</div>';
  html += '<div class="dossier-fiche-grid">';
  if(!isTrailer(v)) html += '<div><span>Kilométrage : </span>' + fmtKm(v.mileage) + '</div>';
  html += '<div><span>Immatriculation : </span>' + escapeHtml(v.plate || '—') + '</div>';
  if(v.brand) html += '<div><span>Marque : </span>' + escapeHtml(v.brand) + '</div>';
  if(v.model) html += '<div><span>Modèle : </span>' + escapeHtml(v.model) + '</div>';
  if(v.year) html += '<div><span>Année : </span>' + escapeHtml(v.year) + '</div>';
  if(v.fuel) html += '<div><span>Carburant : </span>' + escapeHtml(v.fuel) + '</div>';
  if(v.vin) html += '<div><span>VIN : </span>' + escapeHtml(v.vin) + '</div>';
  if(v.firstRegDate) html += '<div><span>Mise en circulation : </span>' + fmtDate(v.firstRegDate) + '</div>';
  if(options.includeInsurance && v.insurance) html += '<div><span>Assurance : </span>' + escapeHtml(v.insurance) + '</div>';
  html += '</div>';

  // Coûts
  if(options.includeCosts){
    var costStats = computeCostStats(filtered);
    if(costStats.hasAny){
      html += '<div class="dossier-section-title">Entretien financier</div>';
      html += '<div class="dossier-fiche-grid">';
      html += '<div><span>Total dépensé (période sélectionnée) : </span>' + fmtEuro(costStats.total) + '</div>';
      if(costStats.perKm != null) html += '<div><span>Coût moyen au km : </span>' + fmtEuro(costStats.perKm) + '</div>';
      html += '</div>';
    }
  }

  // Historique filtré
  html += '<div class="dossier-section-title">Historique d\'entretien (' + filtered.length + ' intervention' + (filtered.length > 1 ? 's' : '') + ')</div>';
  if(!filtered.length){
    html += '<div class="field-hint">Aucune intervention ne correspond aux filtres sélectionnés.</div>';
  } else {
    filtered.slice().reverse().forEach(function(e){
      var typeObj = state.types.filter(function(t){ return t.id === e.typeId; })[0];
      var label = typeObj ? typeObj.label : e.typeId;
      html += '<div class="history-row" style="cursor:default;">';
      html += '<div class="history-main">';
      html += '<div class="history-type">' + escapeHtml(label) + '</div>';
      if(options.includeNotes && e.notes) html += '<div class="history-notes">' + escapeHtml(e.notes) + '</div>';
      if(options.includeGarage && e.garage) html += '<div class="history-notes">🔧 ' + escapeHtml(e.garage) + '</div>';
      if(options.includeGarage && e.supplier) html += '<div class="history-notes">📦 ' + escapeHtml(e.supplier) + '</div>';
      if(e.ct){
        var ctResultMap = { ok: ['✅ Favorable', 'ok'], remarks: ['✅ Favorable avec remarques', 'remarks'], ko_major: ['🟠 Défavorable (majeure)', 'ko-major'], ko_critical: ['🔴 Défavorable (critique)', 'ko-critical'] };
        var ctBadge = ctResultMap[e.ct.result] || ctResultMap.ok;
        html += '<span class="ct-badge ' + ctBadge[1] + '">' + ctBadge[0] + '</span>';
      }
      html += '</div>';
      html += '<div class="history-meta">';
      if(options.includeCosts && e.cost != null) html += '<div class="km">' + fmtEuro(e.cost) + '</div>';
      html += '<div class="km">' + fmtKm(e.km) + '</div>';
      html += '<div>' + fmtDate(e.date) + '</div>';
      html += '</div>';
      html += '</div>';
    });
  }

  var area = document.getElementById('dossierPrintArea');
  area.innerHTML = html;
  document.body.classList.add('dossier-mode');
  window.scrollTo(0, 0);

  // Charge les images de factures en arrière-plan si demandé (n'attend pas
  // avant d'afficher le dossier, pour ne pas bloquer l'aperçu)
  if(options.includeInvoiceImages){
    loadDossierInvoiceImages(filtered);
  }

  var actionsHtml = '<div id="dossier-bottom">' +
    '<div style="text-align:center; margin-bottom:10px;"><a href="#dossier-top" class="jump-link dossier-jump">↑ Remonter en haut</a></div>' +
    '<div class="dossier-actions">' +
      '<button class="btn btn-primary" id="dossierPrintNowBtn" style="width:auto; display:inline-block;">🖨 Imprimer / Enregistrer en PDF</button>' +
      '<button class="btn btn-ghost" id="dossierBackBtn" style="width:auto; display:inline-block;">← Retour à l\'app</button>' +
    '</div>' +
  '</div>';
  area.insertAdjacentHTML('beforeend', actionsHtml);
  document.getElementById('dossierPrintNowBtn').onclick = function(){ window.print(); };
  document.getElementById('dossierBackBtn').onclick = function(){
    document.body.classList.remove('dossier-mode');
    area.innerHTML = '';
  };
}

// Récupère les URLs signées des factures-images et les intègre visuellement
// dans le dossier (les PDF ne peuvent pas s'afficher en <img>, ils restent
// mentionnés par leur nom uniquement).
async function loadDossierInvoiceImages(entries){
  if(!cloudReady || !currentUser) return;
  var imagePaths = entries
    .filter(function(e){ return e.invoiceDoc && e.invoiceDoc.type && e.invoiceDoc.type.indexOf('image/') === 0; })
    .map(function(e){ return e.invoiceDoc.path; });
  if(!imagePaths.length) return;

  try {
    var res = await sb.storage.from(DOCS_BUCKET).createSignedUrls(imagePaths, 300);
    if(res.error || !res.data) return;
    var urlByPath = {};
    res.data.forEach(function(item){ if(item.signedUrl) urlByPath[item.path] = item.signedUrl; });

    var area = document.getElementById('dossierPrintArea');
    if(!area) return;
    var rows = area.querySelectorAll('.history-row');
    var idx = 0;
    entries.forEach(function(e){
      var rowEl = rows[entries.length - 1 - idx]; // la liste est affichée en ordre inversé (plus récent en premier)
      idx++;
      if(e.invoiceDoc && urlByPath[e.invoiceDoc.path] && rowEl){
        var img = document.createElement('img');
        img.className = 'dossier-invoice-img';
        img.src = urlByPath[e.invoiceDoc.path];
        img.alt = 'Facture';
        rowEl.querySelector('.history-main').appendChild(img);
      }
    });
  } catch(e){
    console.error('Erreur chargement images factures (dossier):', e);
  }
}

function groupByTheme(items){
  var groups = {};
  var order = [];
  items.forEach(function(c){
    var theme = c.theme || 'Autres vérifications';
    if(!groups[theme]){ groups[theme] = []; order.push(theme); }
    groups[theme].push(c);
  });
  return order.map(function(theme){ return { theme: theme, items: groups[theme] }; });
}

// ---- Modale : configuration et génération de la fiche d'entretien à faire ----
function openMaintenanceSheetModal(vehicleId){
  var v = state.vehicles[vehicleId];
  if(!v) return;
  var modal = document.getElementById('modal');
  var enabledTypeIds = v.enabledTypes || [];

  var typesWithStatus = enabledTypeIds.map(function(typeId){
    var st = computeStatus(vehicleId, typeId);
    return { typeId: typeId, st: st };
  }).filter(function(x){ return x.st; })
    .sort(function(a, b){ return a.st.cfg.label.localeCompare(b.st.cfg.label, 'fr'); });

  function statusLabel(st){
    if(!st.last) return 'Aucun historique';
    if(st.needsCounterVisit) return st.cvDeadlinePassed ? 'Contre-visite dépassée' : 'Contre-visite dans ' + st.remainingDays + ' j';
    var parts = [];
    if(st.remainingKm !== null) parts.push(st.remainingKm <= 0 ? 'dépassé de ' + Math.abs(st.remainingKm) + ' km' : 'dans ' + st.remainingKm.toLocaleString('fr-FR') + ' km');
    if(st.remainingDays !== null) parts.push(st.remainingDays <= 0 ? 'dépassé de ' + Math.abs(st.remainingDays) + ' j' : 'dans ' + st.remainingDays + ' j');
    return parts.length ? parts.join(' ou ') : 'Pas d\'échéance configurée';
  }

  function typeChecks(preselectMonths){
    return typesWithStatus.map(function(x){
      var preChecked = x.st.isOverdue || x.st.isWarning;
      if(preselectMonths != null && x.st.remainingDays != null){
        preChecked = x.st.remainingDays <= preselectMonths * 30.44;
      }
      return '<label class="tm-vehicle-chip" style="width:100%; justify-content:space-between;">' +
        '<span><input type="checkbox" class="msheet-type" value="' + x.typeId + '"' + (preChecked ? ' checked' : '') + '> ' + escapeHtml(x.st.cfg.label) + '</span>' +
        '<span class="field-hint" style="display:inline;">' + escapeHtml(statusLabel(x.st)) + '</span>' +
        '</label>';
    }).join('');
  }

  var checklistChecks = groupByTheme(state.checklistItems).map(function(grp){
    var itemsHtml = grp.items.map(function(c){
      return '<label class="tm-vehicle-chip"><input type="checkbox" class="msheet-checklist" value="' + c.id + '" checked>' + escapeHtml(c.label) + '</label>';
    }).join('');
    return '<div class="checklist-theme-block"><div class="checklist-theme-title">' + escapeHtml(grp.theme) + '</div><div class="tm-vehicle-list">' + itemsHtml + '</div></div>';
  }).join('');

  modal.innerHTML =
    '<h3>Fiche d\'entretien <button class="icon-btn" id="closeModalBtn" aria-label="Fermer">\u2715</button></h3>' +
    '<div class="field-hint" style="margin-bottom:10px;">Choisis les interventions à préparer, ou présélectionne automatiquement celles à échéance proche.</div>' +
    '<div class="row2">' +
      '<div class="field"><label>Présélectionner les échéances à moins de</label><input type="number" id="msheetMonths" value="6" min="1" style="width:70px; display:inline-block;"> mois</div>' +
      '<div class="field" style="display:flex; align-items:flex-end;"><button type="button" class="export-btn" id="msheetPreselectBtn">Appliquer</button></div>' +
    '</div>' +
    '<div class="field"><label>Interventions à inclure</label><div class="tm-vehicle-list" id="msheetTypesList" style="flex-direction:column; align-items:stretch;">' + typeChecks(null) + '</div></div>' +
    '<div class="field"><label>Checklist de vérifications d\'usage</label><div class="tm-vehicle-list" id="msheetChecklistList">' + checklistChecks + '</div>' +
      '<button type="button" class="export-btn" id="manageChecklistBtn" style="margin-top:8px;">⚙️ Gérer la checklist</button>' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="cancelBtn">Annuler</button>' +
      '<button class="btn btn-primary" id="generateMaintenanceSheetBtn">Générer la fiche</button>' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;

  document.getElementById('msheetPreselectBtn').onclick = function(){
    var months = parseInt(document.getElementById('msheetMonths').value || '6', 10);
    var list = document.getElementById('msheetTypesList');
    if(list) list.innerHTML = typeChecks(months);
  };

  document.getElementById('manageChecklistBtn').onclick = function(){ openChecklistManagerModal(vehicleId); };

  document.getElementById('generateMaintenanceSheetBtn').onclick = async function(){
    var selectedTypeIds = Array.prototype.filter.call(document.querySelectorAll('.msheet-type'), function(cb){ return cb.checked; }).map(function(cb){ return cb.value; });
    var selectedChecklistIds = Array.prototype.filter.call(document.querySelectorAll('.msheet-checklist'), function(cb){ return cb.checked; }).map(function(cb){ return cb.value; });
    if(!selectedTypeIds.length && !selectedChecklistIds.length){
      await showAlert('Sélectionne au moins une intervention ou un point de vérification.');
      return;
    }

    // Crée une session "planifiée" pour garder trace de cette fiche : coche des
    // vérifications, anomalies, et interventions marquées réalisées viendront
    // s'y rattacher au fil de l'entretien réel.
    if(!state.sessions[vehicleId]) state.sessions[vehicleId] = [];
    var session = {
      id: genId('sess'),
      date: new Date().toISOString().substring(0, 10),
      status: 'planned',
      plannedTypeIds: selectedTypeIds,
      checklistItemIds: selectedChecklistIds,
      checklistResults: selectedChecklistIds.map(function(id){ return { itemId: id, checked: false, anomaly: null }; }),
      entryIds: [],
      sessionNotes: '',
      createdAt: new Date().toISOString()
    };
    state.sessions[vehicleId].push(session);
    logEvent(vehicleId, 'Fiche d\'entretien créée (' + selectedTypeIds.length + ' intervention(s), ' + selectedChecklistIds.length + ' vérification(s))');
    await persist();

    closeModal();
    generateMaintenanceSheet(vehicleId, selectedTypeIds, selectedChecklistIds);
  };
}

// ---- Modale : gestion de la checklist de vérifications d'usage (globale) ----
function openChecklistManagerModal(returnToVehicleId){
  var modal = document.getElementById('modal');

  var themesSet = {};
  state.checklistItems.forEach(function(c){ if(c.theme) themesSet[c.theme] = true; });
  var themeOptionsHtml = Object.keys(themesSet).sort(function(a,b){ return a.localeCompare(b, 'fr'); })
    .map(function(t){ return '<option value="' + escapeHtml(t) + '">'; }).join('');

  var rows = state.checklistItems.map(function(c){
    return '<div class="ct-defect-row checklist-row" data-checklist-id="' + c.id + '">' +
      '<input type="text" class="checklist-item-theme" list="checklistThemesList" value="' + escapeHtml(c.theme || '') + '" placeholder="Thème (ex : Freinage)">' +
      '<input type="text" class="checklist-item-label" value="' + escapeHtml(c.label) + '" placeholder="Point de vérification">' +
      '<button type="button" class="trash-btn checklist-item-remove" title="Retirer" aria-label="Retirer ce point de vérification">' + trashSvg() + '</button>' +
      '</div>';
  }).join('');

  modal.innerHTML =
    '<h3>Checklist de vérifications d\'usage <button class="icon-btn" id="closeModalBtn" aria-label="Fermer">\u2715</button></h3>' +
    '<div class="field-hint" style="margin-bottom:10px;">Cette liste est partagée par tous les véhicules et réutilisée à chaque fiche d\'entretien. Groupe les points par thème pour une lecture plus claire (ex : Freinage, Niveaux et étanchéité).</div>' +
    '<datalist id="checklistThemesList">' + themeOptionsHtml + '</datalist>' +
    '<div id="checklistItemsList">' + rows + '</div>' +
    '<button type="button" class="ct-add-defect-btn" id="addChecklistItemBtn" style="margin-top:10px;">+ Ajouter un point de vérification</button>' +
    '<div class="modal-actions" style="margin-top:16px;">' +
      '<button class="btn btn-primary" id="cancelBtn">Fermer</button>' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  var closeAndReturn = function(){
    closeModal();
    if(returnToVehicleId) openMaintenanceSheetModal(returnToVehicleId);
  };
  document.getElementById('closeModalBtn').onclick = closeAndReturn;
  document.getElementById('cancelBtn').onclick = closeAndReturn;

  function bindRow(row){
    var removeBtn = row.querySelector('.checklist-item-remove');
    if(removeBtn) removeBtn.onclick = async function(){
      var id = row.getAttribute('data-checklist-id');
      state.checklistItems = state.checklistItems.filter(function(c){ return c.id !== id; });
      await persist();
      row.remove();
    };
    var labelInput = row.querySelector('.checklist-item-label');
    if(labelInput) labelInput.onchange = async function(){
      var id = row.getAttribute('data-checklist-id');
      var item = state.checklistItems.filter(function(c){ return c.id === id; })[0];
      if(!item) return;
      var newLabel = labelInput.value.trim();
      if(!newLabel){ labelInput.value = item.label; return; }
      item.label = newLabel;
      await persist();
    };
    var themeInput = row.querySelector('.checklist-item-theme');
    if(themeInput) themeInput.onchange = async function(){
      var id = row.getAttribute('data-checklist-id');
      var item = state.checklistItems.filter(function(c){ return c.id === id; })[0];
      if(!item) return;
      item.theme = themeInput.value.trim() || null;
      await persist();
    };
  }
  Array.prototype.forEach.call(modal.querySelectorAll('.checklist-row'), bindRow);

  document.getElementById('addChecklistItemBtn').onclick = async function(){
    var id = genId('chk');
    state.checklistItems.push({ id: id, label: '', theme: null });
    await persist();
    var list = document.getElementById('checklistItemsList');
    var row = document.createElement('div');
    row.className = 'ct-defect-row checklist-row';
    row.setAttribute('data-checklist-id', id);
    row.innerHTML = '<input type="text" class="checklist-item-theme" list="checklistThemesList" value="" placeholder="Thème (ex : Freinage)">' +
      '<input type="text" class="checklist-item-label" value="" placeholder="Point de vérification">' +
      '<button type="button" class="trash-btn checklist-item-remove" title="Retirer" aria-label="Retirer ce point de vérification">' + trashSvg() + '</button>';
    list.appendChild(row);
    bindRow(row);
    row.querySelector('.checklist-item-label').focus();
  };
}

function generateMaintenanceSheet(vehicleId, selectedTypeIds, selectedChecklistIds){
  var v = state.vehicles[vehicleId];
  if(!v) return;
  var entries = state.entries[vehicleId] || [];
  var now = new Date();
  var nowStr = now.toLocaleDateString('fr-FR') + ' à ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  var titre = [v.brand, v.model].filter(Boolean).join(' ') || v.name;

  var html = '<div id="dossier-top"></div>';
  html += '<div class="dossier-cover">';
  html += '<h1>Fiche d\'entretien — ' + escapeHtml(titre) + '</h1>';
  html += '<div class="dossier-sub">Préparée le ' + nowStr + (isTrailer(v) ? '' : ' — ' + fmtKm(v.mileage)) + '</div>';
  html += '<a href="#dossier-bottom" class="jump-link dossier-jump">↓ Aller en bas (imprimer)</a>';
  html += '</div>';

  if(selectedTypeIds.length){
    html += '<div class="dossier-section-title">Interventions à réaliser</div>';
    selectedTypeIds.forEach(function(typeId){
      var st = computeStatus(vehicleId, typeId);
      if(!st) return;
      var last = getLatestEntryFromList(entries, typeId);
      var refNote = (v.intervals && v.intervals[typeId] && v.intervals[typeId].notes) || '';

      html += '<div class="msheet-item">';
      html += '<div class="msheet-item-title">🔧 ' + escapeHtml(st.cfg.label) + '</div>';

      var deadlineParts = [];
      var hasThresholdMs = !!(st.cfg.km || st.cfg.months);
      if(st.needsCounterVisit){
        var cvDeadlineStrMs = (st.last && st.last.ct && st.last.ct.counterVisit && st.last.ct.counterVisit.deadline) ? fmtDate(st.last.ct.counterVisit.deadline) : null;
        deadlineParts.push(cvDeadlineStrMs
          ? (st.cvDeadlinePassed ? 'Contre-visite dépassée depuis le ' + cvDeadlineStrMs : 'Contre-visite à faire avant le ' + cvDeadlineStrMs)
          : (st.cvDeadlinePassed ? 'Contre-visite dépassée' : 'Contre-visite en attente'));
      } else if(hasThresholdMs && st.last){
        if(st.cfg.km){
          var kmThresholdMs = (st.last.km || 0) + st.cfg.km;
          deadlineParts.push(kmThresholdMs.toLocaleString('fr-FR') + ' km');
        }
        if(st.cfg.months && st.last.date){
          var dateThresholdMs = new Date(st.last.date);
          dateThresholdMs.setMonth(dateThresholdMs.getMonth() + st.cfg.months);
          deadlineParts.push('le ' + dateThresholdMs.toLocaleDateString('fr-FR'));
        }
      }
      var deadlineLabel = st.isOverdue ? 'Échéance dépassée : ' : 'À ne pas dépasser : ';
      if(deadlineParts.length) html += '<div class="msheet-item-line">📅 ' + escapeHtml(st.needsCounterVisit ? deadlineParts.join('') : deadlineLabel + deadlineParts.join(' ou ')) + '</div>';

      if(refNote) html += '<div class="msheet-item-line">🧰 Fournitures : ' + escapeHtml(refNote) + '</div>';

      if(last){
        var lastLine = 'Dernière fois le ' + fmtDate(last.date) + (last.km != null ? ' à ' + fmtKm(last.km) : '') + (last.garage ? ' chez ' + last.garage : '');
        html += '<div class="msheet-item-line">🕓 ' + escapeHtml(lastLine) + '</div>';
        if(last.notes) html += '<div class="msheet-item-line msheet-item-quote">« ' + escapeHtml(last.notes) + ' »</div>';
      } else {
        html += '<div class="msheet-item-line">🕓 Aucune intervention de ce type enregistrée jusqu\'ici</div>';
      }

      html += '</div>';
    });
  }

  if(selectedChecklistIds.length){
    html += '<div class="dossier-section-title">Vérifications d\'usage</div>';
    var selectedChecklistObjs = selectedChecklistIds.map(function(id){ return state.checklistItems.filter(function(c){ return c.id === id; })[0]; }).filter(Boolean);
    groupByTheme(selectedChecklistObjs).forEach(function(grp){
      html += '<div class="checklist-theme-title" style="margin-top:10px;">' + escapeHtml(grp.theme) + '</div>';
      html += '<div class="msheet-checklist-print">';
      grp.items.forEach(function(item){
        html += '<div class="msheet-checkbox-row"><span class="msheet-checkbox">☐</span>' + escapeHtml(item.label) + '</div>';
      });
      html += '</div>';
    });
  }

  var area = document.getElementById('dossierPrintArea');
  area.innerHTML = html;
  document.body.classList.add('dossier-mode');
  window.scrollTo(0, 0);

  var actionsHtml = '<div id="dossier-bottom">' +
    '<div style="text-align:center; margin-bottom:10px;"><a href="#dossier-top" class="jump-link dossier-jump">↑ Remonter en haut</a></div>' +
    '<div class="dossier-actions">' +
      '<button class="btn btn-primary" id="dossierPrintNowBtn" style="width:auto; display:inline-block;">🖨 Imprimer / Enregistrer en PDF</button>' +
      '<button class="btn btn-ghost" id="dossierBackBtn" style="width:auto; display:inline-block;">← Retour à l\'app</button>' +
    '</div>' +
  '</div>';
  area.insertAdjacentHTML('beforeend', actionsHtml);
  document.getElementById('dossierPrintNowBtn').onclick = function(){ window.print(); };
  document.getElementById('dossierBackBtn').onclick = function(){
    document.body.classList.remove('dossier-mode');
    area.innerHTML = '';
  };
}

function getLatestEntryFromList(entries, typeId){
  var filtered = entries.filter(function(e){ return e.typeId === typeId; });
  if(!filtered.length) return null;
  filtered.sort(function(a, b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.km || 0) - (a.km || 0);
  });
  return filtered[0];
}

// ---- Modale : liste des fiches d'entretien (sessions) d'un véhicule ----
function openSessionsListModal(vehicleId){
  var v = state.vehicles[vehicleId];
  if(!v) return;
  var modal = document.getElementById('modal');
  var sessions = (state.sessions[vehicleId] || []).slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var planned = sessions.filter(function(s){ return s.status === 'planned'; });
  var completed = sessions.filter(function(s){ return s.status === 'completed'; });

  function sessionRow(s){
    var typeLabels = s.plannedTypeIds.map(function(id){
      var t = state.types.filter(function(x){ return x.id === id; })[0];
      return t ? t.label : id;
    }).join(', ');
    return '<div class="history-row" data-session-id="' + s.id + '" style="cursor:pointer;">' +
      '<div class="history-main">' +
      '<div class="history-type">📋 ' + fmtDate(s.date) + '</div>' +
      (typeLabels ? '<div class="history-notes">' + escapeHtml(typeLabels) + '</div>' : '') +
      '<div class="history-notes">' + s.entryIds.length + ' / ' + s.plannedTypeIds.length + ' intervention(s) réalisée(s)' + (s.checklistItemIds.length ? ' · ' + s.checklistItemIds.length + ' vérification(s)' : '') + '</div>' +
      '</div></div>';
  }

  var html = '<h3>Fiches d\'entretien <button class="icon-btn" id="closeModalBtn" aria-label="Fermer">\u2715</button></h3>';
  if(planned.length){
    html += '<div class="field-hint" style="margin-bottom:8px;">En cours</div>' + planned.map(sessionRow).join('');
  }
  if(completed.length){
    html += '<div class="field-hint" style="margin:14px 0 8px;">Terminées</div>' + completed.map(sessionRow).join('');
  }
  if(!sessions.length){
    html += '<div class="empty-state">Aucune fiche d\'entretien pour ce véhicule.</div>';
  }
  html += '<div class="modal-actions" style="margin-top:16px;"><button class="btn btn-primary" id="cancelBtn">Fermer</button></div>';

  modal.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;

  Array.prototype.forEach.call(modal.querySelectorAll('[data-session-id]'), function(row){
    row.onclick = function(){ openSessionDetailModal(vehicleId, row.getAttribute('data-session-id')); };
  });
}

// ---- Modale : détail d'une fiche d'entretien — checklist interactive et
// interventions à marquer réalisées (créent une vraie ligne d'historique) ----
function openSessionDetailModal(vehicleId, sessionId){
  var v = state.vehicles[vehicleId];
  var sessions = state.sessions[vehicleId] || [];
  var session = sessions.filter(function(s){ return s.id === sessionId; })[0];
  if(!v || !session) return;
  var modal = document.getElementById('modal');
  var entries = state.entries[vehicleId] || [];
  var readOnly = session.status === 'completed';

  var checklistObjs = session.checklistItemIds.map(function(id){ return state.checklistItems.filter(function(c){ return c.id === id; })[0]; }).filter(Boolean);
  var checklistHtml = groupByTheme(checklistObjs).map(function(grp){
    var itemsHtml = grp.items.map(function(item){
      var res = session.checklistResults.filter(function(r){ return r.itemId === item.id; })[0] || { checked: false, anomaly: null };
      return '<div class="session-check-row" data-item-id="' + item.id + '">' +
        '<label class="type-row-main" style="border:none; padding:6px 0;"><input type="checkbox" class="session-check-box"' + (res.checked ? ' checked' : '') + (readOnly ? ' disabled' : '') + '><span class="name">' + escapeHtml(item.label) + '</span></label>' +
        '<input type="text" class="session-anomaly-input" placeholder="Anomalie / remarque (optionnel)" value="' + escapeHtml(res.anomaly || '') + '"' + (readOnly ? ' disabled' : '') + '>' +
        (readOnly ? '' : '<button type="button" class="link-btn session-anomaly-to-entry" data-item-id="' + item.id + '">+ Créer une intervention à partir de cette remarque</button>') +
        '</div>';
    }).join('');
    return '<div class="checklist-theme-block"><div class="checklist-theme-title">' + escapeHtml(grp.theme) + '</div>' + itemsHtml + '</div>';
  }).join('');

  var typesHtml = session.plannedTypeIds.map(function(typeId){
    var t = state.types.filter(function(x){ return x.id === typeId; })[0];
    var label = t ? t.label : typeId;
    var doneEntry = entries.filter(function(e){ return e.sessionId === session.id && e.typeId === typeId; })[0];
    if(doneEntry){
      return '<div class="msheet-item" style="border-left-color:var(--green);">' +
        '<div class="msheet-item-title">✅ ' + escapeHtml(label) + ' — réalisée</div>' +
        '<div class="msheet-item-line">Le ' + fmtDate(doneEntry.date) + (doneEntry.km != null ? ' à ' + fmtKm(doneEntry.km) : '') + (doneEntry.cost != null ? ' · ' + fmtEuro(doneEntry.cost) : '') + '</div>' +
        '</div>';
    }
    if(readOnly){
      return '<div class="msheet-item"><div class="msheet-item-title">⏳ ' + escapeHtml(label) + ' — non réalisée</div></div>';
    }
    return '<div class="msheet-item">' +
      '<div class="msheet-item-title">🔧 ' + escapeHtml(label) + '</div>' +
      '<button type="button" class="export-btn session-mark-done-btn" data-type="' + typeId + '">✅ Marquer réalisée</button>' +
      '<div class="session-done-form" id="doneForm-' + typeId + '" style="display:none; margin-top:10px;">' +
        '<div class="row2">' +
          '<div class="field"><label>Date</label><input type="date" class="session-done-date" value="' + new Date().toISOString().substring(0, 10) + '"></div>' +
          (isTrailer(v) ? '' : '<div class="field"><label>Kilométrage</label><input type="number" class="session-done-km" value="' + (v.mileage || 0) + '"></div>') +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label>Coût (€)</label><input type="number" step="0.01" min="0" class="session-done-cost"></div>' +
          '<div class="field"><label>Garage</label><input type="text" class="session-done-garage"></div>' +
        '</div>' +
        '<div class="field"><label>Notes</label><textarea class="session-done-notes"></textarea></div>' +
        '<button type="button" class="btn btn-primary session-save-done-btn" data-type="' + typeId + '" style="width:auto; display:inline-block;">Enregistrer cette intervention</button>' +
      '</div>' +
    '</div>';
  }).join('');

  modal.innerHTML =
    '<h3>Fiche du ' + fmtDate(session.date) + (readOnly ? ' (terminée)' : '') + ' <button class="icon-btn" id="closeModalBtn" aria-label="Fermer">\u2715</button></h3>' +
    (session.plannedTypeIds.length ? '<div class="dossier-section-title" style="margin-top:0;">Interventions</div>' + typesHtml : '') +
    (checklistObjs.length ? '<div class="dossier-section-title">Vérifications d\'usage</div>' + checklistHtml : '') +
    '<div class="modal-actions" style="margin-top:16px;">' +
      (!readOnly ? '<button class="btn btn-danger" id="deleteSessionBtn">Supprimer la fiche</button>' : '') +
      '<button class="btn btn-ghost" id="cancelBtn">Fermer</button>' +
      (!readOnly ? '<button class="btn btn-primary" id="completeSessionBtn">Terminer la session</button>' : '') +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;

  Array.prototype.forEach.call(modal.querySelectorAll('.session-check-row'), function(row){
    var itemId = row.getAttribute('data-item-id');
    var checkbox = row.querySelector('.session-check-box');
    var anomalyInput = row.querySelector('.session-anomaly-input');
    if(readOnly) return;
    function saveResult(){
      var res = session.checklistResults.filter(function(r){ return r.itemId === itemId; })[0];
      if(!res){ res = { itemId: itemId, checked: false, anomaly: null }; session.checklistResults.push(res); }
      res.checked = checkbox.checked;
      res.anomaly = anomalyInput.value.trim() || null;
      persist();
    }
    checkbox.onchange = saveResult;
    anomalyInput.onchange = saveResult;
  });

  Array.prototype.forEach.call(modal.querySelectorAll('.session-anomaly-to-entry'), function(btn){
    btn.onclick = function(){
      var itemId = btn.getAttribute('data-item-id');
      var item = state.checklistItems.filter(function(c){ return c.id === itemId; })[0];
      var row = modal.querySelector('.session-check-row[data-item-id="' + itemId + '"]');
      var noteText = row ? row.querySelector('.session-anomaly-input').value.trim() : '';
      closeModal();
      activeVehicleId = vehicleId;
      openEntryModal(null);
      var notesField = document.getElementById('f-notes');
      if(notesField) notesField.value = (item ? item.label + ' — ' : '') + noteText;
    };
  });

  Array.prototype.forEach.call(modal.querySelectorAll('.session-mark-done-btn'), function(btn){
    btn.onclick = function(){
      var typeId = btn.getAttribute('data-type');
      var form = document.getElementById('doneForm-' + typeId);
      if(form) form.style.display = (form.style.display === 'none') ? 'block' : 'none';
    };
  });

  Array.prototype.forEach.call(modal.querySelectorAll('.session-save-done-btn'), function(btn){
    btn.onclick = async function(){
      var typeId = btn.getAttribute('data-type');
      var form = document.getElementById('doneForm-' + typeId);
      var dateEl = form.querySelector('.session-done-date');
      var kmEl = form.querySelector('.session-done-km');
      var costInputEl = form.querySelector('.session-done-cost');
      var garageEl = form.querySelector('.session-done-garage');
      var notesEl = form.querySelector('.session-done-notes');

      var date = dateEl.value;
      if(!date){ await showAlert('Merci de renseigner une date.'); return; }
      var km = kmEl ? parseInt(kmEl.value || '0', 10) : null;
      if(kmEl && (isNaN(km) || km < 0)){ await showAlert('Le kilométrage doit être un nombre positif.'); return; }
      var cost = costInputEl.value === '' ? null : parseFloat(costInputEl.value);

      var vv = state.vehicles[vehicleId];
      var now = new Date().toISOString();
      var newEntry = {
        id: genId('e'),
        typeId: typeId,
        date: date,
        km: km,
        notes: notesEl.value.trim(),
        cost: cost,
        garage: garageEl.value.trim() || null,
        sessionId: session.id,
        documents: [],
        createdAt: now,
        updatedAt: now
      };
      var list = state.entries[vehicleId] || [];
      list.push(newEntry);
      state.entries[vehicleId] = list;
      session.entryIds.push(newEntry.id);
      if(vv && km != null && km > vv.mileage) vv.mileage = km;

      var tObj = state.types.filter(function(t){ return t.id === typeId; })[0];
      logEvent(vehicleId, 'Intervention réalisée (fiche du ' + fmtDate(session.date) + ') : ' + (tObj ? tObj.label : typeId));

      await persist();
      openSessionDetailModal(vehicleId, session.id);
    };
  });

  var completeBtn = document.getElementById('completeSessionBtn');
  if(completeBtn) completeBtn.onclick = async function(){
    session.status = 'completed';
    await persist();
    closeModal();
    renderContent();
  };

  var deleteSessionBtn = document.getElementById('deleteSessionBtn');
  if(deleteSessionBtn) deleteSessionBtn.onclick = async function(){
    var ok = await showConfirm('Supprimer cette fiche ? Les interventions déjà enregistrées à partir d\'elle resteront dans l\'historique.', 'Supprimer');
    if(!ok) return;
    state.sessions[vehicleId] = state.sessions[vehicleId].filter(function(s){ return s.id !== session.id; });
    await persist();
    closeModal();
    renderContent();
  };
}

async function sendHistoryByEmail(vehicleId){
  var recipientInput = document.getElementById('email-recipient');
  var noteInput = document.getElementById('email-note');
  var statusEl = document.getElementById('emailSendStatus');
  var sendBtn = document.getElementById('sendEmailBtn');

  var recipient = recipientInput.value.trim();
  if(!recipient || recipient.indexOf('@') === -1){
    statusEl.textContent = 'Merci de renseigner une adresse email valide.';
    statusEl.style.color = 'var(--red)';
    return;
  }

  if(!cloudReady || !currentUser){
    statusEl.textContent = 'Non connecté.';
    statusEl.style.color = 'var(--red)';
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = 'Envoi…';
  statusEl.textContent = '';

  try {
    var res = await sb.functions.invoke('send-history', {
      body: { vehicleId: vehicleId, recipientEmail: recipient, note: noteInput.value.trim() }
    });
    if(res.error){
      throw res.error;
    }
    statusEl.textContent = '✅ Email envoyé à ' + recipient;
    statusEl.style.color = 'var(--green)';
    setTimeout(closeModal, 1500);
  } catch(e){
    console.error('Erreur envoi email historique:', e);
    statusEl.textContent = '❌ Échec de l\'envoi. Réessayez dans un instant.';
    statusEl.style.color = 'var(--red)';
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Envoyer';
  }
}
